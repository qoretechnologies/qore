x-qore-normalized:
- reason: "These three listings answer a \"cursor_pages\" envelope whose \"next\" object carries \"per_page\" and \"starting_after\" - so Intercom pages them - but declare neither as a request parameter, which leaves a generated action unable to ask for page two. The omission is internal to this document rather than an API without paging: \"GET /conversations\" returns the *same* \"cursor_pages\" shape and does declare exactly those two parameters. The description contradicts itself, and these are the operations on the wrong side of it."
  operations:
  - "GET /articles"
  - "GET /contacts"
  - "GET /help_center/collections"
  add_parameters:
  - "per_page"
  - "starting_after"
  relax_oneof: []
