                    errors:
                    - code: "not_found"
                      message: "User Not Found"
                Tag not found:
                  value:
                    type: "error.list"
                    request_id: "8a3e4f88-ae65-433a-b4eb-46780ffc5402"
                    errors:
                    - code: "not_found"
                      message: "Resource Not Found"
              schema:
                $ref: "#/components/schemas/error"
        401:
          description: "Unauthorized"
          content:
            application/json:
              examples:
                Unauthorized:
                  value:
                    type: "error.list"
                    request_id: "9b1c9966-caeb-485a-8419-d707fd472c63"
                    errors:
                    - code: "unauthorized"
                      message: "Access Token Invalid"
              schema:
                $ref: "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              required:
              - "id"
              properties:
                id:
                  type: "string"
                  description: "The unique identifier for the tag which is given by Intercom"
                  example: "7522907"
            examples:
              successful:
                summary: "successful"
                value:
                  id: 81
              contact_not_found:
                summary: "Contact not found"
                value:
                  id: 82
              tag_not_found:
                summary: "Tag not found"
                value:
                  id: "123"
  /contacts/{contact_id}/tags/{tag_id}:
    delete:
      summary: "Remove tag from a contact"
      tags:
      - "Tags"
      - "Contacts"
      parameters:
      - name: "Intercom-Version"
        in: "header"
        schema:
          $ref: "#/components/schemas/intercom_version"
      - name: "contact_id"
        in: "path"
        description: "The unique identifier for the contact which is given by Intercom"
        example: "63a07ddf05a32042dffac965"
        required: true
        schema:
          type: "string"
      - name: "tag_id"
        in: "path"
        description: "The unique identifier for the tag which is given by Intercom"
        example: "7522907"
        required: true
        schema:
          type: "string"
      operationId: "detachTagFromContact"
      description: "You can remove tag from a specific contact. This will return a tag object for the tag that was removed from the contact."
      responses:
        200:
          description: "successful"
          content:
            application/json:
              examples:
                successful:
                  value:
                    type: "tag"
                    id: "84"
                    name: "Manual tag"
                    applied_at: 1663597223
                    applied_by:
                      type: "admin"
                      id: "456"
              schema:
                $ref: "#/components/schemas/tag"
        404:
          description: "Tag not found"
          content:
            application/json:
              examples:
                Contact not found:
                  value:
                    type: "error.list"
                    request_id: "b3d41080-5b35-42b8-8584-31e4660d355f"
                    errors:
                    - code: "not_found"
                      message: "User Not Found"
                Tag not found:
                  value:
                    type: "error.list"
                    request_id: "02871f7a-860e-433a-8545-6a73fbbe5e22"
