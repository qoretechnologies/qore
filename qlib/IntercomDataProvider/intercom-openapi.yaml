openapi: "3.0.1"
info:
  title: "Intercom API"
  version: "2.16"
  description: "The intercom API reference."
  contact:
    name: "Intercom Developer Hub"
    url: "https://developers.intercom.com"
  license:
    name: "MIT"
    url: "https://spdx.org/licenses/MIT"
paths:
  /admins:
    get:
      summary: "List all admins"
      parameters:
      - name: "Intercom-Version"
        in: "header"
        schema:
          $ref: "#/components/schemas/intercom_version"
      - name: "display_avatar"
        in: "query"
        required: false
        description: "If set to true, the response will include the admin's avatar object containing the image URL. Defaults to false."
        example: true
        schema:
          type: "boolean"
      tags:
      - "Admins"
      operationId: "listAdmins"
      description: "You can fetch a list of admins for a given workspace."
      responses:
        200:
          description: "Successful response"
          content:
            application/json:
              examples:
                Successful response:
                  value:
                    type: "admin.list"
                    admins:
                    - type: "admin"
                      email: "admin7@email.com"
                      id: "991267466"
                      name: "Ciaran7 Lee"
                      away_mode_enabled: false
                      away_mode_reassign: false
                      has_inbox_seat: true
                      team_ids: []
              schema:
                $ref: "#/components/schemas/admin_list"
        401:
          description: "Unauthorized"
          content:
            application/json:
              examples:
                Unauthorized:
                  value:
                    type: "error.list"
                    request_id: "5ef5682e-f66e-40a4-b828-8592175f83b8"
                    errors:
                    - code: "unauthorized"
                      message: "Access Token Invalid"
              schema:
                $ref: "#/components/schemas/error"
  /articles:
    get:
      summary: "List all articles"
      parameters:
      - name: "Intercom-Version"
        in: "header"
        schema:
          $ref: "#/components/schemas/intercom_version"
      - name: "per_page"
        in: "query"
        required: false
        description: "How many records to return in one page. Intercom documents cursor pagination for every listing that answers a \"pages\" object, but declares this parameter on only some of them."
        schema:
          type: "integer"
          minimum: 1
      - name: "starting_after"
        in: "query"
        required: false
        description: "The pagination cursor for the next page: pass the \"pages.next.starting_after\" value from the previous response. It is opaque and must not be constructed by hand."
        schema:
          type: "string"
      tags:
      - "Articles"
      operationId: "listArticles"
      description: "You can fetch a list of all articles by making a GET request to `https://api.intercom.io/articles`.\n\n> \U0001F4D8 How are the articles sorted and ordered?\n>\n> Articles will be returned in descending order on the `updated_at` attribute. This means if you need to iterate through results then we'll show the most recently updated articles first.\n"
      responses:
        200:
          description: "successful"
          content:
            application/json:
              examples:
                successful:
                  value:
                    type: "list"
                    pages:
                      type: "pages"
                      page: 1
                      per_page: 25
                      total_pages: 1
                    total_count: 1
                    data:
                    - id: "39"
                      type: "article"
                      workspace_id: "this_is_an_id64_that_should_be_at_least_4"
                      parent_ids: []
                      tags:
                        type: "tag.list"
                        tags: []
                      title: "This is the article title"
                      description: ""
                      body: ""
                      author_id: 991267492
                      state: "published"
                      created_at: 1734537283
                      updated_at: 1734537283
                      url: "http://help-center.test/myapp-64/en/articles/39-this-is-the-article-title"
              schema:
                $ref: "#/components/schemas/article_list"
        401:
          description: "Unauthorized"
          content:
            application/json:
              examples:
                Unauthorized:
                  value:
                    type: "error.list"
                    request_id: "2e760b85-9020-471b-89dc-f579ec8a0104"
                    errors:
                    - code: "unauthorized"
                      message: "Access Token Invalid"
              schema:
                $ref: "#/components/schemas/error"
    post:
      summary: "Create an article"
      parameters:
      - name: "Intercom-Version"
        in: "header"
        schema:
          $ref: "#/components/schemas/intercom_version"
      tags:
      - "Articles"
      operationId: "createArticle"
      description: "You can create a new article by making a POST request to `https://api.intercom.io/articles`.\n\n> \U0001F4D8 Tags cannot be managed via the Articles API\n>\n> Article tags are read-only in responses. To create, update, or delete tags, use the Intercom UI or the Tags API endpoints.\n"
      responses:
        200:
          description: "article created"
          content:
            application/json:
              examples:
                article created:
                  value:
                    id: "42"
                    type: "article"
                    workspace_id: "this_is_an_id68_that_should_be_at_least_4"
                    parent_ids: []
                    statistics:
                      type: "article_statistics"
                      views: 0
                      conversations: 0
                      reactions: 0
                      happy_reaction_percentage: 0
                      neutral_reaction_percentage: 0
                      sad_reaction_percentage: 0
                    tags:
                      type: "tag.list"
                      tags: []
                    title: "Thanks for everything"
                    description: "Description of the Article"
                    body: "<p class=\"no-margin\">Body of the Article</p>"
                    author_id: 991267497
                    state: "published"
                    created_at: 1734537288
                    updated_at: 1734537288
                    url: "http://help-center.test/myapp-68/en/articles/42-thanks-for-everything"
              schema:
                $ref: "#/components/schemas/article"
        400:
          description: "Bad Request"
          content:
            application/json:
              examples:
                Bad Request:
                  value:
                    type: "error.list"
                    request_id: "e522ca8a-cd15-404e-84b3-7f7536003d4a"
                    errors:
                    - code: "parameter_not_found"
                      message: "author_id must be in the main body or default locale translated_content object"
              schema:
                $ref: "#/components/schemas/error"
        401:
          description: "Unauthorized"
          content:
            application/json:
              examples:
                Unauthorized:
                  value:
                    type: "error.list"
                    request_id: "85e91429-72df-4e69-8a12-b55793dff59f"
                    errors:
                    - code: "unauthorized"
                      message: "Access Token Invalid"
              schema:
                $ref: "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/create_article_request"
            examples:
              article_created:
                summary: "article created"
                value:
                  title: "Thanks for everything"
                  description: "Description of the Article"
                  body: "Body of the Article"
                  author_id: 991267497
                  state: "published"
                  parent_id: 145
                  parent_type: "collection"
                  translated_content:
                    fr:
                      title: "Merci pour tout"
                      description: "Description de l'article"
                      body: "Corps de l'article"
                      author_id: 991267497
                      state: "published"
              bad_request:
                summary: "Bad Request"
                value:
                  title: "Thanks for everything"
                  description: "Description of the Article"
                  body: "Body of the Article"
                  state: "published"
  /help_center/collections:
    get:
      summary: "List all collections"
      parameters:
      - name: "Intercom-Version"
        in: "header"
        schema:
          $ref: "#/components/schemas/intercom_version"
      - name: "per_page"
        in: "query"
        required: false
        description: "How many records to return in one page. Intercom documents cursor pagination for every listing that answers a \"pages\" object, but declares this parameter on only some of them."
        schema:
          type: "integer"
          minimum: 1
      - name: "starting_after"
        in: "query"
        required: false
        description: "The pagination cursor for the next page: pass the \"pages.next.starting_after\" value from the previous response. It is opaque and must not be constructed by hand."
        schema:
          type: "string"
      tags:
      - "Help Center"
      operationId: "listAllCollections"
      description: "You can fetch a list of all collections by making a GET request to `https://api.intercom.io/help_center/collections`.\n\nCollections will be returned in descending order on the `updated_at` attribute. This means if you need to iterate through results then we'll show the most recently updated collections first.\n"
      responses:
        200:
          description: "Successful"
          content:
            application/json:
              examples:
                Successful:
                  value:
                    type: "list"
                    data:
                    - id: "159"
                      workspace_id: "this_is_an_id96_that_should_be_at_least_4"
                      name: "English collection title"
                      url: "http://help-center.test/myapp-96/collection-17"
                      order: 17
                      created_at: 1734537309
                      updated_at: 1734537309
                      description: "english collection description"
                      icon: "bookmark"
                      parent_id: null
                      help_center_id: 79
                    - id: "160"
                      workspace_id: "this_is_an_id96_that_should_be_at_least_4"
                      name: "English section title"
                      url: "http://help-center.test/myapp-96/section-1"
                      order: 1
                      created_at: 1734537309
                      updated_at: 1734537309
                      description: null
                      icon: "bookmark"
                      parent_id: "159"
                      help_center_id: null
                    total_count: 2
                    pages:
                      type: "pages"
                      page: 1
                      per_page: 20
                      total_pages: 1
              schema:
                $ref: "#/components/schemas/collection_list"
        401:
          description: "Unauthorized"
          content:
            application/json:
              examples:
                Unauthorized:
                  value:
                    type: "error.list"
                    request_id: "12c2d3a0-77ef-462e-a5ed-e67ddff50b6e"
                    errors:
                    - code: "unauthorized"
                      message: "Access Token Invalid"
              schema:
                $ref: "#/components/schemas/error"
  /companies:
    post:
      summary: "Create or Update a company"
      parameters:
      - name: "Intercom-Version"
        in: "header"
        schema:
          $ref: "#/components/schemas/intercom_version"
      tags:
      - "Companies"
      operationId: "createOrUpdateCompany"
      description: "You can create or update a company.\n\nCompanies will be only visible in Intercom when there is at least one associated user.\n\nCompanies are looked up via `company_id` in a `POST` request, if not found via `company_id`, the new company will be created, if found, that company will be updated.\n\n{% admonition type=\"warning\" name=\"Using `company_id`\" %}\n  You can set a unique `company_id` value when creating a company. However, it is not possible to update `company_id`. Be sure to set a unique value once upon creation of the company.\n{% /admonition %}\n"
      responses:
        200:
          description: "Successful"
          content:
            application/json:
              examples:
                Successful:
                  value:
                    type: "company"
                    company_id: "company_remote_id"
                    id: "6762f0761bb69f9f2193bae2"
                    app_id: "this_is_an_id147_that_should_be_at_least_"
                    name: "my company"
                    remote_created_at: 1374138000
                    created_at: 1734537334
                    updated_at: 1734537334
                    monthly_spend: 0
                    session_count: 0
                    user_count: 0
                    tags:
                      type: "tag.list"
                      tags: []
                    segments:
                      type: "segment.list"
                      segments: []
                    plan: {}
                    custom_attributes:
                      industry: "manufacturing"
              schema:
                $ref: "#/components/schemas/company"
        400:
          description: "Bad Request"
          content:
            application/json:
              examples:
                Bad Request:
                  value:
                    type: "error.list"
                    request_id: null
                    errors:
                    - code: "bad_request"
                      message: "bad 'test' parameter"
              schema:
                $ref: "#/components/schemas/error"
        401:
          description: "Unauthorized"
          content:
            application/json:
              examples:
                Unauthorized:
                  value:
                    type: "error.list"
                    request_id: "8a9f415f-e9df-41e9-ba1f-739914f66551"
                    errors:
                    - code: "unauthorized"
                      message: "Access Token Invalid"
              schema:
                $ref: "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/create_or_update_company_request"
            examples:
              successful:
                summary: "Successful"
                value:
                  company_id: "company_remote_id"
                  name: "my company"
                  remote_created_at: 1374138000
              bad_request:
                summary: "Bad Request"
                value:
                  test: "invalid"
  /companies/list:
    post:
      summary: "List all companies"
      parameters:
      - name: "Intercom-Version"
        in: "header"
        schema:
          $ref: "#/components/schemas/intercom_version"
      - name: "page"
        in: "query"
        required: false
        description: "The page of results to fetch. Defaults to first page"
        example: 1
        schema:
          type: "integer"
      - name: "per_page"
        in: "query"
        required: false
        description: "How many results to return per page. Defaults to 15"
        example: 15
        schema:
          type: "integer"
      - name: "order"
        in: "query"
        required: false
        description: "`asc` or `desc`. Return the companies in ascending or descending order. Defaults to desc"
        example: "desc"
        schema:
          type: "string"
      tags:
      - "Companies"
      operationId: "listAllCompanies"
      description: "You can list companies. The company list is sorted by the `last_request_at` field and by default is ordered descending, most recently requested first.\n\nNote that the API does not include companies who have no associated users in list responses.\n\nWhen using the Companies endpoint and the pages object to iterate through the returned companies, there is a limit of 10,000 Companies that can be returned. If you need to list or iterate on more than 10,000 Companies, please use the [Scroll API](https://developers.intercom.com/reference#iterating-over-all-companies).\n{% admonition type=\"warning\" name=\"Pagination\" %}\n  You can use pagination to limit the number of results returned. The default is `20` results per page.\n  See the [pagination section](https://developers.intercom.com/docs/build-an-integration/learn-more/rest-apis/pagination/#pagination-for-list-apis) for more details on how to use the `starting_after` param.\n{% /admonition %}\n"
      responses:
        200:
          description: "Successful"
          content:
            application/json:
              examples:
                Successful:
                  value:
                    type: "list"
                    data:
                    - type: "company"
                      company_id: "remote_companies_scroll_2"
                      id: "6762f0941bb69f9f2193bb25"
                      app_id: "this_is_an_id189_that_should_be_at_least_"
                      name: "IntercomQATest1"
                      remote_created_at: 1734537364
                      created_at: 1734537364
                      updated_at: 1734537364
                      monthly_spend: 0
                      session_count: 0
                      user_count: 4
                      tags:
                        type: "tag.list"
                        tags: []
                      segments:
                        type: "segment.list"
                        segments: []
                      plan: {}
                      custom_attributes: {}
                    pages:
                      type: "pages"
                      next: null
                      page: 1
                      per_page: 15
                      total_pages: 1
                    total_count: 1
              schema:
                $ref: "#/components/schemas/company_list"
        401:
          description: "Unauthorized"
          content:
            application/json:
              examples:
                Unauthorized:
                  value:
                    type: "error.list"
                    request_id: "537ccc45-2cae-4e72-ac2f-849f1422a771"
                    errors:
                    - code: "unauthorized"
                      message: "Access Token Invalid"
              schema:
                $ref: "#/components/schemas/error"
  /contacts/{contact_id}/notes:
    post:
      summary: "Create a note"
      parameters:
      - name: "Intercom-Version"
        in: "header"
        schema:
          $ref: "#/components/schemas/intercom_version"
      - name: "contact_id"
        in: "path"
        required: true
        description: "The unique identifier of a given contact."
        example: "123"
        schema:
          type: "integer"
      tags:
      - "Notes"
      - "Contacts"
      operationId: "createNote"
      description: "You can add a note to a single contact."
      responses:
        200:
          description: "Successful response"
          content:
            application/json:
              examples:
                Successful response:
                  value:
                    type: "note"
                    id: "31"
                    created_at: 1734537390
                    contact:
                      type: "contact"
                      id: "6762f0ad1bb69f9f2193bb62"
                    author:
                      type: "admin"
                      id: "991267583"
                      name: "Ciaran124 Lee"
                      email: "admin124@email.com"
                      away_mode_enabled: false
                      away_mode_reassign: false
                    body: "<p>Hello</p>"
              schema:
                $ref: "#/components/schemas/note"
        404:
          description: "Contact not found"
          content:
            application/json:
              examples:
                Admin not found:
                  value:
                    type: "error.list"
                    request_id: "168f1bc3-d198-4797-8422-9f93fe8af5ad"
                    errors:
                    - code: "not_found"
                      message: "Resource Not Found"
                Contact not found:
                  value:
                    type: "error.list"
                    request_id: "6f372239-0259-428f-9943-91b8f7a92162"
                    errors:
                    - code: "not_found"
                      message: "User Not Found"
              schema:
                $ref: "#/components/schemas/error"
      requestBody:
        content:
          application/json:
            schema:
              type: "object"
              required:
              - "body"
              properties:
                body:
                  type: "string"
                  description: "The text of the note."
                  example: "New note"
                admin_id:
                  type: "string"
                  description: "The unique identifier of a given admin."
                  example: "123"
            examples:
              successful_response:
                summary: "Successful response"
                value:
                  contact_id: "6762f0ad1bb69f9f2193bb62"
                  admin_id: 991267583
                  body: "Hello"
              admin_not_found:
                summary: "Admin not found"
                value:
                  contact_id: "6762f0af1bb69f9f2193bb63"
                  admin_id: 123
                  body: "Hello"
              contact_not_found:
                summary: "Contact not found"
                value:
                  contact_id: 123
                  admin_id: 991267585
                  body: "Hello"
  /contacts/{contact_id}/tags:
    get:
      summary: "List tags attached to a contact"
      tags:
      - "Contacts"
      - "Tags"
      parameters:
      - name: "Intercom-Version"
        in: "header"
        schema:
          $ref: "#/components/schemas/intercom_version"
      - name: "contact_id"
        in: "path"
        description: "The unique identifier for the contact which is given by Intercom"
        example: "63a07ddf05a32042dffac965"
        required: true
        schema:
          type: "string"
      operationId: "listTagsForAContact"
      description: "You can fetch a list of all tags that are attached to a specific contact."
      responses:
        200:
          description: "successful"
          content:
            application/json:
              examples:
                successful:
                  value:
                    type: "list"
                    data:
                    - type: "tag"
                      id: "80"
                      name: "Manual tag"
                      applied_at: 1663597223
                      applied_by:
                        type: "admin"
                        id: "456"
              schema:
                $ref: "#/components/schemas/tag_list"
        404:
          description: "Contact not found"
          content:
            application/json:
              examples:
                Contact not found:
                  value:
                    type: "error.list"
                    request_id: "302049fb-b8c1-4dc8-a327-a8f6e1923484"
                    errors:
                    - code: "not_found"
                      message: "User Not Found"
              schema:
                $ref: "#/components/schemas/error"
        401:
          description: "Unauthorized"
          content:
            application/json:
              examples:
                Unauthorized:
                  value:
                    type: "error.list"
                    request_id: "ca3c5e6e-c743-428b-aa8a-ac371a50cc39"
                    errors:
                    - code: "unauthorized"
                      message: "Access Token Invalid"
              schema:
                $ref: "#/components/schemas/error"
    post:
