      description: "An object containing information on the first users message. For a contact initiated message this will represent the users original message."
      properties:
        created_at:
          type: "integer"
          format: "date-time"
          description: ""
          example: 1663597223
        type:
          type: "string"
          description: ""
          example: "conversation"
        url:
          type: "string"
          nullable: true
          description: ""
          example: "https://developers.intercom.com/"
    conversation_list:
      title: "Conversation List"
      type: "object"
      description: "Conversations are how you can communicate with users in Intercom. They are created when a contact replies to an outbound message, or when one admin directly sends a message to a single contact."
      properties:
        type:
          type: "string"
          description: "Always conversation.list"
          enum:
          - "conversation.list"
          example: "conversation.list"
        conversations:
          type: "array"
          description: "The list of conversation objects"
          items:
            $ref: "#/components/schemas/conversation_list_item"
        total_count:
          type: "integer"
          description: "A count of the total number of objects."
          example: 12345
        pages:
          $ref: "#/components/schemas/cursor_pages"
    conversation_rating:
      title: "Conversation Rating"
      type: "object"
      nullable: true
      description: "The Conversation Rating object which contains information on the rating and/or remark added by a Contact and the Admin assigned to the conversation."
      properties:
        rating:
          type: "integer"
          description: "The rating, between 1 and 5, for the conversation."
          example: 5
        remark:
          type: "string"
          description: "An optional field to add a remark to correspond to the number rating"
          example: ""
        created_at:
          type: "integer"
          format: "date-time"
          description: "The time the rating was requested in the conversation being rated."
          example: 1671028894
        updated_at:
          type: "integer"
          format: "date-time"
          description: "The time the rating was last updated."
          example: 1671028894
        contact:
          $ref: "#/components/schemas/contact_reference"
        teammate:
          $ref: "#/components/schemas/reference"
    conversation_response_time:
      title: "Conversation response time"
      type: "object"
      description: "Details of first response time of assigned team in seconds."
      properties:
        team_id:
          type: "integer"
          description: "Id of the assigned team."
          example: 100
        team_name:
          type: "string"
          description: "Name of the assigned Team, null if team does not exist, Unassigned if no team is assigned."
          example: "Team One"
        response_time:
          type: "integer"
          description: "First response time of assigned team in seconds."
          example: 2310
    conversation_source:
      title: "Conversation source"
      type: "object"
      description: "The type of the conversation part that started this conversation. Can be Contact, Admin, Campaign, Automated or Operator initiated."
      properties:
        type:
          type: "string"
          description: "The origin of this conversation."
          example: "email"
        id:
          type: "string"
          nullable: true
          description: "The id of the source message."
          example: "3"
        delivered_as:
          type: "string"
          description: "How the conversation was initiated."
          example: "operator_initiated"
        recipients:
          type: "array"
          nullable: true
          description: "The recipients of the source message. Only present for email conversations."
          items:
            type: "object"
            properties:
              type:
                type: "string"
                description: "The recipient type. One of `to`, `cc`, or `bcc`."
                example: "to"
              email:
                type: "string"
                format: "email"
                description: "The recipient email address."
                example: "user@example.com"
              drop_reason:
                type: "string"
                nullable: true
                description: "The reason this recipient was dropped, if applicable."
                example: null
        reply_to:
          type: "array"
          nullable: true
          description: "The Reply-To header addresses of the source message, where a reply will be routed. Can differ from the sender's From address. Only present for email conversations."
          items:
            type: "object"
            properties:
              email:
                type: "string"
                format: "email"
                description: "The Reply-To email address."
                example: "replies@example.com"
              name:
                type: "string"
                nullable: true
                description: "The display name associated with the Reply-To address."
                example: "Support Team"
        subject:
          type: "string"
          description: "Optional. The message subject. For Twitter, this will show a generic message regarding why the subject is obscured. In webhook payloads for API version 2.15+, this field returns plain text."
          example: ""
        body:
          type: "string"
          description: "The message body, which may contain HTML. For Twitter, this will show a generic message regarding why the body is obscured. In webhook payloads for API version 2.15+, this field returns plain text."
          example: "<p>Hey there!</p>"
        author:
          $ref: "#/components/schemas/conversation_source_author"
        attachments:
          type: "array"
          description: "A list of attachments for the part."
          items:
            $ref: "#/components/schemas/part_attachment"
        url:
          type: "string"
          nullable: true
          description: "The URL where the conversation was started. For Twitter, Email, and Bots, this will be blank."
          example: null
        redacted:
          type: "boolean"
          description: "Whether or not the source message has been redacted. Only applicable for contact initiated messages."
          example: false
        email_message_metadata:
          $ref: "#/components/schemas/source_email_message_metadata"
    conversation_source_author:
      title: "Conversation source author"
      type: "object"
      description: "The author who started the conversation. Can be a Contact, Admin, or Bot."
      properties:
        type:
          type: "string"
          description: "The type of the author."
          example: "admin"
        id:
          type: "string"
          nullable: true
          description: "The id of the author."
          example: "274"
        name:
          type: "string"
          nullable: true
          description: "The name of the author."
          example: "Jane Doe"
        email:
          type: "string"
          format: "email"
          nullable: true
          description: "The email of the author."
          example: "jane.doe@example.com"
    source_email_message_metadata:
      title: "Email Message Metadata"
      type: "object"
      description: "Contains metadata if the message was sent as an email"
      properties:
        message_id:
          type: "string"
          nullable: true
          description: "The unique identifier for the email message as specified in the Message-ID header"
          example: "<CADKw7xrXzqSn8v3mP8K8Q8yZ6K8Q8yZ6@mail.gmail.com>"
        subject:
          type: "string"
          description: "The subject of the email"
          example: "Question about my order"
        email_address_headers:
          title: "Email Address Headers"
          type: "array"
          description: "A list of an email address headers."
          items:
            $ref: "#/components/schemas/email_address_header"
        history:
          type: "string"
          description: "The HTML content of any quoted or forwarded email history from the initial inbound message"
          example: "<div><span>On Jan 28, wrote:</span><blockquote>Previous thread</blockquote></div>"
    conversation_statistics:
      title: "Conversation statistics"
      type: "object"
      nullable: true
      description: "A Statistics object containing all information required for reporting, with timestamps and calculated metrics."
      properties:
        type:
          type: "string"
          description: ""
          example: "conversation_statistics"
        time_to_assignment:
          type: "integer"
          description: "Duration until last assignment before first admin reply. In seconds."
          example: 2310
        time_to_admin_reply:
          type: "integer"
          description: "Duration until first admin reply. Subtracts out of business hours. In seconds."
          example: 2310
        time_to_first_close:
          type: "integer"
          description: "Duration until conversation was closed first time. Subtracts out of business hours. In seconds."
          example: 2310
        time_to_last_close:
          type: "integer"
          description: "Duration until conversation was closed last time. Subtracts out of business hours. In seconds."
          example: 2310
        median_time_to_reply:
          type: "integer"
          description: "Median based on all admin replies after a contact reply. Subtracts out of business hours. In seconds."
          example: 2310
        first_contact_reply_at:
          type: "integer"
          format: "date-time"
          description: "Time of first text conversation part from a contact."
          example: 1663597233
        first_assignment_at:
          type: "integer"
          format: "date-time"
          description: "Time of first assignment after first_contact_reply_at."
          example: 1663597233
        first_admin_reply_at:
          type: "integer"
          format: "date-time"
          description: "Time of first admin reply after first_contact_reply_at."
          example: 1663597233
        first_close_at:
          type: "integer"
          format: "date-time"
          description: "Time of first close after first_contact_reply_at."
          example: 1663597233
        last_assignment_at:
          type: "integer"
          format: "date-time"
          description: "Time of last assignment after first_contact_reply_at."
          example: 1663597233
        last_assignment_admin_reply_at:
          type: "integer"
          format: "date-time"
          description: "Time of first admin reply since most recent assignment."
          example: 1663597233
        last_contact_reply_at:
          type: "integer"
          format: "date-time"
          description: "Time of the last conversation part from a contact."
          example: 1663597233
        last_admin_reply_at:
          type: "integer"
          format: "date-time"
          description: "Time of the last conversation part from an admin."
          example: 1663597233
        last_close_at:
          type: "integer"
          format: "date-time"
          description: "Time of the last conversation close."
          example: 1663597233
        last_closed_by_id:
          type: "string"
          description: "The last admin who closed the conversation. Returns a reference to an Admin object."
          example: "c3po"
        count_reopens:
          type: "integer"
          description: "Number of reopens after first_contact_reply_at."
          example: 1
        count_assignments:
          type: "integer"
          description: "Number of assignments after first_contact_reply_at."
          example: 1
        count_conversation_parts:
          type: "integer"
          description: "Total number of conversation parts."
          example: 1
        assigned_team_first_response_time:
          type: "array"
          description: "An array of conversation response time objects"
          items:
            $ref: "#/components/schemas/conversation_response_time"
        assigned_team_first_response_time_in_office_hours:
          type: "array"
          description: "An array of conversation response time objects within office hours"
          items:
            $ref: "#/components/schemas/conversation_response_time"
        handling_time:
          type: "integer"
          description: "Time from conversation assignment to conversation close in seconds."
          example: 2310
        adjusted_handling_time:
          type: "integer"
          nullable: true
          description: "Adjusted handling time for conversation in seconds. This is the active handling time excluding idle periods when teammates are not actively working on the conversation."
          example: 1800
    conversation_teammates:
      title: "Conversation teammates"
      type: "object"
      nullable: true
      description: "The list of teammates who participated in the conversation (wrote at least one conversation part)."
      properties:
        type:
          type: "string"
          description: "The type of the object - `admin.list`."
          example: "admin.list"
        teammates:
          type: "array"
          description: "The list of teammates who participated in the conversation (wrote at least one conversation part)."
          items:
            $ref: "#/components/schemas/reference"
    create_article_request:
      description: "You can create an Article"
      type: "object"
      title: "Create Article Request Payload"
      nullable: true
      properties:
        title:
          type: "string"
          description: "The title of the article.For multilingual articles, this will be the title of the default language's content."
          example: "Thanks for everything"
        description:
          type: "string"
          description: "The description of the article. For multilingual articles, this will be the description of the default language's content."
          example: "Description of the Article"
        body:
          type: "string"
          description: "The content of the article in HTML. For multilingual articles, this will be the body of the default language's content. Mutually exclusive with `body_markdown`."
          example: "<p>This is the body in html</p>"
        body_markdown:
          type: "string"
          description: "The content of the article in markdown. For multilingual articles, this will be the body of the default language's content. An alternative to `body` — you can provide content as markdown instead of HTML. Mutually exclusive with `body`."
          example: "# Hello\n\nA paragraph with **bold** text.\n"
        author_id:
          type: "integer"
          description: "The id of the author of the article. For multilingual articles, this will be the id of the author of the default language's content. Must be a teammate on the help center's workspace."
          example: 1295
        state:
          type: "string"
          description: "Whether the article will be `published` or will be a `draft`. Defaults to draft. For multilingual articles, this will be the state of the default language's content."
          enum:
          - "published"
          - "draft"
          example: "draft"
        parent_id:
          type: "integer"
          description: "The id of the article's parent collection or section. An article without this field stands alone."
          example: 18
        parent_type:
          type: "string"
          description: "The type of parent, which can either be a `collection` or `section`."
          example: "collection"
        translated_content:
          $ref: "#/components/schemas/article_translated_content"
        audience_ids:
          type: "array"
          nullable: true
          description: "The list of audience IDs to assign to this article for Fin AI Agent targeting. Sending a top-level `audience_ids` broadcasts the same set to every locale. For per-locale targeting, use `translated_content.<locale>.audience_ids` instead. Sending both top-level and per-locale in the same request causes top-level to win. Unknown audience IDs return a 404 error. No partial commit occurs."
          items:
            type: "integer"
          example:
          - 1
          - 2
        ai_chatbot_availability:
          type: "boolean"
          description: "Whether the article should be available for AI Chatbot (Fin). For multilingual articles, this sets the default language's availability."
          example: true
        ai_copilot_availability:
          type: "boolean"
          description: "Whether the article should be available for AI Copilot. For multilingual articles, this sets the default language's availability."
          example: true
        ai_sales_agent_availability:
          type: "boolean"
          description: "Whether the article should be available for AI Sales Agent. For multilingual articles, this sets the default language's availability."
          example: true
        scheduled_publish_at:
          type: "string"
          format: "date-time"
          nullable: true
          description: "ISO 8601 timestamp at which to schedule a future publish of the article. When set together with `state: \"published\"`, the article is scheduled instead of published immediately. Setting `null` cancels a pending publish schedule. Timestamps in the past or equal to the current time are rejected with 400 `parameter_invalid` — the value must be strictly in the future. Combining with `state: \"draft\"` returns 400 `parameter_invalid`. Sending in the same request as `scheduled_unpublish_at` returns 400 — only one pending schedule per article. Empty string returns 400 `parameter_invalid`."
          example: "2026-12-31T09:00:00Z"
        scheduled_unpublish_at:
          type: "string"
          format: "date-time"
          nullable: true
          description: "ISO 8601 timestamp at which to schedule a future unpublish of the article. Setting `null` cancels a pending unpublish schedule. Timestamps in the past or equal to the current time are rejected with 400 `parameter_invalid` — the value must be strictly in the future. Rejected with 400 `parameter_invalid` if the article has never been published. Sending in the same request as `scheduled_publish_at` returns 400 — only one pending schedule per article. Empty string returns 400 `parameter_invalid`."
          example: "2026-12-31T17:00:00Z"
      required:
      - "title"
      - "author_id"
    create_conversation_request:
      description: "Conversations are how you can communicate with users in Intercom. They are created when a contact replies to an outbound message, or when one admin directly sends a message to a single contact."
      type: "object"
      title: "Create Conversation Request Payload"
      properties:
        from:
          type: "object"
          properties:
            type:
              type: "string"
              enum:
              - "lead"
              - "user"
              - "contact"
              description: "The role associated to the contact - user or lead."
              example: "user"
            id:
              type: "string"
              description: "The identifier for the contact which is given by Intercom."
              format: "uuid"
              minLength: 24
              maxLength: 24
              example: "536e564f316c83104c000020"
          required:
          - "type"
          - "id"
        body:
          type: "string"
          description: "The content of the message. HTML is not supported."
          example: "Hello"
        subject:
          type: "string"
          description: "The title of the email. Only applicable if the message type is email."
          example: "Thanks for everything"
        attachment_urls:
          type: "array"
          description: "A list of image URLs that will be added as attachments. You can include up to 10 URLs."
          items:
            type: "string"
            format: "uri"
          maxItems: 10
        created_at:
          type: "integer"
          format: "date-time"
          description: "The time the conversation was created as a UTC Unix timestamp. If not provided, the current time will be used. This field is only recommneded for migrating past conversations from another source into Intercom."
          example: 1671028894
        brand_id:
          type: "string"
          description: "The unique identifier of the brand to associate with this conversation."
          example: "123"
      required:
      - "from"
      - "body"
    create_data_event_request:
      description: ""
      type: "object"
      title: "Create Data Event Request"
      properties:
        event_name:
          type: "string"
          description: "The name of the event that occurred. This is presented to your App's admins when filtering and creating segments - a good event name is typically a past tense 'verb-noun' combination, to improve readability, for example `updated-plan`."
          example: "invited-friend"
        created_at:
          type: "integer"
          format: "date-time"
          description: "The time the event occurred as a UTC Unix timestamp"
          example: 1671028894
        user_id:
          type: "string"
          description: "Your identifier for the user."
          example: "314159"
        id:
          type: "string"
          description: "The unique identifier for the contact (lead or user) which is given by Intercom."
          example: "8a88a590-e1c3-41e2-a502-e0649dbf721c"
        email:
          type: "string"
          description: "An email address for your user. An email should only be used where your application uses email to uniquely identify users."
          example: "frodo.baggins@example.com"
        metadata:
          type: "object"
          description: "Optional metadata about the event."
          additionalProperties:
            type: "string"
          example:
            invite_code: "ADDAFRIEND"
      anyOf:
      - title: "id required"
        required:
        - "event_name"
        - "created_at"
        - "id"
      - title: "user_id required"
        required:
        - "event_name"
        - "created_at"
        - "user_id"
      - title: "email required"
        required:
        - "event_name"
        - "created_at"
        - "email"
    create_message_request:
      description: "You can create a message"
      type: "object"
      title: "Create Message Request Payload"
      nullable: true
      properties:
        message_type:
          type: "string"
          description: "The kind of message being created. Values: `in_app`, `email` or `whatsapp`."
          enum:
          - "in_app"
          - "email"
          - "whatsapp"
          example: "in_app"
        subject:
          type: "string"
          description: "The title of the email."
          example: "Thanks for everything"
        body:
          type: "string"
          description: "The content of the message. HTML and plaintext are supported."
          example: "Hello there"
        template:
          type: "string"
          description: "The style of the outgoing message. Possible values `plain` or `personal`."
          example: "plain"
        from:
          type: "object"
          description: "The sender of the message. If not provided, the default sender will be used."
          properties:
            type:
              type: "string"
              description: "Always `admin`."
              enum:
              - "admin"
              example: "admin"
            id:
              type: "integer"
              description: "The identifier for the admin which is given by Intercom."
              example: 394051
          required:
          - "type"
          - "id"
        to:
          oneOf:
          - $ref: "#/components/schemas/recipient"
          - type: "array"
            description: "The recipients of the message."
            items:
              $ref: "#/components/schemas/recipient"
            example:
            - type: "user"
              id: "536e564f316c83104c000020"
            - type: "lead"
              id: "536e564f316c83104c000021"
        cc:
          oneOf:
          - $ref: "#/components/schemas/recipient"
          - type: "array"
            description: "The CC recipients of the message."
            items:
              $ref: "#/components/schemas/recipient"
            example:
            - type: "user"
              id: "536e564f316c83104c000023"
        bcc:
          oneOf:
          - $ref: "#/components/schemas/recipient"
          - type: "array"
            description: "The BCC recipients of the message."
            items:
              $ref: "#/components/schemas/recipient"
            example:
            - type: "user"
              id: "536e564f316c83104c000022"
        created_at:
          type: "integer"
          description: "The time the message was created. If not provided, the current time will be used."
          example: 1590000000
        create_conversation_without_contact_reply:
          type: "boolean"
          description: "Whether a conversation should be opened in the inbox for the message without the contact replying. Defaults to false if not provided."
          default: false
          example: true
      anyOf:
      - title: "message_type: `email`."
        required:
        - "message_type"
        - "subject"
        - "body"
        - "template"
        - "from"
        - "to"
      - title: "message_type: `inapp`."
        required:
        - "message_type"
        - "body"
        - "from"
        - "to"
      - title: "message_type: `whatsapp`."
        required:
        - "message_type"
        - "template"
        - "components"
        - "from"
        - "to"
    recipient:
      type: "object"
      title: "Recipient"
      description: "A recipient of a message"
      properties:
        type:
          type: "string"
          description: "The role associated to the contact - `user` or `lead`."
          enum:
          - "user"
          - "lead"
          example: "user"
        id:
          type: "string"
          description: "The identifier for the contact which is given by Intercom."
          example: "536e564f316c83104c000020"
      required:
      - "type"
      - "id"
    create_or_update_company_request:
      type: "object"
      title: "Create Or Update Company Request Payload"
      description: "You can create or update a Company"
      nullable: true
      properties:
        name:
          type: "string"
          description: "The name of the Company"
          example: "Intercom"
        company_id:
          type: "string"
          description: "The company id you have defined for the company. Can't be updated"
          example: "625e90fc55ab113b6d92175f"
        plan:
          type: "string"
          description: "The name of the plan you have associated with the company."
          example: "Enterprise"
        size:
          type: "integer"
          description: "The number of employees in this company."
          example: "100"
        website:
          type: "string"
          description: "The URL for this company's website. Please note that the value specified here is not validated. Accepts any string."
          example: "https://www.example.com"
        industry:
          type: "string"
          description: "The industry that this company operates in."
          example: "Manufacturing"
        custom_attributes:
          type: "object"
          description: "A hash of key/value pairs containing any other data about the company you want Intercom to store."
          additionalProperties:
            type: "string"
          example:
            paid_subscriber: true
            monthly_spend: 155.5
            team_mates: 9
        remote_created_at:
          type: "integer"
          description: "The time the company was created by you."
          example: 1394531169
        update_last_request_at:
          type: "boolean"
          description: "Set to true to update the company's last seen time to now."
          example: true
        monthly_spend:
          type: "integer"
          description: "How much revenue the company generates for your business. Note that this will truncate floats. i.e. it only allow for whole integers, 155.98 will be truncated to 155. Note that this has an upper limit of 2**31-1 or 2147483647.."
          example: 1000
    cursor_pages:
      title: "Cursor based pages"
      type: "object"
      description: "Cursor-based pagination is a technique used in the Intercom API to navigate through large amounts of data.\nA \"cursor\" or pointer is used to keep track of the current position in the result set, allowing the API to return the data in small chunks or \"pages\" as needed.\n"
      nullable: true
      properties:
        type:
          type: "string"
          description: "the type of object `pages`."
          example: "pages"
          enum:
          - "pages"
        page:
          type: "integer"
          description: "The current page"
          example: 1
        next:
          $ref: "#/components/schemas/starting_after_paging"
        per_page:
          type: "integer"
          description: "Number of results per page"
          example: 2
        total_pages:
          type: "integer"
          description: "Total number of pages"
          example: 13
    custom_attributes:
      title: "Custom Attributes"
      type: "object"
      description: "An object containing the different custom attributes associated to the conversation as key-value pairs. For relationship attributes the value will be a list of custom object instance models. System-defined attributes such as \"CX Score rating\" and \"CX Score explanation\" may also be included."
      additionalProperties:
        anyOf:
        - type: "string"
        - type: "integer"
        - $ref: "#/components/schemas/datetime"
        - $ref: "#/components/schemas/custom_object_instance_list"
      example:
        paid_subscriber: true
        monthly_spend: 155.5
        team_mates: 9
        start_date_iso8601: "2023-03-04T09:46:14Z"
        end_date_timestamp: 1677923174
        CX Score rating: 4
