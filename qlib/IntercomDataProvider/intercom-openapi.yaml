                  - type: "lead"
                    id: "6762f23c1bb69f9f2193bc1b"
                  - type: "user"
                    id: "6762f23d1bb69f9f2193bc1c"
                  cc:
                  - type: "user"
                    id: "6762f23e1bb69f9f2193bc1d"
                  - type: "user"
