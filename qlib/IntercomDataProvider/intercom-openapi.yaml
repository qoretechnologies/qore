          type: "boolean"
          description: "Whether the article is available for AI Chatbot. For multilingual articles, this will be the value of the default language's content."
          example: true
        ai_copilot_availability:
          type: "boolean"
          description: "Whether the article is available for AI Copilot. For multilingual articles, this will be the value of the default language's content."
          example: true
        ai_sales_agent_availability:
          type: "boolean"
          description: "Whether the article is available for AI Sales Agent. For multilingual articles, this will be the value of the default language's content."
          example: true
        created_by_id:
          type: "integer"
          nullable: true
          readOnly: true
          description: "The ID of the teammate who created the article. For multilingual articles, this will be the creator of the default language's content."
          example: 5017691
        updated_by_id:
          type: "integer"
          nullable: true
          readOnly: true
          description: "The ID of the teammate who last updated the article. For multilingual articles, this will be the last editor of the default language's content."
          example: 5017691
        exclude_from_article_suggestions:
          type: "boolean"
          readOnly: true
          description: "Whether the article is excluded from Fin AI Agent article suggestions."
          example: false
        help_center_audience:
          type: "string"
          nullable: true
          readOnly: true
          enum:
          - "everyone"
          - "all_users"
          - "all_visitors"
          - "all_leads"
          - "all_visitors_and_leads"
          - "restricted"
          description: "The audience that can view this article in the Help Center. `everyone` means all users and visitors can view it; `restricted` indicates a custom audience ruleset. For multilingual articles, this is the article-level audience."
          example: "everyone"
        scheduled_publish_at:
          type: "integer"
          format: "date-time"
          nullable: true
          readOnly: true
          description: "The Unix timestamp (in seconds) at which the article is scheduled to be published. `null` when no publish is scheduled. Mutually exclusive with `scheduled_unpublish_at` — at most one pending schedule exists per article."
          example: 1769443200
        scheduled_unpublish_at:
          type: "integer"
          format: "date-time"
          nullable: true
          readOnly: true
          description: "The Unix timestamp (in seconds) at which the article is scheduled to be unpublished. `null` when no unpublish is scheduled. Mutually exclusive with `scheduled_publish_at` — at most one pending schedule exists per article."
          example: 1769443200
        default_locale:
          type: "string"
          description: "The default locale of the help center. This field is only returned for multilingual help centers."
          example: "en"
        translated_content:
          nullable: true
          $ref: "#/components/schemas/article_translated_content"
        tags:
          $ref: "#/components/schemas/tags"
