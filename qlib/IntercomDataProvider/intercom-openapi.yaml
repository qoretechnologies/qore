      responses:
        200:
          description: "successful"
          content:
            application/json:
              examples:
                successful:
                  value:
                    type: "list"
                    data: []
                    total_count: 0
                    pages:
                      type: "pages"
                      page: 1
                      per_page: 10
                      total_pages: 0
              schema:
                $ref: "#/components/schemas/contact_list"
        401:
          description: "Unauthorized"
          content:
            application/json:
              examples:
                Unauthorized:
                  value:
                    type: "error.list"
                    request_id: "e097e446-9ae6-44a8-8e13-2bf3008b87ef"
                    errors:
                    - code: "unauthorized"
                      message: "Access Token Invalid"
              schema:
                $ref: "#/components/schemas/error"
