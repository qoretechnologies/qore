          example: 1672928610
        has_unpublished_changes:
          type: "boolean"
          description: "Whether the published article has unpublished changes staged as a draft on top of its live content. For multilingual articles this reflects the default language's content; a pure draft (never published) reports `false`."
          example: false
        draft_updated_at:
          type: "integer"
          format: "date-time"
          nullable: true
          description: "The time, in seconds, when the staged draft was last edited, or `null` when there is no staged draft."
          example: 1672928610
        url:
          type: "string"
          nullable: true
