          description: ""
          example: "1a2b3c"
    search_request:
      description: "Search using Intercoms Search APIs."
      type: "object"
      title: "Search data"
      properties:
        query:
          oneOf:
          - $ref: "#/components/schemas/single_filter_search_request"
