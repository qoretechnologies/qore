    conversation_channel:
      title: "Conversation Channel"
      type: "object"
      description: "The channel through which a conversation was originally initiated and its current channel."
      properties:
        initial:
          type: "string"
          nullable: true
          description: "The channel through which the conversation was originally initiated. Possible values include `messenger`, `zendesk_sunshine`, `zendesk_ticket`, `twitter`, `email`. Returns `null` if channel data is unavailable."
          example: "messenger"
        current:
          type: "string"
          nullable: true
          description: "The current channel of the conversation. May differ from `initial` if the conversation was migrated between channels. Returns `null` if channel data is unavailable."
          example: "messenger"
    conversation_external_reference:
      title: "Conversation External Reference"
      type: "object"
      description: "A reference linking a conversation to a record in an external helpdesk or CRM system, surfaced for Fin Standalone workspaces."
      properties:
        type:
          type: "string"
          description: "The type of external system the reference points to. Possible values include `zendesk_ticket`, `zendesk_sunshine_conversation`, `salesforce_case`, `salesforce_in_app_message_conversation`, `freshdesk_ticket`, `freshchat_conversation`, `hubspot_conversation`, `custom_helpdesk_conversation`, `api_conversation`."
          example: "zendesk_ticket"
        id:
          type: "string"
          description: "The identifier of the record in the external system. Always serialized as a string, since some external IDs exceed 32-bit integer range."
          example: "3633338"
    conversation_monitor_evaluation:
      title: "Conversation Monitor Evaluation"
      type: "object"
      x-tags:
      - "Conversations"
      description: "A QA monitor evaluation that flagged this conversation. Returned in the `monitor_evaluations` array on conversation responses when `include_monitors=true` is passed."
      properties:
        monitor_id:
          type: "string"
          description: "The unique identifier of the monitor that produced this evaluation."
          example: "12345"
        monitor_name:
          type: "string"
          nullable: true
          description: "The name of the monitor at the time of evaluation. Null if the monitor has since been deleted."
          example: "Customer complaint handling"
        monitor_type:
          type: "string"
          nullable: true
          description: "The type of the monitor. Null if the monitor has since been deleted."
          example: "prompt"
        result:
          type: "string"
          description: "The evaluation outcome reported by the monitor."
          example: "flagged"
        explanation:
          type: "string"
          nullable: true
          description: "The reasoning provided by the monitor for its result. May be null if no reasoning was generated."
          example: "The customer mentioned wanting a refund without resolution."
        evaluated_at:
          type: "integer"
          format: "date-time"
          nullable: true
          description: "The time the monitor evaluated this conversation. Null in the rare case the underlying record's timestamp is not yet set."
          example: 1719493065
