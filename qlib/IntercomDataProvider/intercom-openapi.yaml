components:
  schemas:
    datetime:
      oneOf:
      - title: "string"
        type: "string"
        format: "date-time"
        description: "A date and time following the ISO8601 notation."
      - title: "integer"
        type: "integer"
        description: "A date and time as UNIX timestamp notation."
    addressable_list:
      title: "Addressable List"
      type: "object"
      nullable: false
      description: "A list used to access other resources from a parent model."
      properties:
        type:
          type: "string"
          format: "uri"
          description: "The addressable object type"
          example: "note"
        id:
          type: "string"
          description: "The id of the addressable object"
          example: "123"
        url:
          type: "string"
          format: "uri"
          description: "Url to get more company resources for this contact"
          example: "/contacts/5ba682d23d7cf92bef87bfd4/notes"
    admin:
      title: "Admin"
      type: "object"
      x-tags:
      - "Admins"
      description: "Admins are teammate accounts that have access to a workspace."
      nullable: true
      properties:
        type:
          type: "string"
          description: "String representing the object's type. Always has the value `admin`."
          example: "admin"
        id:
          type: "string"
          description: "The id representing the admin."
          example: "1295"
        name:
          type: "string"
          description: "The name of the admin."
          example: "Joe Example"
        email:
          type: "string"
          description: "The email of the admin."
          example: "jdoe@example.com"
        job_title:
          type: "string"
          description: "The job title of the admin."
          example: "Associate"
        away_mode_enabled:
          type: "boolean"
          description: "Identifies if this admin is currently set in away mode."
          example: false
        away_mode_reassign:
          type: "boolean"
          description: "Identifies if this admin is set to automatically reassign new conversations to the apps default inbox."
          example: false
        away_status_reason_id:
          type: "integer"
          nullable: true
          description: "The unique identifier of the away status reason"
          example: 12345
        has_inbox_seat:
          type: "boolean"
          description: "Identifies if this admin has a paid inbox seat to restrict/allow features that require them."
          example: true
        team_ids:
          type: "array"
          description: "This object represents the avatar associated with the admin."
          example:
          - 814865
          items:
            type: "integer"
        avatar:
          type: "string"
          format: "uri"
          nullable: true
          description: "Image for the associated team or teammate"
          example: "https://picsum.photos/200/300"
        team_priority_level:
          $ref: "#/components/schemas/team_priority_level"
        role:
          type: "object"
          nullable: true
          description: "The role assigned to this admin. Only present if the admin has a role assigned."
          properties:
            type:
              type: "string"
              description: "String representing the object's type. Always has the value `role`."
              example: "role"
            id:
              type: "string"
              description: "The id of the role."
              example: "1"
            name:
              type: "string"
              description: "The name of the role."
              example: "Support Agent"
    admin_list:
      title: "Admins"
      type: "object"
      description: "A list of admins associated with a given workspace."
      properties:
        type:
          type: "string"
          description: "String representing the object's type. Always has the value `admin.list`."
          example: "admin.list"
        admins:
          type: "array"
          description: "A list of admins associated with a given workspace."
          items:
            $ref: "#/components/schemas/admin"
    ai_agent:
      title: "AI Agent"
      type: "object"
      x-tags:
      - "Ai Agent"
      description: "Data related to AI Agent involvement in the conversation."
      properties:
        source_type:
          type: "string"
          nullable: true
          description: "The type of the source that triggered AI Agent involvement in the conversation."
          enum:
          - "essentials_plan_setup"
          - "profile"
          - "workflow"
          - "workflow_preview"
          - "fin_preview"
          example: "workflow"
        source_title:
          type: "string"
          description: "The title of the source that triggered AI Agent involvement in the conversation. If this is `essentials_plan_setup` then it will return `null`."
          example: "My AI Workflow"
          nullable: true
        last_answer_type:
          type: "string"
          description: "The type of the last answer delivered by AI Agent. If no answer was delivered then this will return `null`"
          enum:
          - null
          - "ai_answer"
          - "custom_answer"
          example: "ai_answer"
          nullable: true
        resolution_state:
          type: "string"
          description: "The resolution state of AI Agent. If no AI or custom answer has been delivered then this will return `null`."
          enum:
          - "assumed_resolution"
          - "confirmed_resolution"
          - "escalated"
          - "negative_feedback"
          - "procedure_handoff"
          - null
          example: "assumed_resolution"
          nullable: true
        rating:
          type: "integer"
          description: "The customer satisfaction rating given to AI Agent, from 1-5."
          example: 4
          nullable: true
        rating_remark:
          type: "string"
          description: "The customer satisfaction rating remark given to AI Agent."
          example: "Very helpful!"
          nullable: true
        created_at:
          type: "integer"
          format: "date-time"
          description: "The time when the AI agent rating was created."
          example: 1663597260
          nullable: true
        updated_at:
          type: "integer"
          format: "date-time"
          description: "The time when the AI agent rating was last updated."
          example: 1663597260
          nullable: true
        content_sources:
          $ref: "#/components/schemas/content_sources_list"
    sales_agent:
      title: "Sales Agent"
      type: "object"
      x-tags:
      - "Sales Agent"
      description: "Data related to Sales Agent involvement in the conversation."
      properties:
        outcome:
          type: "string"
          nullable: true
          description: "The fixed outcome of the sales agent interaction, used for billing and tracking."
          enum:
          - "qualified"
          - "disqualified"
          - "product_discovery"
          - "escalated_to_support"
          - "spam"
          example: "qualified"
        routing_outcome:
          type: "string"
          nullable: true
          description: "The identifier of the user-defined routing outcome selected by the sales agent."
          example: "enterprise_sales"
        collected_data:
          type: "object"
          nullable: true
          description: "A flat key-value map of memory fields collected by the sales agent during the conversation."
          additionalProperties:
            type: "string"
          example:
            email: "user@example.com"
            company.name: "Acme Inc"
    article:
      title: "Article"
      type: "object"
      x-tags:
      - "Articles"
      description: "The Articles API is a central place to gather all information and take actions on your articles. Articles can live within collections and sections, or alternatively they can stand alone."
      properties:
        statistics:
          nullable: true
          $ref: "#/components/schemas/article_statistics"
      allOf:
      - $ref: "#/components/schemas/article_list_item"
    article_content:
      title: "Article Content"
      type: "object"
      description: "The Content of an Article."
      nullable: true
      properties:
        type:
          type: "string"
          description: "The type of object - `article_content` ."
          enum:
          - null
          - "article_content"
          example: "article_content"
          nullable: true
        title:
          type: "string"
          description: "The title of the article."
          example: "How to create a new article"
        description:
          type: "string"
          description: "The description of the article."
          example: "This article will show you how to create a new article."
        body:
          type: "string"
          description: "The body of the article in HTML."
          example: "This is the body of the article."
        body_markdown:
          type: "string"
          nullable: true
          description: "The body of the article in markdown."
          example: "# How to create a new article\n\nThis is the body of the article.\n"
        author_id:
          type: "integer"
          description: "The ID of the author of the article."
          example: "5017691"
        state:
          type: "string"
          description: "Whether the article is `published` or is a `draft` ."
          enum:
          - "published"
          - "draft"
          example: "draft"
        created_at:
          type: "integer"
          format: "date-time"
          description: "The time when the article was created (seconds)."
          example: 1663597223
        updated_at:
          type: "integer"
          format: "date-time"
          description: "The time when the article was last updated (seconds)."
          example: 1663597260
        has_unpublished_changes:
          type: "boolean"
