          type: "boolean"
          nullable: true
        in: "query"
      - name: "visibility"
        required: false
        description: "Limit by visibility"
        schema:
          type: "string"
          enum:
          - "private"
          - "internal"
          - "public"
          nullable: true
        in: "query"
      - name: "search"
        required: false
        description: "Search for a specific group"
        schema:
          type: "string"
          nullable: true
        in: "query"
      - name: "owned"
        required: false
        description: "Limit by owned by authenticated user"
        schema:
          type: "boolean"
          nullable: true
        in: "query"
      - name: "order_by"
        required: false
        description: "Order by name, path, id or similarity if searching"
        schema:
          type: "string"
          enum:
          - "name"
          - "path"
          - "id"
          - "similarity"
          default: "name"
          nullable: true
        in: "query"
      - name: "sort"
        required: false
        description: "Sort by asc (ascending) or desc (descending)"
        schema:
          type: "string"
          enum:
          - "asc"
          - "desc"
          default: "asc"
          nullable: true
        in: "query"
      - name: "min_access_level"
        required: false
        description: "Minimum access level of authenticated user"
