servers:
- url: "https://{hostname}"
  description: "GitLab REST API"
  variables:
    hostname:
      default: "gitlab.com"
      description: "Your GitLab instance hostname"
paths:
  /api/v4/users:
    get:
      operationId: "getApiV4Users"
      summary: "List all users"
      description: "Lists all users on the instance. This endpoint supports keyset pagination. In GitLab 17.0 and later, keyset pagination is used by default."
      tags:
      - "Users"
      responses:
        200:
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIEntitiesUserBasic"
        400:
          description: "Bad Request"
      parameters:
      - name: "username"
        required: false
        description: "Get a single user with a specific username"
        schema:
          type: "string"
          nullable: true
        in: "query"
      - name: "extern_uid"
        required: false
        description: "Get a single user with a specific external authentication provider UID"
        schema:
          type: "string"
          nullable: true
        in: "query"
      - name: "public_email"
        required: false
        description: "Get a single user with a specific public email"
        schema:
          type: "string"
          nullable: true
        in: "query"
      - name: "provider"
        required: false
        description: "The external provider"
        schema:
          type: "string"
          nullable: true
        in: "query"
      - name: "search"
        required: false
        description: "Search for a username"
        schema:
          type: "string"
          nullable: true
        in: "query"
      - name: "active"
        required: false
        description: "Filters only active users"
        schema:
          type: "boolean"
          nullable: true
        in: "query"
      - name: "humans"
        required: false
        description: "Filters only human users"
        schema:
          type: "boolean"
          nullable: true
        in: "query"
      - name: "external"
        required: false
        description: "Filters only external users"
        schema:
          type: "boolean"
          nullable: true
        in: "query"
      - name: "blocked"
        required: false
        description: "Filters only blocked users"
        schema:
          type: "boolean"
          nullable: true
        in: "query"
      - name: "created_after"
        required: false
        description: "Return users created after the specified time"
        schema:
          type: "string"
          format: "date-time"
          nullable: true
        in: "query"
      - name: "created_before"
        required: false
        description: "Return users created before the specified time"
        schema:
          type: "string"
          format: "date-time"
          nullable: true
        in: "query"
      - name: "without_projects"
        required: false
        description: "Filters only users without projects"
        schema:
          type: "boolean"
          nullable: true
        in: "query"
      - name: "without_project_bots"
        required: false
        description: "Filters users without project bots"
        schema:
          type: "boolean"
          nullable: true
        in: "query"
      - name: "admins"
        required: false
        description: "Filters only admin users"
        schema:
          type: "boolean"
          nullable: true
        in: "query"
      - name: "two_factor"
        required: false
        description: "Filter users by Two-factor authentication."
        schema:
          type: "string"
          nullable: true
        in: "query"
      - name: "exclude_active"
        required: false
        description: "Filters only non active users"
        schema:
          type: "boolean"
          nullable: true
        in: "query"
      - name: "exclude_external"
        required: false
        description: "Filters only non external users"
        schema:
          type: "boolean"
          nullable: true
        in: "query"
      - name: "exclude_humans"
        required: false
        description: "Filters only non human users"
        schema:
          type: "boolean"
          nullable: true
        in: "query"
      - name: "exclude_internal"
        required: false
        description: "Filters only non internal users"
        schema:
          type: "boolean"
          nullable: true
        in: "query"
      - name: "order_by"
        required: false
        description: "Return users ordered by a field"
        schema:
          type: "string"
          enum:
          - "id"
          - "name"
          - "username"
          - "created_at"
          - "updated_at"
          nullable: true
        in: "query"
      - name: "sort"
        required: false
        description: "Return users sorted in ascending and descending order"
        schema:
          type: "string"
          enum:
          - "asc"
          - "desc"
          nullable: true
        in: "query"
      - name: "page"
        required: false
        description: "Current page number"
        schema:
          type: "integer"
          default: 1
          nullable: true
        in: "query"
        example: 1
      - name: "per_page"
        required: false
        description: "Number of items per page"
        schema:
          type: "integer"
          default: 20
          nullable: true
        in: "query"
        example: 20
      - name: "with_custom_attributes"
        required: false
        description: "Include custom attributes in the response"
        schema:
          type: "boolean"
          nullable: true
        in: "query"
      - name: "custom_attributes"
        required: false
        description: "Filter with custom attributes"
        schema:
          type: "object"
          nullable: true
        in: "query"
      - name: "skip_ldap"
        required: false
        description: "Skip LDAP users"
        schema:
          type: "boolean"
          nullable: true
        in: "query"
      - name: "auditors"
        required: false
        description: "Filters only auditor users"
        schema:
          type: "boolean"
          nullable: true
        in: "query"
  /api/v4/projects/{id}/milestones:
    get:
      operationId: "getApiV4ProjectsIdMilestones"
      summary: "List all project milestones"
      description: "Lists all milestones for a specified project."
      tags:
      - "Milestones"
      responses:
        200:
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIEntitiesMilestone"
        404:
          description: "Not Found"
        400:
          description: "Bad Request"
      parameters:
      - name: "id"
        required: true
        description: "The ID or URL-encoded path of the project"
        schema:
          oneOf:
          - type: "string"
          - type: "integer"
        in: "path"
      - name: "state"
        required: false
        description: "Return \"active\", \"closed\", or \"all\" milestones"
        schema:
          type: "string"
          enum:
          - "active"
          - "closed"
          - "all"
          default: "all"
          nullable: true
        in: "query"
      - name: "iids"
        required: false
        description: "The IIDs of the milestones"
        schema:
          type: "array"
          items:
            type: "integer"
          nullable: true
        in: "query"
        style: "form"
        explode: false
      - name: "title"
        required: false
        description: "The title of the milestones"
        schema:
          type: "string"
          nullable: true
        in: "query"
      - name: "search"
        required: false
        description: "The search criteria for the title or description of the milestone"
        schema:
          type: "string"
          nullable: true
        in: "query"
      - name: "include_parent_milestones"
        required: false
        description: "Deprecated: see `include_ancestors`"
        schema:
          type: "boolean"
          nullable: true
        in: "query"
      - name: "include_ancestors"
        required: false
        description: "Include milestones from all parent groups"
        schema:
          type: "boolean"
          nullable: true
        in: "query"
      - name: "updated_before"
        required: false
        description: "Return milestones updated before the specified datetime. Format: ISO 8601 YYYY-MM-DDTHH:MM:SSZ"
        schema:
          type: "string"
          format: "date-time"
          nullable: true
        in: "query"
      - name: "updated_after"
        required: false
        description: "Return milestones updated after the specified datetime. Format: ISO 8601 YYYY-MM-DDTHH:MM:SSZ"
        schema:
          type: "string"
          format: "date-time"
          nullable: true
        in: "query"
      - name: "page"
        required: false
        description: "Current page number"
        schema:
          type: "integer"
          default: 1
          nullable: true
        in: "query"
        example: 1
      - name: "per_page"
        required: false
        description: "Number of items per page"
        schema:
          type: "integer"
          default: 20
          nullable: true
        in: "query"
        example: 20
  /api/v4/projects/{id}/wikis:
    get:
      operationId: "getApiV4ProjectsIdWikis"
      summary: "List all wiki pages for a project"
      description: "Lists all wiki pages for a specified project."
      tags:
      - "Wikis"
      responses:
        200:
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIEntitiesWikiPageBasic"
        404:
          description: "Not found"
        400:
          description: "Bad Request"
      parameters:
      - name: "id"
        required: true
        description: "The ID or URL-encoded path of the group or project"
        schema:
          oneOf:
          - type: "string"
          - type: "integer"
        in: "path"
      - name: "with_content"
        required: false
        description: "Include pages' content"
        schema:
          type: "boolean"
          nullable: true
        in: "query"
    post:
      operationId: "postApiV4ProjectsIdWikis"
      summary: "Create a wiki page for a project"
      description: "Creates a wiki page for a specified project. Requests can define the title, slug, and content."
      tags:
      - "Wikis"
      responses:
        201:
          description: "Created"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIEntitiesWikiPage"
        400:
          description: "Validation error"
        404:
          description: "Not found"
        422:
          description: "Unprocessable entity"
      parameters:
      - name: "id"
        required: true
        description: "The ID or URL-encoded path of the group or project"
        schema:
          oneOf:
          - type: "string"
          - type: "integer"
        in: "path"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestBody_081a4a70422d"
  /api/v4/projects/{id}/wikis/{slug}:
    get:
      operationId: "getApiV4ProjectsIdWikisSlug"
      summary: "Retrieve a wiki page for a project"
      description: "Retrieves a specified wiki page for a project."
      tags:
      - "Wikis"
      responses:
        200:
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIEntitiesWikiPage"
        404:
          description: "Not found"
        400:
          description: "Bad Request"
      parameters:
      - name: "id"
        required: true
        description: "The ID or URL-encoded path of the group or project"
        schema:
          oneOf:
          - type: "string"
          - type: "integer"
        in: "path"
      - name: "slug"
        required: true
        description: "The slug of a wiki page"
        schema:
          type: "string"
        in: "path"
      - name: "version"
        required: false
        description: "The version hash of a wiki page"
        schema:
          type: "string"
          nullable: true
        in: "query"
      - name: "render_html"
        required: false
        description: "Render content to HTML"
        schema:
          type: "boolean"
          nullable: true
        in: "query"
    put:
      operationId: "putApiV4ProjectsIdWikisSlug"
      summary: "Update a wiki page for a project"
      description: "Updates a specified wiki page for a project."
      tags:
      - "Wikis"
      responses:
        200:
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/APIEntitiesWikiPage"
