    CreateIndexForModelRequest:
      description: "The desired configuration for the index and associated embedding model."
      type: "object"
      properties:
        name:
          example: "example-index"
          description: "The name of the index. Resource name must be 1-45 characters long, start and end with an alphanumeric character, and consist only of lower case alphanumeric characters or '-'.\n"
          type: "string"
          minLength: 1
          maxLength: 45
        cloud:
          example: "aws"
          description: "The public cloud where you would like your index hosted.\nPossible values: `gcp`, `aws`, or `azure`."
          x-enum:
