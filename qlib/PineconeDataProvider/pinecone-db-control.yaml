          x-enum:
          - "daily"
          - "weekly"
          - "monthly"
          type: "string"
      required:
      - "type"
      - "frequency"
    BackupScheduleResponse:
      description: "Describes a backup schedule for an index."
      type: "object"
      properties:
        schedule_id:
          example: "e88f7273-42aa-47e9-af73-593827136867"
          description: "Unique identifier for the backup schedule."
          type: "string"
        name:
          example: "daily-compliance-backup"
          description: "User-defined name for the backup schedule."
          type: "string"
        index_id:
          example: "8cbf7ba6-4135-438e-a3c3-4a89a3298905"
          description: "ID of the index this schedule backs up."
          type: "string"
        project_id:
          example: "71ce31ea-75f7-45d6-a147-ef67f661a1b0"
          description: "Pinecone project that contains this schedule (same project as the source index)."
          type: "string"
        schedule_type:
          example: "time-based"
          description: "Schedule category. Only time-based schedules are supported."
          x-enum:
          - "time-based"
          type: "string"
        frequency:
          example: "daily"
          description: "How often the scheduled backup runs."
          x-enum:
          - "daily"
          - "weekly"
          - "monthly"
          type: "string"
        retention_expire_after_days:
          example: 90
          description: "Number of days backups created by this schedule are retained."
          type: "integer"
          format: "int32"
          minimum: 1
