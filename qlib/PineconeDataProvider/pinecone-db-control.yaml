          example: true
          description: "Whether the schedule is active. Disabled schedules do not run."
          type: "boolean"
        next_scheduled_run:
          nullable: true
          example: "2026-04-03T06:00:00+00:00"
          description: "Always present. RFC 3339 timestamp of the next planned backup run when `enabled` is `true`. `null` when `enabled` is `false`; no backup is scheduled until the schedule is re-enabled."
          type: "string"
          format: "date-time"
        created_at:
          example: "2026-04-02T18:22:56.712605+00:00"
