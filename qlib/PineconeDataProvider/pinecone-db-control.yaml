      - "index_id"
    CreateIndexRequest:
      description: "The configuration needed to create a Pinecone index.\nThe `schema` field is required and defines the typed fields for the index. The `deployment` field selects infrastructure and defaults to managed (serverless) on AWS `us-east-1` if omitted. The `name` is auto-generated if not provided."
      type: "object"
      properties:
        name:
          example: "example-index"
          description: "The name of the index. Must be unique within the project. Resource name must be 1-45 characters long, start and end with an alphanumeric character, and consist only of lower case alphanumeric characters or '-'. If not provided, a name is generated automatically. Callers that require retry-safe behavior should provide an explicit name — a duplicate request with the same name returns 409, making success detectable on retry."
          type: "string"
          minLength: 1
          maxLength: 45
        deployment:
          $ref: "#/components/schemas/IndexDeploymentRequest"
        schema:
          $ref: "#/components/schemas/CreateIndexSchema"
        cmek_id:
          example: "arn:aws:kms:us-east-1:123456789012:key/mrk-abc123"
          description: "The ID of a customer-managed encryption key (CMEK) to use for this index. Requires CMEK to be enabled for your organization. Encrypted indexes cannot have `full_text_search` fields: a request that sets `cmek_id` and declares one is rejected, and a project that enforces CMEK rejects any schema with a `full_text_search` field with `412`."
          type: "string"
        read_capacity:
          $ref: "#/components/schemas/ReadCapacity"
        tags:
          $ref: "#/components/schemas/IndexTags"
        deletion_protection:
          $ref: "#/components/schemas/DeletionProtection"
      required:
      - "schema"
      additionalProperties: false
    CreateIndexSchema:
      example:
        fields:
          body:
            full_text_search:
              language: "en"
            type: "string"
          embedding:
            dimension: 1536
            metric: "cosine"
            type: "dense_vector"
      description: "The schema to use when creating a Pinecone index. Defines the fields the index searches over: dense vector, sparse vector, and full-text search fields.\nAt least one of `dense_vector`, `sparse_vector`, or a `string` field with `full_text_search` must be present; an empty `fields` map is rejected. At most one `dense_vector` and one `sparse_vector` field, and at most 100 `full_text_search` fields. Metadata used for filtering is not declared in the schema; it is indexed automatically from the documents you upsert."
      type: "object"
      properties:
        fields:
          description: "A map of field names to their configurations. Field names must be unique, non-empty strings of at most 64 bytes and must not start with `$`, which introduces a filter operator.\nNames starting with `_` are reserved: this covers `_id`, `_values`, `_sparse_values`, and every other underscore-prefixed name. Two reserved names are accepted, and only as the whole schema: `_values` (type `dense_vector`) and/or `_sparse_values` (type `sparse_vector`) with no other fields. Such a schema creates a classic vector index, which is read and written through the vectors API rather than the documents API — the same index that earlier API versions created from `dimension`, `metric`, and `vector_type`. Reserved fields do not accept a `description`. Any other field named with a leading `_`, or a reserved field combined with other fields, is rejected.\nThe map may not be empty: a schema with no fields is rejected with `Schema must contain at least one of the following field types: dense_vector, sparse_vector, string with full_text_search`."
          type: "object"
          additionalProperties:
            $ref: "#/components/schemas/CreateIndexSchemaField"
          minProperties: 1
      required:
      - "fields"
    CreateIndexSchemaField:
      description: "The configuration of a single field in the index schema at creation time. The `type` property determines how the field is stored and searched.\nField types accepted at creation time:\n- `dense_vector`: Fixed-dimension floating-point vectors for ANN search. - `sparse_vector`: Sparse vectors for keyword or hybrid search. - `string` with a `full_text_search` object: String field for full-text search.\nSchema constraints enforced at creation time:\n- At most one `dense_vector` field. - At most one `sparse_vector` field. - At least one of `dense_vector`, `sparse_vector`, or a `string` field with\n\n  `full_text_search` must be present.\n\nOther field types seen in `IndexSchemaField` responses cannot be declared here:\n- `semantic_text` cannot be declared in a schema. Create an index with an\n\n  integrated embedding model through the create-for-model operation instead;\n  it appears as a `semantic_text` field when the index is described.\n- `float` (also spelled `number`), `boolean`, `string_list`, and `string`\n\n  without `full_text_search` are metadata types and are rejected. Include the\n  values as document metadata and they are indexed for filtering automatically.\n\nEvery field accepts an optional `description` of at most 256 bytes."
      discriminator:
        propertyName: "type"
        mapping:
          dense_vector: "#/components/schemas/DenseVectorField"
          sparse_vector: "#/components/schemas/SparseVectorField"
          string: "#/components/schemas/StringField"
      oneOf:
      - $ref: "#/components/schemas/DenseVectorField"
      - $ref: "#/components/schemas/SparseVectorField"
      - $ref: "#/components/schemas/StringField"
    DeletionProtection:
      description: "Whether [deletion protection](http://docs.pinecone.io/guides/manage-data/manage-indexes#configure-deletion-protection) is enabled/disabled for the index.\nPossible values: `disabled` or `enabled`."
      default: "disabled"
      x-enum:
      - "disabled"
      - "enabled"
      type: "string"
    DenseVectorField:
      example:
        dimension: 1536
        metric: "cosine"
        type: "dense_vector"
      title: "Dense vector"
      description: "A dense vector field configuration. Stores fixed-dimension floating-point vectors for approximate nearest-neighbor (ANN) search."
      type: "object"
      properties:
        type:
          description: "Identifies this as a dense vector field. Must be `dense_vector`."
          type: "string"
          enum:
          - "dense_vector"
        description:
          nullable: true
          description: "Optional description for this field, at most 256 bytes. `null` in responses when none was set."
          type: "string"
          maxLength: 256
        dimension:
          example: 1536
          description: "The number of dimensions in the dense vectors stored in this field."
          type: "integer"
          format: "int32"
          minimum: 1
          maximum: 20000
        metric:
          example: "cosine"
          description: "The distance metric used for similarity search.\nPossible values: `cosine`, `dotproduct`, or `euclidean`."
          x-enum:
          - "cosine"
          - "dotproduct"
          - "euclidean"
          type: "string"
      required:
      - "type"
      - "dimension"
      - "metric"
    ErrorResponse:
      example:
