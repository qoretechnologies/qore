openapi: "3.0.3"
info:
  title: "Pinecone Control Plane API"
  description: "Pinecone is a vector database that makes it easy to search and retrieve billions of high-dimensional vectors."
  contact:
    name: "Pinecone Support"
    url: "https://support.pinecone.io"
    email: "support@pinecone.io"
  license:
    name: "Apache 2.0"
    url: "https://www.apache.org/licenses/LICENSE-2.0"
  version: "2026-07"
servers:
- url: "https://api.pinecone.io"
  description: "Production API endpoints"
paths:
  /indexes:
    get:
      tags:
      - "Manage Indexes"
      summary: "List indexes"
      description: "List all indexes in a project."
      operationId: "list_indexes"
      parameters:
      - in: "header"
        name: "X-Pinecone-Api-Version"
        description: "Required date-based version header"
        required: true
        schema:
          default: "2026-07"
          type: "string"
        style: "simple"
      responses:
        200:
          description: "This operation returns a list of all the indexes that you have previously created, and which are associated with the given project."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexList"
              examples:
                multiple-indexes:
                  summary: "A list of serverless indexes."
                  value:
                    indexes:
                    - deletion_protection: "disabled"
                      deployment:
                        cloud: "aws"
                        deployment_type: "managed"
                        region: "us-east-1"
                      host: "movie-recommendations-c01b5b5.svc.us-east1-gcp.pinecone.io"
                      name: "movie-recommendations"
                      read_capacity:
                        mode: "OnDemand"
                        status:
                          state: "Ready"
                      schema:
                        fields:
                          embedding:
                            dimension: 1536
                            metric: "cosine"
                            type: "dense_vector"
                      status:
                        ready: true
                        state: "Ready"
                one-index:
                  summary: "A list containing one serverless index."
                  value:
                    indexes:
                    - deletion_protection: "disabled"
                      deployment:
                        cloud: "aws"
                        deployment_type: "managed"
                        region: "us-east-1"
                      host: "movie-embeddings-c01b5b5.svc.us-east1-gcp.pinecone.io"
                      name: "movie-embeddings"
                      read_capacity:
                        mode: "OnDemand"
                        status:
                          state: "Ready"
                      schema:
                        fields:
                          embedding:
                            dimension: 1536
                            metric: "cosine"
                            type: "dense_vector"
                      status:
                        ready: false
                        state: "Initializing"
                no-indexes:
                  summary: "No indexes created yet."
                  value:
                    indexes: []
        401:
          description: "Unauthorized. Possible causes: missing or invalid API key."
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/UnauthorizedMessage"
        500:
          description: "Internal server error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                internal-server-error:
                  summary: "Internal server error"
                  value:
                    error:
                      code: "UNKNOWN"
                      message: "Internal server error"
                    status: 500
    post:
      tags:
      - "Manage Indexes"
      summary: "Create an index"
      description: "Create a Pinecone index. Define the schema for your index — dense vector, sparse vector, and full-text search fields — and, optionally, the deployment infrastructure (managed serverless or BYOC). To create an index with an integrated embedding model, use [Create an index with integrated embedding](https://docs.pinecone.io/reference/api/2026-07/control-plane/create_index_for_model). If `deployment` is omitted, the index is deployed as a managed (serverless) index on `aws` in `us-east-1`.\n**The index schema cannot be modified after creation.** Field types, dimensions, metrics, and text-analysis settings are permanent. Choose your schema carefully before creating an index.\nTo create an index from a backup, use [Create index from backup](https://docs.pinecone.io/reference/api/2026-07/control-plane/create_index_from_backup).\nFor guidance and examples, see [Create an index](https://docs.pinecone.io/guides/index-data/create-an-index).\n"
      operationId: "create_index"
      parameters:
      - in: "header"
        name: "X-Pinecone-Api-Version"
        description: "Required date-based version header"
        required: true
        schema:
          default: "2026-07"
          type: "string"
        style: "simple"
      requestBody:
        description: "The desired configuration for the index."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateIndexRequest"
            examples:
              default-deployment:
                summary: "Dense vector index using the default deployment"
                value:
                  schema:
                    fields:
                      embedding:
                        dimension: 1536
                        metric: "cosine"
                        type: "dense_vector"
              classic-vectors-api:
                summary: "Classic dense index served by the vectors API"
                value:
                  name: "classic-index"
                  schema:
                    fields:
                      _values:
                        dimension: 1536
                        metric: "cosine"
                        type: "dense_vector"
              dense-serverless:
                summary: "Dense vector serverless index"
                value:
                  deletion_protection: "enabled"
                  deployment:
                    cloud: "aws"
                    deployment_type: "managed"
                    region: "us-east-1"
                  name: "movie-recommendations"
                  schema:
                    fields:
                      embedding:
                        dimension: 1536
                        metric: "cosine"
                        type: "dense_vector"
              sparse-serverless:
                summary: "Sparse vector serverless index"
                value:
                  deployment:
                    cloud: "aws"
                    deployment_type: "managed"
                    region: "us-east-1"
                  name: "sparse-index"
                  schema:
                    fields:
                      sparse_embedding:
                        type: "sparse_vector"
              hybrid-serverless:
                summary: "Hybrid dense + sparse serverless index"
                value:
                  deployment:
                    cloud: "gcp"
                    deployment_type: "managed"
                    region: "us-central1"
                  name: "hybrid-index"
                  schema:
                    fields:
                      embedding:
                        dimension: 768
                        metric: "dotproduct"
                        type: "dense_vector"
                      sparse_embedding:
                        type: "sparse_vector"
              fts-serverless:
                summary: "Full-text search serverless index"
                value:
                  deployment:
                    cloud: "aws"
                    deployment_type: "managed"
                    region: "us-east-1"
                  name: "fts-index"
                  schema:
                    fields:
                      body:
                        full_text_search:
                          language: "en"
                          stemming: true
                          stop_words: true
                        type: "string"
              dedicated-read-capacity:
                summary: "Serverless index with dedicated read capacity"
                value:
                  deployment:
                    cloud: "aws"
                    deployment_type: "managed"
                    region: "us-east-1"
                  name: "dedicated-index"
                  read_capacity:
                    dedicated:
                      manual:
                        replicas: 2
                        shards: 2
                      node_type: "t1"
                      scaling: "Manual"
                    mode: "Dedicated"
                  schema:
                    fields:
                      embedding:
                        dimension: 1536
                        metric: "cosine"
                        type: "dense_vector"
        required: true
      responses:
        201:
          description: "The index has been successfully created."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexModel"
        400:
          description: "Bad request. The request body included invalid request parameters."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                index-metric-validation-error:
                  summary: "Validation error"
                  value:
                    error:
                      code: "INVALID_ARGUMENT"
                      message: "Bad request. The request body included invalid request parameters."
                    status: 400
        401:
          description: "Unauthorized. Possible causes: missing or invalid API key."
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/UnauthorizedMessage"
        402:
          description: "Payment required. Organization is on a paid plan and is delinquent on payment."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                payment-required:
                  summary: "Payment required"
                  value:
                    error:
                      code: "PAYMENT_REQUIRED"
                      message: "Request failed. Pay all past due invoices to lift restrictions on your account."
                    status: 402
        403:
          description: "Forbidden. Possible causes: the project's index quota is exhausted, dedicated read capacity is not enabled for the organization, or (when configuring) the index's read capacity is not yet `Ready`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  summary: "Forbidden"
                  value:
                    error:
                      code: "FORBIDDEN"
                      message: "Increase your quota or upgrade to create more indexes."
                    status: 403
        404:
          description: "Unknown cloud or region when creating a serverless index."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                serverless-spec-cloud-not-found:
                  summary: "Unknown cloud or region when creating a serverless index."
                  value:
                    error:
                      code: "NOT_FOUND"
                      message: "Resource cloud: aws region: us-west1 not found."
                    status: 404
        409:
          description: "Index of given name already exists."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                index-name-already-exists:
                  summary: "Index name needs to be unique."
                  value:
                    error:
                      code: "ALREADY_EXISTS"
                      message: "Resource already exists."
                    status: 409
        412:
          description: "The project's encryption settings do not allow this index."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                cmek-full-text-search:
                  summary: "Full-text search fields are not supported in CMEK-encrypted projects."
                  value:
                    error:
                      code: "FAILED_PRECONDITION"
                      message: "Index creation failed. Indexes with full_text_search fields are not supported in CMEK-encrypted projects"
                    status: 412
        422:
          description: "Unprocessable entity. The request body could not be deserialized."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing-field:
                  summary: "Unprocessable entity"
                  value:
                    error:
                      code: "UNPROCESSABLE_ENTITY"
                      message: "Failed to deserialize the JSON body into the target type: missing field `metric` at line 1 column 16"
                    status: 422
        500:
          description: "Internal server error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                internal-server-error:
                  summary: "Internal server error"
                  value:
                    error:
                      code: "UNKNOWN"
                      message: "Internal server error"
                    status: 500
  /indexes/{index_name}:
    get:
      tags:
      - "Manage Indexes"
      summary: "Describe an index"
      description: "Get a description of an index."
      operationId: "describe_index"
      parameters:
      - in: "header"
        name: "X-Pinecone-Api-Version"
        description: "Required date-based version header"
        required: true
        schema:
          default: "2026-07"
          type: "string"
        style: "simple"
      - in: "path"
        name: "index_name"
        description: "The name of the index to be described."
        required: true
        schema:
          type: "string"
        example: "test-index"
        style: "simple"
      responses:
        200:
          description: "Configuration information and deployment status of the index."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexModel"
              examples:
                serverless-dense:
                  summary: "A serverless dense vector index"
                  value:
                    deletion_protection: "disabled"
                    deployment:
                      cloud: "aws"
                      deployment_type: "managed"
                      region: "us-east-1"
                    host: "movie-recommendations-c01b5b5.svc.us-east1-gcp.pinecone.io"
                    name: "movie-recommendations"
                    read_capacity:
                      mode: "OnDemand"
                      status:
                        state: "Ready"
                    schema:
                      fields:
                        embedding:
                          dimension: 1536
                          metric: "cosine"
                          type: "dense_vector"
                    status:
                      ready: true
                      state: "Ready"
                serverless-fts:
                  summary: "A serverless full-text search index"
                  value:
                    deletion_protection: "disabled"
                    deployment:
                      cloud: "aws"
                      deployment_type: "managed"
                      region: "us-east-1"
                    host: "article-search-d12e6e6.svc.us-east1-gcp.pinecone.io"
                    name: "article-search"
                    read_capacity:
                      mode: "OnDemand"
                      status:
                        state: "Ready"
                    schema:
                      fields:
                        body:
                          full_text_search:
                            language: "en"
                            stemming: true
                            stop_words: true
                          type: "string"
                        title:
                          full_text_search:
                            language: "en"
                          type: "string"
                    status:
                      ready: true
                      state: "Ready"
          links:
            UpsertVector:
              operationId: "upsert"
              server:
                url: "$response.body#/host"
            UpdateVector:
              operationId: "update"
              server:
                url: "$response.body#/host"
            QueryVector:
              operationId: "query"
              server:
                url: "$response.body#/host"
            FetchVector:
              operationId: "fetch"
              server:
                url: "$response.body#/host"
            DeleteOneVector:
              operationId: "delete1"
              server:
                url: "$response.body#/host"
            DeleteVector:
              operationId: "delete"
              server:
                url: "$response.body#/host"
        401:
          description: "Unauthorized. Possible causes: missing or invalid API key."
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/UnauthorizedMessage"
        404:
          description: "Index not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                index-not-found:
                  summary: "Index not found"
                  value:
                    error:
                      code: "NOT_FOUND"
                      message: "Index example-index not found."
                    status: 404
        500:
          description: "Internal server error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                internal-server-error:
                  summary: "Internal server error"
                  value:
                    error:
                      code: "UNKNOWN"
                      message: "Internal server error"
                    status: 500
    delete:
      tags:
      - "Manage Indexes"
      summary: "Delete an index"
      description: "Delete an existing index."
      operationId: "delete_index"
      parameters:
      - in: "header"
        name: "X-Pinecone-Api-Version"
        description: "Required date-based version header"
        required: true
        schema:
          default: "2026-07"
          type: "string"
        style: "simple"
      - in: "path"
        name: "index_name"
        description: "The name of the index to delete."
        required: true
        schema:
          type: "string"
        example: "test-index"
        style: "simple"
      responses:
        202:
          description: "The request to delete the index has been accepted."
        401:
          description: "Unauthorized. Possible causes: missing or invalid API key."
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/UnauthorizedMessage"
        403:
          description: "Forbidden. Deletion protection enabled."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                deletion-protection:
                  summary: "Forbidden"
                  value:
                    error:
                      code: "FORBIDDEN"
                      message: "Deletion protection is enabled for this index. Disable deletion protection before retrying."
                    status: 403
        404:
          description: "Index not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                index-not-found:
                  summary: "Index not found"
                  value:
                    error:
                      code: "NOT_FOUND"
                      message: "Index example-index not found."
                    status: 404
        412:
          description: "There is a pending collection created from this index."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                pending-collection:
                  summary: "There is a pending collection from this index."
                  value:
                    error:
                      code: "FAILED_PRECONDITION"
                      message: "Unable to delete an index. There are pending collections for this index: ['test-collection']"
                    status: 412
        500:
          description: "Internal server error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                internal-server-error:
                  summary: "Internal server error"
                  value:
                    error:
                      code: "UNKNOWN"
                      message: "Internal server error"
                    status: 500
    patch:
      tags:
      - "Manage Indexes"
      summary: "Configure an index"
      description: "Configure an existing index. For guidance and examples, see [Manage indexes](https://docs.pinecone.io/guides/manage-data/manage-indexes)."
      operationId: "configure_index"
      parameters:
      - in: "header"
        name: "X-Pinecone-Api-Version"
        description: "Required date-based version header"
        required: true
        schema:
          default: "2026-07"
          type: "string"
        style: "simple"
      - in: "path"
        name: "index_name"
        description: "The name of the index to configure."
        required: true
        schema:
          type: "string"
        example: "test-index"
        style: "simple"
      requestBody:
        description: "The configuration changes to apply to the index."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfigureIndexRequest"
            examples:
              scale-replicas:
                summary: "Scale a pod-based index to 4 replicas"
                value:
                  deployment:
                    replicas: 4
              upgrade-pod-type:
                summary: "Upgrade pod size"
                value:
                  deployment:
                    pod_type: "p1.x2"
              update-read-capacity:
                summary: "Switch to dedicated read capacity"
                value:
                  read_capacity:
                    dedicated:
                      manual:
                        replicas: 2
                        shards: 2
                      node_type: "t1"
                      scaling: "Manual"
                    mode: "Dedicated"
              scale-dedicated-replicas:
                summary: "Change the replica count of dedicated read capacity"
                value:
                  read_capacity:
                    dedicated:
                      manual:
                        replicas: 4
                      scaling: "Manual"
                    mode: "Dedicated"
              change-node-type:
                summary: "Change the node type of dedicated read capacity"
                value:
                  read_capacity:
                    dedicated:
                      node_type: "t1"
                    mode: "Dedicated"
              update-semantic-text-params:
                summary: "Update semantic text field inference parameters"
                value:
                  schema:
                    fields:
                      content:
                        read_parameters:
                          input_type: "query"
                          truncate: "NONE"
                        type: "semantic_text"
                        write_parameters:
                          input_type: "passage"
              disable-deletion-protection:
                summary: "Disable deletion protection"
                value:
                  deletion_protection: "disabled"
              update-tags:
                summary: "Update tag0 and delete tag1"
                value:
                  tags:
                    tag0: "new-val"
                    tag1: ""
        required: true
      responses:
        200:
          description: "The configuration change was recorded and the updated index is returned. Changes that resize the index (replicas, shards, read capacity) are applied asynchronously; poll the index `status` to see when they take effect."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexModel"
        400:
          description: "Bad request. The request body included invalid request parameters."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                index-metric-validation-error:
                  summary: "Validation error"
                  value:
                    error:
                      code: "INVALID_ARGUMENT"
                      message: "Bad request. The request body included invalid request parameters."
                    status: 400
        401:
          description: "Unauthorized. Possible causes: missing or invalid API key."
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/UnauthorizedMessage"
        403:
          description: "Forbidden. Possible causes: the project's index quota is exhausted, dedicated read capacity is not enabled for the organization, or (when configuring) the index's read capacity is not yet `Ready`."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  summary: "Forbidden"
                  value:
                    error:
                      code: "FORBIDDEN"
                      message: "Increase your quota or upgrade to create more indexes."
                    status: 403
        404:
          description: "Index not found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                index-not-found:
                  summary: "Index not found"
                  value:
                    error:
                      code: "NOT_FOUND"
                      message: "Index example-index not found."
                    status: 404
        422:
          description: "Unprocessable entity. The request body could not be deserialized."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                missing-field:
                  summary: "Unprocessable entity"
                  value:
                    error:
                      code: "UNPROCESSABLE_ENTITY"
                      message: "Failed to deserialize the JSON body into the target type: missing field `metric` at line 1 column 16"
                    status: 422
        500:
          description: "Internal server error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                internal-server-error:
                  summary: "Internal server error"
                  value:
                    error:
                      code: "UNKNOWN"
                      message: "Internal server error"
                    status: 500
  /indexes/{index_name}/backups:
    get:
      tags:
      - "Manage Indexes"
      summary: "List backups for an index"
      description: "When `include_deleted` is false (or omitted), `index_name` must resolve to an active index in the project. If no active index by that name exists—including the case where only deleted indexes have used the name—the API returns **404**, not an empty list.\nWhen `include_deleted` is true, the API returns backups from every index in the project that has ever used this name (active and deleted). The `source_index_deleted_at` field is present only when the backup is from a deleted index. **404** is returned only when no index by that name has ever existed in the project (active or deleted)."
      operationId: "list_index_backups"
      parameters:
      - in: "header"
        name: "X-Pinecone-Api-Version"
        description: "Required date-based version header"
        required: true
        schema:
          default: "2026-07"
          type: "string"
        style: "simple"
      - in: "path"
        name: "index_name"
        description: "Name of the index whose backups are listed. When `include_deleted` is false or omitted, this must resolve to an active index in the project."
        required: true
        schema:
          type: "string"
        style: "simple"
      - in: "query"
        name: "include_deleted"
        description: "When true, includes backups for every index incarnation with this name (active and deleted). When false or omitted, only the active index's backups are included; **404** when no active index has that name."
        schema:
          default: false
          type: "boolean"
        style: "form"
      - in: "query"
        name: "limit"
        description: "The number of results to return per page."
        schema:
          default: 100
          type: "integer"
        style: "form"
      - in: "query"
        name: "paginationToken"
        description: "The token to use to retrieve the next page of results. A malformed token is rejected with `400`."
        schema:
          type: "string"
        style: "form"
      responses:
        200:
          description: "Returns backups associated with the index name. With `include_deleted` true, backups for all versions of the index name are returned. With `include_deleted` false, only backups for the active index are returned, or **404** if there is no active index."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BackupList"
              examples:
                active_index_backups:
                  summary: "Backups for the active index only (`include_deleted` false or omitted)."
                  value:
                    data:
                    - backup_id: "bkp_123abc"
                      cloud: "aws"
                      created_at: "2025-03-15T10:30:00Z"
                      description: "Monthly backup of production index"
                      name: "backup-2025-03-15"
                      namespace_count: 3
                      record_count: 120000
                      region: "us-east-1"
                      schema:
                        fields:
                          embedding:
                            dimension: 1536
                            metric: "cosine"
                            type: "dense_vector"
                      size_bytes: 10000000
                      source_index_id: "idx_456"
                      source_index_name: "my-index"
                      status: "Ready"
                      tags:
                        environment: "production"
                        type: "monthly"
                    - backup_id: "bkp_789xyz"
                      cloud: "aws"
                      created_at: "2025-03-20T15:45:00Z"
                      description: "Pre-deployment safety backup"
                      name: "backup-2025-03-20"
                      namespace_count: 4
                      record_count: 125000
                      region: "us-east-1"
                      schema:
                        fields:
                          embedding:
                            dimension: 1536
                            metric: "cosine"
