# Import spec for the vendored Pinecone API descriptions.
#
#   QORE_MODULE_DIR=qlib tools/rest-schema-import.qr \
#       --spec qlib/PineconeDataProvider/pinecone-import.yaml
#
# Paths are resolved against this file.  The operations come from the manifests themselves, so the
# selection and what the application exports cannot drift apart.
#
# Pinecone publishes one description per API rather than one per product, and this application uses
# four of them.  Each becomes its own action set, because a request's URI prefix comes from the base
# path of the schema its action was generated from -- and the database APIs do not share a host: the
# control plane and inference are served from api.pinecone.io, while the data plane is served from a
# per-index host that the control plane resolves at run time.
#
# The sources are pinned to the pinecone-api commit that the committed schemas were imported from, so a
# re-import reproduces them; move all four to a newer commit to take an upstream update.
#
# All of Pinecone's APIs carry the same dated version, so the four move together: re-import all four
# when the version changes, and update
# PineconeRestClient::PineconeRestClientBase::ApiVersion in the same commit -- the client sends that
# version on every call and the module's tests assert the two agree.
#
# Not exported, and why:
#   assistant_*  - the Assistant product: a separate surface with its own file store and chat model,
#                  which is an application in its own right rather than part of the vector database
#   db_metrics   - Prometheus-format metrics scraping, not a data-integration surface
#   nexus_*      - not generally available
#   oauth        - token issuance handled by PineconeAdminRestClient; not an application action
documents:
  - name: Pinecone Database Control Plane
    source: https://raw.githubusercontent.com/pinecone-io/pinecone-api/70a7509d34958cde7154efa3b76372bd5dacce8e/2026-07/db_control_2026-07.oas.yaml
    output: pinecone-db-control.yaml
    manifest: PineconeDataProvider:PineconeManifest::ControlManifest
    provenance: PineconeSchema.qc
    const: ControlProvenance

  - name: Pinecone Database Data Plane
    source: https://raw.githubusercontent.com/pinecone-io/pinecone-api/70a7509d34958cde7154efa3b76372bd5dacce8e/2026-07/db_data_2026-07.oas.yaml
    output: pinecone-db-data.yaml
    manifest: PineconeDataProvider:PineconeManifest::DataManifest
    provenance: PineconeSchema.qc
    const: DataProvenance

  - name: Pinecone Inference
    source: https://raw.githubusercontent.com/pinecone-io/pinecone-api/70a7509d34958cde7154efa3b76372bd5dacce8e/2026-07/inference_2026-07.oas.yaml
    output: pinecone-inference.yaml
    manifest: PineconeDataProvider:PineconeManifest::InferenceManifest
    provenance: PineconeSchema.qc
    const: InferenceProvenance

  - name: Pinecone Admin
    source: https://raw.githubusercontent.com/pinecone-io/pinecone-api/70a7509d34958cde7154efa3b76372bd5dacce8e/2026-07/admin_2026-07.oas.yaml
    output: pinecone-admin.yaml
    manifest: PineconeDataProvider:PineconeAdminManifest::Manifest
    provenance: PineconeSchema.qc
    const: AdminProvenance
