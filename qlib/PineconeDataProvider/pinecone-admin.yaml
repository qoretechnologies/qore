openapi: "3.0.3"
info:
  title: "Pinecone Admin API"
  description: "Provides an API for managing a Pinecone organization and its resources, including projects, API keys, organization users and invites, service accounts, and role bindings.\n"
  contact:
    name: "Pinecone Support"
    url: "https://support.pinecone.io"
    email: "support@pinecone.io"
  license:
    name: "Apache 2.0"
    url: "https://www.apache.org/licenses/LICENSE-2.0"
  version: "2026-07"
servers:
- url: "https://api.pinecone.io"
  description: "Production API endpoints"
paths:
  /admin/projects:
    get:
      tags:
      - "Projects"
      summary: "List projects"
      description: "List all projects in an organization."
      operationId: "list_projects"
      parameters:
      - in: "header"
        name: "X-Pinecone-Api-Version"
        description: "Required date-based version header"
        required: true
        schema:
          default: "2026-07"
          type: "string"
        style: "simple"
      responses:
        200:
          description: "A list of projects."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectList"
        401:
          description: "Unauthorized. Possible causes: Invalid API key."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  summary: "Unauthorized"
                  value:
                    error:
                      code: "UNAUTHENTICATED"
                      message: "Invalid API key."
                    status: 401
        4XX:
          description: "Unexpected error on request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        500:
          description: "Internal server error."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                internal-server-error:
                  summary: "Internal server error"
                  value:
                    error:
                      code: "UNKNOWN"
                      message: "Internal server error"
                    status: 500
    post:
      tags:
      - "Projects"
      summary: "Create a new project"
      description: "Create a new project."
      operationId: "create_project"
      parameters:
      - in: "header"
        name: "X-Pinecone-Api-Version"
        description: "Required date-based version header"
        required: true
        schema:
          default: "2026-07"
          type: "string"
        style: "simple"
      requestBody:
        description: "The details of the new project."
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
        required: true
      responses:
        200:
          description: "The project was successfully created."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        400:
          description: "Bad request. The request body included invalid request parameters."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                index-metric-validation-error:
                  summary: "Validation error"
                  value:
                    error:
                      code: "INVALID_ARGUMENT"
                      message: "Bad request. The request body included invalid request parameters."
                    status: 400
        401:
          description: "Unauthorized. Possible causes: Invalid API key."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  summary: "Unauthorized"
                  value:
                    error:
                      code: "UNAUTHENTICATED"
                      message: "Invalid API key."
                    status: 401
        403:
          description: "Forbidden"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        404:
          description: "Not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        4XX:
          description: "Unexpected error on request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        500:
          description: "Internal server error."
          content:
