components:
  schemas:
    APIKey:
      description: "The details of an API key, without the secret."
      type: "object"
      properties:
        id:
          description: "The unique ID of the API key."
          type: "string"
          format: "uuid"
        name:
          description: "The name of the API key."
          type: "string"
        project_id:
          description: "The ID of the project containing the API key."
          type: "string"
          format: "uuid"
        roles:
          description: "The roles assigned to the API key."
          type: "array"
          items:
            example: "ProjectEditor"
            description: "A role that can be assigned to an API key.\nPossible values: `ProjectEditor`, `ProjectViewer`, `ControlPlaneEditor`, `ControlPlaneViewer`, `DataPlaneEditor`, or `DataPlaneViewer`."
            x-enum:
            - "ProjectEditor"
            - "ProjectViewer"
            - "ControlPlaneEditor"
            - "ControlPlaneViewer"
            - "DataPlaneEditor"
            - "DataPlaneViewer"
            type: "string"
      required:
      - "id"
      - "name"
      - "project_id"
      - "roles"
    APIKeyWithSecret:
      description: "The details of an API key, including the secret. Only returned on API key creation.\n"
      type: "object"
      properties:
        key:
          $ref: "#/components/schemas/APIKey"
        value:
          description: "The value to use as an API key. New keys will have the format `\"pckey_<public-label>_<unique-key>\"`. The entire string should be used when authenticating.\n"
          type: "string"
      required:
      - "key"
      - "value"
    CreateAPIKeyRequest:
      type: "object"
      properties:
        name:
          example: "devkey"
          description: "The name of the API key. The name must be 1-80 characters long.\n"
          type: "string"
          minLength: 1
          maxLength: 80
        roles:
          description: "The roles to create the API key with. Default is `[\"ProjectEditor\"]`.\n"
          type: "array"
          items:
            example: "ProjectEditor"
            description: "A role that can be assigned to an API key.\nPossible values: `ProjectEditor`, `ProjectViewer`, `ControlPlaneEditor`, `ControlPlaneViewer`, `DataPlaneEditor`, or `DataPlaneViewer`."
            x-enum:
            - "ProjectEditor"
            - "ProjectViewer"
            - "ControlPlaneEditor"
            - "ControlPlaneViewer"
            - "DataPlaneEditor"
            - "DataPlaneViewer"
            type: "string"
      required:
      - "name"
    CreateInviteRequest:
      type: "object"
      properties:
        email:
          example: "newhire@acme.com"
          description: "The email address to invite."
          type: "string"
          format: "email"
          maxLength: 254
        role_bindings:
          description: "Role bindings for the invitee. Must include at least one `organization`-scoped binding that grants organization membership (`OrgOwner`, `OrgManager`, `OrgBillingAdmin`, or `OrgMember`); `project`-scoped bindings are optional. Not returned in the response."
          type: "array"
          items:
            $ref: "#/components/schemas/RoleBindingInput"
          minItems: 1
          maxItems: 100
      required:
      - "email"
      - "role_bindings"
    CreateProjectRequest:
      type: "object"
      properties:
        name:
          example: "chatbot-prod"
          description: "The name of the new project."
          type: "string"
          minLength: 1
          maxLength: 512
        max_pods:
          description: "The maximum number of Pods that can be created in the project. Default is `0` (serverless only).\n"
          type: "integer"
        force_encryption_with_cmek:
          description: "Whether to force encryption with a customer-managed encryption key (CMEK). Default is `false`.\n"
          type: "boolean"
      required:
      - "name"
    CreateRoleBindingRequest:
      type: "object"
      properties:
        principal_type:
          example: "service_account"
          description: "The kind of principal that receives permissions from a role binding.\nPossible values: `user`, `service_account`, `api_key`, `invite`."
          x-enum:
          - "user"
          - "service_account"
          - "api_key"
          - "invite"
          type: "string"
        principal_id:
          example: "e2e92523-85dc-4142-b8c2-e681be8b78df"
          description: "Principal ID. Format depends on `principal_type`."
          type: "string"
        resource_type:
          example: "project"
          description: "The kind of resource scope a role binding applies to.\nPossible values: `organization`, `project`."
          x-enum:
          - "organization"
          - "project"
          type: "string"
        resource_id:
          example: "a2f7dddb-1597-4eff-9f71-535fde243f58"
          description: "Project UUID. Required when `resource_type` is `project`; omit for `organization` scope."
          type: "string"
        role:
          example: "ProjectOwner"
          description: "A role assigned to a principal at a resource scope."
          x-enum:
          - "OrgOwner"
          - "OrgManager"
          - "OrgMember"
          - "OrgBillingAdmin"
          - "ProjectOwner"
          - "ProjectManager"
          - "ProjectMember"
          - "ProjectEditor"
          - "ProjectViewer"
          - "ControlPlaneEditor"
          - "ControlPlaneViewer"
          - "DataPlaneEditor"
          - "DataPlaneViewer"
          type: "string"
      required:
      - "principal_type"
      - "principal_id"
      - "resource_type"
      - "role"
    CreateServiceAccountRequest:
      type: "object"
      properties:
        name:
          example: "ci-prod"
          description: "The human-readable name of the service account."
          type: "string"
          minLength: 1
          maxLength: 80
        role_bindings:
          description: "Optional initial role bindings. Omitting the field or passing an empty array creates the service account with no role bindings; roles can be added later via the role binding endpoints. A service account may be granted any organization- or project-scoped role. Not returned in the response."
          type: "array"
          items:
            $ref: "#/components/schemas/RoleBindingInput"
          minItems: 0
          maxItems: 100
      required:
      - "name"
    ErrorResponse:
      example:
        error:
          code: "QUOTA_EXCEEDED"
          message: "The index exceeds the project quota of 5 pods by 2 pods. Upgrade your account or change the project settings to increase the quota."
        status: 429
      description: "The response shape used for all error responses."
      type: "object"
      properties:
        status:
          example: 500
          description: "The HTTP status code of the error."
          type: "integer"
        error:
          example:
            code: "INVALID_ARGUMENT"
            message: "Index name must contain only lowercase alphanumeric characters or hyphens, and must not begin or end with a hyphen."
          description: "Detailed information about the error that occurred."
          type: "object"
          properties:
            code:
              description: "The error code.\nPossible values: `OK`, `UNKNOWN`, `INVALID_ARGUMENT`, `DEADLINE_EXCEEDED`, `QUOTA_EXCEEDED`, `NOT_FOUND`, `ALREADY_EXISTS`, `PERMISSION_DENIED`, `UNAUTHENTICATED`, `RESOURCE_EXHAUSTED`, `FAILED_PRECONDITION`, `ABORTED`, `OUT_OF_RANGE`, `UNIMPLEMENTED`, `INTERNAL`, `UNAVAILABLE`, `DATA_LOSS`, `FORBIDDEN`, or `UNPROCESSABLE_ENTITY`.        "
              x-enum:
              - "OK"
              - "UNKNOWN"
              - "INVALID_ARGUMENT"
              - "DEADLINE_EXCEEDED"
              - "QUOTA_EXCEEDED"
              - "NOT_FOUND"
              - "ALREADY_EXISTS"
              - "PERMISSION_DENIED"
              - "UNAUTHENTICATED"
              - "RESOURCE_EXHAUSTED"
              - "FAILED_PRECONDITION"
              - "ABORTED"
              - "OUT_OF_RANGE"
              - "UNIMPLEMENTED"
              - "INTERNAL"
              - "UNAVAILABLE"
              - "DATA_LOSS"
              - "FORBIDDEN"
              - "UNPROCESSABLE_ENTITY"
              type: "string"
            message:
              example: "Index name must contain only lowercase alphanumeric characters or hyphens, and must not begin or end with a hyphen."
              type: "string"
            details:
              description: "Additional information about the error. This field is not guaranteed to be present."
              type: "object"
          required:
          - "code"
          - "message"
      required:
      - "status"
      - "error"
    Invite:
      example:
        created_at: "2026-04-14T20:00:00Z"
        email: "newhire@acme.com"
