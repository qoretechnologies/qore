      - "Users"
      summary: "Remove a user from the organization"
      description: "Remove a user from the organization and revoke their role bindings; their Pinecone account is not deleted.\n"
      operationId: "delete_user"
      parameters:
      - in: "header"
        name: "X-Pinecone-Api-Version"
        description: "Required date-based version header"
        required: true
        schema:
          default: "2026-07"
          type: "string"
        style: "simple"
      - in: "path"
        name: "user_id"
        description: "User ID"
        required: true
        schema:
          type: "string"
          format: "uuid"
        style: "simple"
      responses:
        202:
          description: "User removal request accepted. The user's role bindings are revoked immediately; the user then returns 404, and repeating the request returns 404 as well."
        401:
          description: "Unauthorized. Possible causes: Invalid API key."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                unauthorized:
                  summary: "Unauthorized"
                  value:
                    error:
                      code: "UNAUTHENTICATED"
                      message: "Invalid API key."
                    status: 401
        403:
          description: "Forbidden"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        404:
          description: "Not found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        409:
          description: "Conflict. The request conflicts with the persisted state of the resource. Common causes include invariant violations (e.g., removing the last `OrgOwner`), lifecycle-state mismatches (e.g., resending an invite that is not pending), and constraint violations checked against persisted data."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                last-org-owner:
                  summary: "Cannot delete the last OrgOwner"
                  value:
                    error:
                      code: "ABORTED"
                      message: "Cannot delete the last OrgOwner role binding for this organization."
                    status: 409
                invite-not-pending:
                  summary: "Resend rejected: invite is not pending"
                  value:
                    error:
                      code: "ALREADY_EXISTS"
                      message: "Invite has already been accepted and cannot be resent."
                    status: 409
                invite-already-pending:
                  summary: "Invite rejected: pending invite already exists for this email"
                  value:
                    error:
                      code: "ALREADY_EXISTS"
                      message: "A pending invite already exists for this email; its ID is 9c8e3528-b9c0-4358-84ce-84c28e91b566."
                    status: 409
                already-member:
                  summary: "Invite rejected: email already belongs to an org member"
                  value:
                    error:
                      code: "ALREADY_EXISTS"
                      message: "This email already belongs to a member of the organization."
                    status: 409
                duplicate-role-binding:
                  summary: "Role binding rejected: identical binding already exists"
                  value:
                    error:
                      code: "ALREADY_EXISTS"
                      message: "A role binding with these attributes already exists."
                    status: 409
                binding-to-processed-invite:
                  summary: "Role binding rejected: invite already accepted"
                  value:
                    error:
                      code: "ALREADY_EXISTS"
                      message: "The invite has already been accepted; manage role bindings on the resulting user instead."
                    status: 409
                last-org-membership-binding:
                  summary: "Cannot remove the last organization-membership binding for a user"
                  value:
                    error:
                      code: "ABORTED"
                      message: "Cannot delete the last organization-membership role binding for this user."
                    status: 409
                invite-membership-binding:
                  summary: "Cannot remove the last organization-membership binding for a pending invite"
                  value:
                    error:
                      code: "ABORTED"
                      message: "Cannot delete the last organization-membership role binding for a pending invite; delete the invite instead."
                    status: 409
        4XX:
          description: "Unexpected error on request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        500:
          description: "Internal server error."
          content:
