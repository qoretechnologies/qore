openapi: "3.0.3"
info:
  title: "Pinecone Data Plane API"
  description: "Pinecone is a vector database that makes it easy to search and retrieve billions of high-dimensional vectors."
  contact:
    name: "Pinecone Support"
    url: "https://support.pinecone.io"
    email: "support@pinecone.io"
  license:
    name: "Apache 2.0"
    url: "https://www.apache.org/licenses/LICENSE-2.0"
  version: "2026-07"
servers:
- url: "https://{index_host}"
  variables:
    index_host:
      default: "unknown"
      description: "host of the index"
paths:
  /bulk/imports:
    get:
      tags:
      - "Bulk Operations"
      summary: "List imports"
      description: "List all recent and ongoing import operations.\n\nBy default, `list_imports` returns up to 100 imports per page. If the `limit` parameter is set, `list` returns up to that number of imports instead. Whenever there are additional IDs to return, the response includes `pagination.next`, a token you pass as `paginationToken` to get the next batch of imports. When the response has no `pagination`, there are no more imports to return.\n\nFor guidance and examples, see [Import data](https://docs.pinecone.io/guides/index-data/import-data)."
      operationId: "listBulkImports"
      parameters:
      - in: "header"
        name: "X-Pinecone-Api-Version"
        description: "Required date-based version header"
        required: true
        schema:
          default: "2026-07"
          type: "string"
        style: "simple"
      - in: "query"
        name: "limit"
        description: "Max number of operations to return per page."
        schema:
          default: 100
          type: "integer"
          format: "int32"
          minimum: 1
          maximum: 100
        example: 10
        style: "form"
      - in: "query"
        name: "paginationToken"
        description: "Pagination token to continue a previous listing operation."
        schema:
          type: "string"
        style: "form"
      responses:
        200:
          description: "A list of import operations"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListImportsResponse"
        400:
          description: "Bad request. The request body included invalid request parameters."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
        401:
          description: "Unauthorized. Possible causes: missing or invalid API key."
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/UnauthorizedMessage"
        4XX:
          description: "An unexpected error response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
        5XX:
          description: "An unexpected error response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
    post:
      tags:
      - "Bulk Operations"
      summary: "Start import"
      description: "Start an asynchronous import of vectors from object storage into an index.\n\nFor guidance and examples, see [Import data](https://docs.pinecone.io/guides/index-data/import-data)."
      operationId: "startBulkImport"
      parameters:
      - in: "header"
        name: "X-Pinecone-Api-Version"
        description: "Required date-based version header"
        required: true
        schema:
          default: "2026-07"
          type: "string"
        style: "simple"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartImportRequest"
        required: true
      responses:
        200:
          description: "Successful import operation"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StartImportResponse"
        400:
          description: "Bad request. The request body included invalid request parameters."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
        401:
          description: "Unauthorized. Possible causes: missing or invalid API key."
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/UnauthorizedMessage"
        4XX:
          description: "An unexpected error response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
        5XX:
          description: "An unexpected error response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
  /bulk/imports/{id}:
    get:
      tags:
      - "Bulk Operations"
      summary: "Describe an import"
      description: "Return details of a specific import operation.\n\nFor guidance and examples, see [Import data](https://docs.pinecone.io/guides/index-data/import-data)."
      operationId: "describeBulkImport"
      parameters:
      - in: "header"
        name: "X-Pinecone-Api-Version"
        description: "Required date-based version header"
        required: true
        schema:
          default: "2026-07"
          type: "string"
        style: "simple"
      - in: "path"
        name: "id"
        description: "Unique identifier for the import operation."
        required: true
        schema:
          type: "string"
          minLength: 1
          maxLength: 1000
        example: "101"
        style: "simple"
      responses:
        200:
          description: "Details of the import operation."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportModel"
        400:
          description: "Bad request. The request body included invalid request parameters."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
        401:
          description: "Unauthorized. Possible causes: missing or invalid API key."
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/UnauthorizedMessage"
        4XX:
          description: "An unexpected error response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
        5XX:
          description: "An unexpected error response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
    delete:
      tags:
      - "Bulk Operations"
      summary: "Cancel an import"
      description: "Cancel an import operation if it is not yet finished. It has no effect if the operation is already finished.\n\nFor guidance and examples, see [Import data](https://docs.pinecone.io/guides/index-data/import-data)."
      operationId: "cancelBulkImport"
      parameters:
      - in: "header"
        name: "X-Pinecone-Api-Version"
        description: "Required date-based version header"
        required: true
        schema:
          default: "2026-07"
          type: "string"
        style: "simple"
      - in: "path"
        name: "id"
        description: "Unique identifier for the import operation."
        required: true
        schema:
          type: "string"
          minLength: 1
          maxLength: 1000
        example: "101"
        style: "simple"
      responses:
        200:
          description: "Operation cancelled successfully"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelImportResponse"
        400:
          description: "Bad request. The request body included invalid request parameters."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
        401:
          description: "Unauthorized. Possible causes: missing or invalid API key."
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/UnauthorizedMessage"
        4XX:
          description: "An unexpected error response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
        5XX:
          description: "An unexpected error response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
  /describe_index_stats:
    post:
      tags:
      - "Vector Operations"
      summary: "Get index stats"
      description: "Return statistics about the contents of an index, including the vector count per namespace, the number of dimensions, and the index fullness.\n\nServerless indexes scale automatically as needed, so index fullness is relevant only for pod-based indexes."
      operationId: "describeIndexStats"
      parameters:
      - in: "header"
        name: "X-Pinecone-Api-Version"
        description: "Required date-based version header"
        required: true
        schema:
          default: "2026-07"
          type: "string"
        style: "simple"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DescribeIndexStatsRequest"
        required: true
      responses:
        200:
          description: "A successful response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IndexDescription"
        400:
          description: "Bad request. The request body included invalid request parameters."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
        401:
          description: "Unauthorized. Possible causes: missing or invalid API key."
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/UnauthorizedMessage"
        4XX:
          description: "An unexpected error response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
        5XX:
          description: "An unexpected error response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
  /query:
    post:
      tags:
      - "Vector Operations"
      summary: "Search with a vector"
      description: "Search a namespace using a query vector. It retrieves the ids of the most similar items in a namespace, along with their similarity scores.\n\nFor guidance, examples, and limits, see [Search](https://docs.pinecone.io/guides/search/search-overview)."
      operationId: "queryVectors"
      parameters:
      - in: "header"
        name: "X-Pinecone-Api-Version"
        description: "Required date-based version header"
        required: true
        schema:
          default: "2026-07"
          type: "string"
        style: "simple"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueryRequest"
        required: true
      responses:
        200:
          description: "A successful response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueryResponse"
          links:
            FetchMatchedRecord:
              description: "Look up a record returned as a query match."
              operationId: "fetchVectors"
              parameters:
                ids: "$response.body#/matches/0/id"
                namespace: "$response.body#/namespace"
            UpdateMatchedRecord:
              description: "Update a record returned as a query match."
              operationId: "updateVector"
            DeleteMatchedRecord:
              description: "Delete a record returned as a query match."
              operationId: "deleteVectors"
        400:
          description: "Bad request. The request body included invalid request parameters."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
        401:
          description: "Unauthorized. Possible causes: missing or invalid API key."
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/UnauthorizedMessage"
        4XX:
          description: "An unexpected error response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
        5XX:
          description: "An unexpected error response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
  /vectors/delete:
    post:
      tags:
      - "Vector Operations"
      summary: "Delete records"
      description: "Delete records by id or by metadata from a single namespace.\n\nFor guidance and examples, see [Delete data](https://docs.pinecone.io/guides/manage-data/delete-data)."
      operationId: "deleteVectors"
      parameters:
      - in: "header"
        name: "X-Pinecone-Api-Version"
        description: "Required date-based version header"
        required: true
        schema:
          default: "2026-07"
          type: "string"
        style: "simple"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeleteRequest"
        required: true
      responses:
        200:
          description: "A successful response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteResponse"
          links:
            FetchDeletedRecord:
              description: "Confirm a deleted record is gone."
              operationId: "fetchVectors"
              parameters:
                ids: "$request.body#/ids/0"
                namespace: "$request.body#/namespace"
        400:
          description: "Bad request. The request body included invalid request parameters."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
        401:
          description: "Unauthorized. Possible causes: missing or invalid API key."
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/UnauthorizedMessage"
        4XX:
          description: "An unexpected error response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
        5XX:
          description: "An unexpected error response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
  /vectors/fetch:
    get:
      tags:
      - "Vector Operations"
      summary: "Fetch records"
      description: "Look up and return records by ID from a single namespace. The returned records include the vector data and/or metadata.\nFor on-demand indexes, since vector values are retrieved from object storage, fetch operations may have increased latency. If you only need metadata or IDs, consider using the query operation with `includeValues` set to `false` instead.\nFor guidance and examples, see [Fetch data](https://docs.pinecone.io/guides/manage-data/fetch-data)."
      operationId: "fetchVectors"
      parameters:
      - in: "header"
        name: "X-Pinecone-Api-Version"
        description: "Required date-based version header"
        required: true
        schema:
          default: "2026-07"
          type: "string"
        style: "simple"
      - in: "query"
        name: "ids"
        description: "The vector IDs to fetch."
        required: true
        schema:
          type: "array"
          items:
            type: "string"
            pattern: "^[\\x01-\\x7F]+$"
            minLength: 1
            maxLength: 512
          minItems: 1
          maxItems: 1000
        explode: true
        style: "form"
      - in: "query"
        name: "namespace"
        description: "The namespace to fetch records from. If not provided, the default namespace is used."
        schema:
          type: "string"
        style: "form"
      responses:
        200:
          description: "A successful response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FetchResponse"
        400:
          description: "Bad request. The request body included invalid request parameters."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
        401:
          description: "Unauthorized. Possible causes: missing or invalid API key."
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/UnauthorizedMessage"
        4XX:
          description: "An unexpected error response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
        5XX:
          description: "An unexpected error response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
  /vectors/fetch_by_metadata:
    post:
      tags:
      - "Vector Operations"
      summary: "Fetch records by metadata"
      description: "Look up and return records by metadata from a single namespace. The returned records include the vector data and metadata.\nFor guidance and examples, see [Fetch data](https://docs.pinecone.io/guides/manage-data/fetch-data)."
      operationId: "fetch_vectors_by_metadata"
      parameters:
      - in: "header"
        name: "X-Pinecone-Api-Version"
        description: "Required date-based version header"
        required: true
        schema:
          default: "2026-07"
          type: "string"
        style: "simple"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FetchByMetadataRequest"
        required: true
      responses:
        200:
          description: "A successful response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FetchByMetadataResponse"
          links:
            FetchByMetadataNextPage:
              description: "Fetch the next page of metadata matches."
              operationId: "fetch_vectors_by_metadata"
        400:
          description: "Bad request. The request body included invalid request parameters."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
        401:
          description: "Unauthorized. Possible causes: missing or invalid API key."
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/UnauthorizedMessage"
        4XX:
          description: "An unexpected error response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
        5XX:
          description: "An unexpected error response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
  /vectors/list:
    get:
      tags:
      - "Vector Operations"
      summary: "List record IDs"
      description: "List the IDs of records in a single namespace of a serverless index. An optional prefix can be passed to limit the results to IDs with a common prefix.\n\nReturns up to 100 IDs at a time by default in sorted order (bitwise \"C\" collation). If the `limit` parameter is set, `list` returns up to that number of IDs instead. Whenever there are additional IDs to return, the response includes `pagination.next`, a token you pass as `paginationToken` to get the next batch of IDs. When the response has no `pagination`, there are no more IDs to return.\n\nFor guidance and examples, see [List record IDs](https://docs.pinecone.io/guides/manage-data/list-record-ids).\n\n**Note:** `list` is supported only for serverless indexes."
      operationId: "listVectors"
      parameters:
      - in: "header"
        name: "X-Pinecone-Api-Version"
        description: "Required date-based version header"
        required: true
        schema:
          default: "2026-07"
          type: "string"
        style: "simple"
      - in: "query"
        name: "prefix"
        description: "The ID prefix to match. Only records whose ID starts with this value are returned."
        schema:
          type: "string"
          pattern: "^[\\x01-\\x7F]*$"
          maxLength: 512
        style: "form"
      - in: "query"
        name: "limit"
        description: "Max number of IDs to return per page."
        schema:
          default: 100
          type: "integer"
          format: "int64"
          minimum: 1
          maximum: 100
        style: "form"
      - in: "query"
        name: "paginationToken"
        description: "Pagination token to continue a previous listing operation."
        schema:
          type: "string"
        style: "form"
      - in: "query"
        name: "namespace"
        description: "The namespace to list vectors from. If not provided, the default namespace is used."
        schema:
          type: "string"
        style: "form"
      responses:
        200:
          description: "A successful response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListResponse"
          links:
            ListNextPage:
              description: "Fetch the next page of record IDs."
              operationId: "listVectors"
              parameters:
                paginationToken: "$response.body#/pagination/next"
                namespace: "$response.body#/namespace"
            FetchListedRecord:
              description: "Look up a record returned by list."
              operationId: "fetchVectors"
              parameters:
                ids: "$response.body#/vectors/0/id"
                namespace: "$response.body#/namespace"
            DeleteListedRecord:
              description: "Delete a record returned by list."
              operationId: "deleteVectors"
        400:
          description: "Bad request. The request body included invalid request parameters."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
        401:
          description: "Unauthorized. Possible causes: missing or invalid API key."
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/UnauthorizedMessage"
        4XX:
          description: "An unexpected error response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
        5XX:
          description: "An unexpected error response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
  /vectors/update:
    post:
      tags:
      - "Vector Operations"
      summary: "Update a record"
      description: "Update records by ID or by metadata in a namespace. Updating by ID changes the vector and/or metadata of a single record. Updating by metadata changes metadata across multiple records using a metadata filter.\nIf a vector value is included, it will overwrite the previous value. If `set_metadata` is included, only the specified metadata fields are modified, and if a specified metadata field does not exist, it is added.\nFor guidance and examples, see [Update data](https://docs.pinecone.io/guides/manage-data/update-data)."
      operationId: "updateVector"
      parameters:
      - in: "header"
        name: "X-Pinecone-Api-Version"
        description: "Required date-based version header"
        required: true
        schema:
          default: "2026-07"
          type: "string"
        style: "simple"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateRequest"
        required: true
      responses:
        200:
          description: "A successful response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateResponse"
          links:
            FetchUpdatedRecord:
              description: "Read back a record that was just updated."
              operationId: "fetchVectors"
              parameters:
                ids: "$request.body#/id"
                namespace: "$request.body#/namespace"
        400:
          description: "Bad request. The request body included invalid request parameters."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
        401:
          description: "Unauthorized. Possible causes: missing or invalid API key."
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/UnauthorizedMessage"
        4XX:
          description: "An unexpected error response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
        5XX:
          description: "An unexpected error response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
  /vectors/upsert:
    post:
      tags:
      - "Vector Operations"
      summary: "Upsert records"
      description: "Upsert records into a namespace. If a new value is upserted for an existing record ID, it will overwrite the previous value.\n\nFor guidance, examples, and limits, see [Upsert data](https://docs.pinecone.io/guides/index-data/upsert-data)."
      operationId: "upsertVectors"
      parameters:
      - in: "header"
        name: "X-Pinecone-Api-Version"
        description: "Required date-based version header"
        required: true
        schema:
          default: "2026-07"
          type: "string"
        style: "simple"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpsertRequest"
        required: true
      responses:
        200:
          description: "A successful response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpsertResponse"
          links:
            FetchUpsertedRecord:
              description: "Look up a record that was just upserted."
              operationId: "fetchVectors"
              parameters:
                ids: "$request.body#/vectors/0/id"
                namespace: "$request.body#/namespace"
            QueryUpsertedRecord:
              description: "Use a just-upserted record as a query target."
              operationId: "queryVectors"
            UpdateUpsertedRecord:
              description: "Update a record that was just upserted."
              operationId: "updateVector"
            DeleteUpsertedRecord:
              description: "Delete a record that was just upserted."
              operationId: "deleteVectors"
        400:
          description: "Bad request. The request body included invalid request parameters."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
        401:
          description: "Unauthorized. Possible causes: missing or invalid API key."
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/UnauthorizedMessage"
        4XX:
          description: "An unexpected error response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
        5XX:
          description: "An unexpected error response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/rpcStatus"
  /namespaces:
    get:
      tags:
      - "Namespace Operations"
      summary: "List namespaces"
      description: "List all namespaces in a serverless index.\n\nUp to 100 namespaces are returned at a time by default, in sorted order (bitwise “C” collation). If the `limit` parameter is set, up to that number of namespaces are returned instead. Whenever there are additional namespaces to return, the response includes `pagination.next`, a token you pass as `paginationToken` to get the next batch of namespaces. When the response has no `pagination`, there are no more namespaces to return.\n\nFor guidance and examples, see [Manage namespaces](https://docs.pinecone.io/guides/manage-data/manage-namespaces).\n\n**Note:** This operation is not supported for pod-based indexes."
      operationId: "listNamespacesOperation"
      parameters:
      - in: "header"
        name: "X-Pinecone-Api-Version"
        description: "Required date-based version header"
        required: true
        schema:
          default: "2026-07"
          type: "string"
        style: "simple"
      - in: "query"
        name: "limit"
        description: "Max number of namespaces to return per page. Defaults to 100."
        schema:
          default: 100
          type: "integer"
          format: "int32"
          minimum: 1
          maximum: 100
        example: 10
        style: "form"
      - in: "query"
        name: "paginationToken"
        description: "Pagination token to continue a previous listing operation."
        schema:
          type: "string"
        style: "form"
      - in: "query"
        name: "prefix"
