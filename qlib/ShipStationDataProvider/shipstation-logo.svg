<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="shipGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e88e5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d47a1;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="200" height="200" rx="20" ry="20" fill="url(#shipGradient)"/>
  <g transform="translate(100,100)">
    <!-- Ship/Box icon -->
    <rect x="-50" y="-30" width="100" height="60" rx="5" ry="5" fill="#ffffff" opacity="0.95"/>
    <rect x="-45" y="-25" width="90" height="10" fill="#1e88e5"/>
    <line x1="-25" y1="-10" x2="-25" y2="25" stroke="#1e88e5" stroke-width="3"/>
    <line x1="0" y1="-10" x2="0" y2="25" stroke="#1e88e5" stroke-width="3"/>
    <line x1="25" y1="-10" x2="25" y2="25" stroke="#1e88e5" stroke-width="3"/>
    <!-- Arrow indicating shipping -->
    <polygon points="55,-5 70,0 55,5" fill="#ffffff"/>
    <rect x="40" y="-2" width="18" height="4" fill="#ffffff"/>
  </g>
</svg>
