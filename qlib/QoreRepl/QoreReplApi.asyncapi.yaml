asyncapi: 3.0.0
info:
  title: Qore REPL WebSocket API
  version: 1.0.0
  description: |
    WebSocket API for remote access to the Qore REPL (Read-Eval-Print Loop).
    Enables interactive code evaluation, command execution, and output streaming
    over WebSocket connections.

servers:
  development:
    host: localhost:8080
    protocol: ws
    description: Development server
  production:
    host: repl.example.com
    protocol: wss
    description: Production server (TLS)

channels:
  repl:
    address: /ws/repl
    description: Main REPL channel for code evaluation and commands
    messages:
      # Client -> Server
      evalRequest:
        $ref: '#/components/messages/EvalRequest'
      commandRequest:
        $ref: '#/components/messages/CommandRequest'
      interruptRequest:
        $ref: '#/components/messages/InterruptRequest'
      pingRequest:
        $ref: '#/components/messages/PingRequest'
      subscribeRequest:
        $ref: '#/components/messages/SubscribeRequest'
      # Server -> Client
      resultResponse:
        $ref: '#/components/messages/ResultResponse'
      errorResponse:
        $ref: '#/components/messages/ErrorResponse'
      promptResponse:
        $ref: '#/components/messages/PromptResponse'
      outputResponse:
        $ref: '#/components/messages/OutputResponse'
      pongResponse:
        $ref: '#/components/messages/PongResponse'
      sessionResponse:
        $ref: '#/components/messages/SessionResponse'
      exitResponse:
        $ref: '#/components/messages/ExitResponse'
      subscribedResponse:
        $ref: '#/components/messages/SubscribedResponse'
      threadEvent:
        $ref: '#/components/messages/ThreadEvent'
      activityEvent:
        $ref: '#/components/messages/ActivityEvent'
      programReplacedEvent:
        $ref: '#/components/messages/ProgramReplacedEvent'

operations:
  sendEval:
    action: send
    channel:
      $ref: '#/channels/repl'
    summary: Evaluate Qore code
    description: Sends Qore code for evaluation in the REPL session
    messages:
      - $ref: '#/channels/repl/messages/evalRequest'

  sendCommand:
    action: send
    channel:
      $ref: '#/channels/repl'
    summary: Execute REPL command
    description: Sends a REPL special command (e.g., /help, /vars, /reset)
    messages:
      - $ref: '#/channels/repl/messages/commandRequest'

  sendInterrupt:
    action: send
    channel:
      $ref: '#/channels/repl'
    summary: Interrupt execution
    description: Requests interruption of current code execution
    messages:
      - $ref: '#/channels/repl/messages/interruptRequest'

  sendPing:
    action: send
    channel:
      $ref: '#/channels/repl'
    summary: Send ping
    description: Sends a ping for connection keepalive
    messages:
      - $ref: '#/channels/repl/messages/pingRequest'

  receiveResult:
    action: receive
    channel:
      $ref: '#/channels/repl'
    summary: Receive evaluation result
    description: Receives the result of code evaluation
    messages:
      - $ref: '#/channels/repl/messages/resultResponse'

  receiveError:
    action: receive
    channel:
      $ref: '#/channels/repl'
    summary: Receive error
    description: Receives an error response (parse error, runtime exception, etc.)
    messages:
      - $ref: '#/channels/repl/messages/errorResponse'

  receivePrompt:
    action: receive
    channel:
      $ref: '#/channels/repl'
    summary: Receive prompt update
    description: Receives the current prompt (indicates ready for input)
    messages:
      - $ref: '#/channels/repl/messages/promptResponse'

  receiveOutput:
    action: receive
    channel:
      $ref: '#/channels/repl'
    summary: Receive output
    description: Receives captured stdout/stderr output from code execution
    messages:
      - $ref: '#/channels/repl/messages/outputResponse'

  receivePong:
    action: receive
    channel:
      $ref: '#/channels/repl'
    summary: Receive pong
    description: Receives a pong response to a ping
    messages:
      - $ref: '#/channels/repl/messages/pongResponse'

  receiveSession:
    action: receive
    channel:
      $ref: '#/channels/repl'
    summary: Receive session info
    description: Receives session information on connection
    messages:
      - $ref: '#/channels/repl/messages/sessionResponse'

  receiveExit:
    action: receive
    channel:
      $ref: '#/channels/repl'
    summary: Receive exit notification
    description: Receives notification that the session is ending
    messages:
      - $ref: '#/channels/repl/messages/exitResponse'

  sendSubscribe:
    action: send
    channel:
      $ref: '#/channels/repl'
    summary: Select optional asynchronous messages
    description: Enables or disables the optional asynchronous messages (activity messages)
    messages:
      - $ref: '#/channels/repl/messages/subscribeRequest'

  receiveSubscribed:
    action: receive
    channel:
      $ref: '#/channels/repl'
    summary: Receive subscription state
    description: Receives the optional messages selected, in response to a subscribe request
    messages:
      - $ref: '#/channels/repl/messages/subscribedResponse'

  receiveThread:
    action: receive
    channel:
      $ref: '#/channels/repl'
    summary: Receive background thread event
    description: >
      Receives an event of a background thread started by the session's code, as it happens: the thread started,
      cancellation was requested for it, or it ended. Threads of the server are never reported.
    messages:
      - $ref: '#/channels/repl/messages/threadEvent'

  receiveActivity:
    action: receive
    channel:
      $ref: '#/channels/repl'
    summary: Receive Program activity event
    description: >
      Receives a notification that the session's Program became idle (code can be evaluated) or active; sent only
      after a subscribe request enabling activity messages
    messages:
      - $ref: '#/channels/repl/messages/activityEvent'

  receiveProgramReplaced:
    action: receive
    channel:
      $ref: '#/channels/repl'
    summary: Receive Program replacement
    description: Receives a notification that /reset replaced the session's Program; later events are about it
    messages:
      - $ref: '#/channels/repl/messages/programReplacedEvent'

components:
  schemas:
    # Client -> Server payloads
    EvalPayload:
      type: object
      required:
        - type
        - code
      properties:
        type:
          type: string
          const: eval
          description: Message type identifier
        id:
          type: string
          description: Optional request ID for correlation
        code:
          type: string
          description: Qore code to evaluate
          minLength: 1

    CommandPayload:
      type: object
      required:
        - type
        - command
      properties:
        type:
          type: string
          const: command
          description: Message type identifier
        id:
          type: string
          description: Optional request ID for correlation
        command:
          type: string
          description: >
            REPL command to execute (e.g., /help, /vars). Commands may be sent
            with or without the leading '/', and the server will add '/' if it
            is missing.
          pattern: ^/?\w+

    InterruptPayload:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          const: interrupt
          description: Message type identifier
        id:
          type: string
          description: Optional request ID for correlation

    PingPayload:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          const: ping
          description: Message type identifier
        id:
          type: string
          description: Optional request ID for correlation

    SubscribePayload:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          const: subscribe
          description: Message type identifier
        id:
          type: string
          description: Optional request ID for correlation
        activity:
          type: boolean
          description: True to receive activity messages; false (the default) to stop them

    # Server -> Client payloads
    ResultPayload:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          const: result
          description: Message type identifier
        id:
          type: string
          description: Correlation ID from request
        value:
          type: string
          description: Formatted result value
        valueType:
          type: string
          description: Qore type of the result value
        duration:
          type: number
          description: Execution duration in milliseconds

    ErrorPayload:
      type: object
      required:
        - type
        - error
        - description
      properties:
        type:
          type: string
          const: error
          description: Message type identifier
        id:
          type: string
          description: Correlation ID from request
        error:
          type: string
          description: Error code (e.g., PARSE-ERROR, RUNTIME-ERROR)
        description:
          type: string
          description: Human-readable error description
        location:
          type: object
          description: Source location of the error
          properties:
            file:
              type: string
              description: Source file name
            line:
              type: integer
              description: Line number
            column:
              type: integer
              description: Column number

    PromptPayload:
      type: object
      required:
        - type
        - value
      properties:
        type:
          type: string
          const: prompt
          description: Message type identifier
        value:
          type: string
          description: The prompt string to display
        needsMoreInput:
          type: boolean
          description: Whether more input is needed (multi-line mode)

    OutputPayload:
      type: object
      required:
        - type
        - stream
        - text
      properties:
        type:
          type: string
          const: output
          description: Message type identifier
        stream:
          type: string
          enum:
            - stdout
            - stderr
          description: Which output stream
        text:
          type: string
          description: The output text

    PongPayload:
      type: object
      required:
        - type
      properties:
        type:
          type: string
          const: pong
          description: Message type identifier
        id:
          type: string
          description: Correlation ID from ping request

    SessionPayload:
      type: object
      required:
        - type
        - sessionId
        - version
      properties:
        type:
          type: string
          const: session
          description: Message type identifier
        sessionId:
          type: string
          description: Unique session identifier
        version:
          type: string
          description: REPL protocol version
        qoreVersion:
          type: string
          description: Qore language version

    ExitPayload:
      type: object
      required:
        - type
        - reason
      properties:
        type:
          type: string
          const: exit
          description: Message type identifier
        reason:
          type: string
          enum:
            - user_request
            - timeout
            - error
            - server_shutdown
          description: Reason for session termination

    SubscribedPayload:
      type: object
      required:
        - type
        - activity
      properties:
        type:
          type: string
          const: subscribed
          description: Message type identifier
        id:
          type: string
          description: Correlation ID from the subscribe request
        activity:
          type: boolean
          description: Whether activity messages are sent

    ThreadErrorInfo:
      type: object
      description: Summary of an exception
      properties:
        err:
          type: string
          description: Error code; empty if it is not a string
        desc:
          type: string
          description: Error description; empty if it is not a string
        file:
          type: string
          description: Source of the exception
        line:
          type: integer
          description: Line number

    ThreadInfo:
      type: object
      required:
        - tid
        - threadId
      properties:
        tid:
          type: integer
          description: Thread ID; reused after the thread ends
        threadId:
          type: integer
          description: Thread ID unique in the server process
        parentTid:
          type: integer
          description: Thread ID of the thread that started it
        parentThreadId:
          type: integer
          description: Unique ID of the thread that started it, or 0 if that thread is not a background thread
        name:
          type: string
          description: Thread name
        start:
          type: string
          description: When the thread started
        cancelRequested:
          type: boolean
          description: Whether cancellation was requested (programReplaced threads only)

    ThreadPayload:
      allOf:
        - $ref: '#/components/schemas/ThreadInfo'
        - type: object
          required:
            - type
            - event
            - running
            - notices
          properties:
            type:
              type: string
              const: thread
              description: Message type identifier
            event:
              type: string
              enum:
                - started
                - cancel-requested
                - finished
              description: What happened to the thread
            running:
              type: integer
              description: Number of background threads of the session running after the event
            notices:
              type: array
              items:
                type: string
              description: Notice lines for the event at the session's thread notice level
            outcome:
              type: string
              enum:
                - COMPLETED
                - EXCEPTION
                - CANCELLED
                - INTERRUPTED
                - EXITED
                - START_FAILED
              description: How the thread ended (finished only)
            durationMs:
              type: integer
              description: How long the thread ran in milliseconds (finished only)
            error:
              $ref: '#/components/schemas/ThreadErrorInfo'
            cleanupError:
              $ref: '#/components/schemas/ThreadErrorInfo'
            cancelReason:
              type: string
              description: Reason given with the request (cancel-requested only)

    ActivityPayload:
      type: object
      required:
        - type
        - idle
        - running
      properties:
        type:
          type: string
          const: activity
          description: Message type identifier
        idle:
          type: boolean
          description: True if no code runs in the session's Program
        running:
          type: integer
          description: Number of background threads of the session running

    ProgramReplacedPayload:
      type: object
      required:
        - type
        - programId
        - running
        - threads
      properties:
        type:
          type: string
          const: programReplaced
          description: Message type identifier
        programId:
          type: integer
          description: ID of the new Program
        running:
          type: integer
          description: Number of background threads of the new Program running
        threads:
          type: array
          items:
            $ref: '#/components/schemas/ThreadInfo'
          description: Background threads of the new Program

  messages:
    # Client -> Server messages
    EvalRequest:
      name: EvalRequest
      title: Evaluation Request
      summary: Request to evaluate Qore code
      contentType: application/json
      payload:
        $ref: '#/components/schemas/EvalPayload'

    CommandRequest:
      name: CommandRequest
      title: Command Request
      summary: Request to execute a REPL command
      contentType: application/json
      payload:
        $ref: '#/components/schemas/CommandPayload'

    InterruptRequest:
      name: InterruptRequest
      title: Interrupt Request
      summary: Request to interrupt current execution
      contentType: application/json
      payload:
        $ref: '#/components/schemas/InterruptPayload'

    PingRequest:
      name: PingRequest
      title: Ping Request
      summary: Keepalive ping
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PingPayload'

    SubscribeRequest:
      name: SubscribeRequest
      title: Subscribe Request
      summary: Selects the optional asynchronous messages
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SubscribePayload'

    # Server -> Client messages
    ResultResponse:
      name: ResultResponse
      title: Result Response
      summary: Successful evaluation result
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ResultPayload'

    ErrorResponse:
      name: ErrorResponse
      title: Error Response
      summary: Error from evaluation or command
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ErrorPayload'

    PromptResponse:
      name: PromptResponse
      title: Prompt Response
      summary: Current prompt state
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PromptPayload'

    OutputResponse:
      name: OutputResponse
      title: Output Response
      summary: Captured output from execution
      contentType: application/json
      payload:
        $ref: '#/components/schemas/OutputPayload'

    PongResponse:
      name: PongResponse
      title: Pong Response
      summary: Response to ping
      contentType: application/json
      payload:
        $ref: '#/components/schemas/PongPayload'

    SessionResponse:
      name: SessionResponse
      title: Session Response
      summary: Session information on connect
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SessionPayload'

    ExitResponse:
      name: ExitResponse
      title: Exit Response
      summary: Session termination notification
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ExitPayload'

    SubscribedResponse:
      name: SubscribedResponse
      title: Subscribed Response
      summary: Optional asynchronous messages selected
      contentType: application/json
      payload:
        $ref: '#/components/schemas/SubscribedPayload'

    ThreadEvent:
      name: ThreadEvent
      title: Thread Event
      summary: A background thread of the session started, was asked to cancel, or ended
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ThreadPayload'

    ActivityEvent:
      name: ActivityEvent
      title: Activity Event
      summary: The session's Program became idle or active
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ActivityPayload'

    ProgramReplacedEvent:
      name: ProgramReplacedEvent
      title: Program Replaced Event
      summary: The session's Program was replaced by /reset
      contentType: application/json
      payload:
        $ref: '#/components/schemas/ProgramReplacedPayload'
