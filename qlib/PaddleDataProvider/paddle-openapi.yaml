      - $ref: "#/components/parameters/FilterIdParam"
      - $ref: "#/components/parameters/PaginationParams.after"
      - $ref: "#/components/parameters/PaginationParams.per_page"
      - $ref: "#/components/parameters/ListCustomersQueryParams.email"
      - $ref: "#/components/parameters/ListCustomersQueryParams.order_by"
      - $ref: "#/components/parameters/DefaultStatusQuery"
      - $ref: "#/components/parameters/ListCustomersQueryParams.search"
      - $ref: "#/components/parameters/SkipCountHeader"
      responses:
        200:
          description: "The request has succeeded."
          headers:
            Request-Id:
              required: true
              schema:
                $ref: "#/components/schemas/RequestId"
          content:
            application/json:
              schema:
                type: "object"
                required:
                - "data"
                - "meta"
                properties:
                  data:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/Customer"
                  meta:
                    $ref: "#/components/schemas/PaginatedMeta"
              examples:
                List customers (200):
                  summary: "List customers (200)"
                  value:
                    data:
                    - id: "ctm_01hv6y1jedq4p1n0yqn5ba3ky4"
                      status: "active"
                      custom_data: null
                      name: "Jo Brown-Anderson"
                      email: "jo@example.com"
                      marketing_consent: false
                      locale: "en"
                      created_at: "2024-04-11T15:57:24.813Z"
                      updated_at: "2024-04-11T15:59:56.658719Z"
                      import_meta: null
                    - id: "ctm_01h844q4mznqpgqgm6evgw1w63"
                      status: "active"
                      custom_data: null
                      name: "Jamie Price"
                      email: "jamie@example.com"
                      marketing_consent: false
                      locale: "en"
                      created_at: "2023-08-18T10:58:05.087Z"
                      updated_at: "2024-04-11T15:55:02.727195Z"
