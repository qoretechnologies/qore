    Discount:
      type: "object"
      required:
      - "id"
      - "status"
      - "description"
      - "enabled_for_checkout"
      - "code"
      - "type"
      - "mode"
      - "amount"
      - "currency_code"
      - "recur"
      - "maximum_recurring_intervals"
      - "usage_limit"
      - "restrict_to"
      - "expires_at"
      - "custom_data"
      - "times_used"
      - "discount_group_id"
      - "created_at"
      - "updated_at"
      - "import_meta"
      properties:
        id:
          allOf:
          - $ref: "#/components/schemas/DiscountId"
          readOnly: true
        status:
          allOf:
          - $ref: "#/components/schemas/DiscountStatus"
          default: "active"
        description:
          type: "string"
          minLength: 1
          maxLength: 500
          description: "Short description for this discount for your reference. Not shown to customers."
        enabled_for_checkout:
          type: "boolean"
          description: "Whether this discount can be redeemed by customers at checkout (`true`) or not (`false`)."
          default: true
        code:
          anyOf:
          - $ref: "#/components/schemas/DiscountCode"
          - type: "null"
          description: "Unique code that customers can use to redeem this discount at checkout. Not case-sensitive."
        type:
          $ref: "#/components/schemas/DiscountType"
        mode:
          allOf:
          - $ref: "#/components/schemas/DiscountMode"
          default: "standard"
        amount:
          type: "string"
          description: "Amount to discount by. For `percentage` discounts, must be an amount between `0.01` and `100`. For `flat` and `flat_per_seat` discounts, amount in the lowest denomination for a currency."
        currency_code:
          anyOf:
          - $ref: "#/components/schemas/CurrencyCode"
          - type: "null"
          description: "Supported three-letter ISO 4217 currency code. Required where discount type is `flat` or `flat_per_seat`."
        recur:
          type: "boolean"
          description: "Whether this discount applies for multiple subscription billing periods (`true`) or not (`false`)."
          default: false
        maximum_recurring_intervals:
          anyOf:
          - type: "integer"
          - type: "null"
          minimum: 1
          description: "Number of subscription billing periods that this discount recurs for. Requires `recur`. `null` if this discount recurs forever.\n\nSubscription renewals, midcycle changes, and one-time charges billed to a subscription aren't considered a redemption. `times_used` is not incremented in these cases."
        usage_limit:
          anyOf:
          - type: "integer"
          - type: "null"
          minimum: 1
          description: "Maximum number of times this discount can be redeemed. This is an overall limit for this discount, rather than a per-customer limit. `null` if this discount can be redeemed an unlimited amount of times.\n\nPaddle counts a usage as a redemption on a checkout, transaction, or the initial application against a subscription. Transactions created for subscription renewals, midcycle changes, and one-time charges aren't considered a redemption."
        restrict_to:
          anyOf:
          - type: "array"
            items:
              $ref: "#/components/schemas/DiscountRestrictTo"
          - type: "null"
          description: "Product or price IDs that this discount is for. When including a product ID, all prices for that product can be discounted. `null` if this discount applies to all products and prices."
          uniqueItems: true
        expires_at:
          anyOf:
          - $ref: "#/components/schemas/Timestamp"
          - type: "null"
          description: "RFC 3339 datetime string of when this discount expires. Discount can no longer be redeemed after this date has elapsed. `null` if this discount can be redeemed forever.\n\nExpired discounts can't be redeemed against transactions or checkouts, but can be applied when updating subscriptions."
        custom_data:
          anyOf:
          - $ref: "#/components/schemas/CustomData"
          - type: "null"
        times_used:
          type: "integer"
          description: "How many times this discount has been redeemed. Automatically incremented by Paddle.\n\nPaddle counts a usage as a redemption on a checkout, transaction, or subscription. Transactions created for subscription renewals, midcycle changes, and one-time charges aren't considered a redemption."
          readOnly: true
        discount_group_id:
          anyOf:
          - $ref: "#/components/schemas/DiscountGroupId"
          - type: "null"
          description: "Paddle ID for the discount group related to this discount, prefixed with `dsg_`. `null` if not in a discount group."
        created_at:
          allOf:
          - $ref: "#/components/schemas/CreatedAt"
          readOnly: true
        updated_at:
          allOf:
          - $ref: "#/components/schemas/UpdatedAt"
          readOnly: true
        import_meta:
          anyOf:
          - $ref: "#/components/schemas/ImportMeta"
          - type: "null"
          description: "Import information for this entity. `null` if this entity is not imported."
          x-external-readOnly: true
      description: "Represents a discount entity."
      title: "Discount"
