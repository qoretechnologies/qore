      responses:
        200:
          description: "The request has succeeded."
          headers:
            Request-Id:
              required: true
              schema:
                $ref: "#/components/schemas/RequestId"
          content:
            application/json:
              schema:
                type: "object"
                required:
                - "data"
                - "meta"
                properties:
