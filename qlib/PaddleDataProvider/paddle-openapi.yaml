openapi: "3.1.0"
info:
  title: "Paddle API"
  version: "1.0"
  contact:
    name: "Paddle Seller Support team"
    url: "https://developer.paddle.com"
    email: "sellers@paddle.com"
  license:
    name: "Paddle Market Ltd."
    url: "https://www.paddle.com/legal/terms"
  termsOfService: "https://www.paddle.com/legal/terms"
  summary: "The Paddle API lets you create, read, and update information in your Paddle Billing system."
  description: "Paddle Billing is a complete subscription and recurring revenue management platform, designed for modern SaaS businesses. It helps you increase your revenue, retain customers, and scale your operations.\n\nThe Paddle API lets you create, read, and update information in your Paddle Billing system. You can use it to integrate Paddle with your app or third-party solutions.\n\nSee https://developer.paddle.com/ to learn more."
externalDocs:
  url: "https://developer.paddle.com/"
  description: "Paddle Developer Center"
tags:
- name: "Checkout domains"
- name: "Subscription history"
- name: "Transactions"
  description: "Transaction entities calculate and capture revenue. They hold information about an amount that you're billing for."
  externalDocs:
    url: "https://developer.paddle.com/api-reference/transactions/overview"
    description: "Transaction entity overview"
- name: "Subscriptions"
  description: "Subscription entities describe a recurring billing relationship with a customer. They're closely related to transactions."
  externalDocs:
    url: "https://developer.paddle.com/api-reference/subscriptions/overview"
    description: "Subscription entity overview"
- name: "Simulations"
  description: "Simulation entities describe a reusable configuration for testing webhooks."
  externalDocs:
    url: "https://developer.paddle.com/api-reference/simulations/overview"
    description: "Simulations entity overview"
- name: "Simulation types"
  description: "Simulation type entities are the kinds of simulation you can use when testing webhooks."
  externalDocs:
    url: "https://developer.paddle.com/api-reference/simulation-types/overview"
    description: "Simulation types overview"
- name: "Simulation runs"
  description: "Simulation run entities describe an attempt by Paddle to send simulated events for a notification simulation."
  externalDocs:
    url: "https://developer.paddle.com/api-reference/simulation-runs/overview"
    description: "Simulation runs entity overview"
- name: "Simulation run events"
  description: "Simulation run event entities describe a simulated event that happened as part of a notification simulation run."
  externalDocs:
    url: "https://developer.paddle.com/api-reference/simulation-events/overview"
    description: "Simulation run events entity overview"
- name: "Reports"
  description: "Report entities describe a report generated in your Paddle system."
  externalDocs:
    url: "https://developer.paddle.com/api-reference/reports/overview"
    description: "Reports entity overview"
- name: "Products"
  description: "Product entities describe the items that customers can purchase. They hold high-level product attributes."
  externalDocs:
    url: "https://developer.paddle.com/api-reference/products/overview"
    description: "Product entity overview"
- name: "Pricing preview"
  description: "Pricing previews are calculated totals for prices."
  externalDocs:
    url: "https://developer.paddle.com/api-reference/pricing-preview/overview"
    description: "Pricing preview overview"
- name: "Prices"
  description: "Price entities describe how much and how often you charge for your products. They hold charging information."
  externalDocs:
    url: "https://developer.paddle.com/api-reference/prices/overview"
    description: "Price entity overview"
- name: "Payouts"
  description: "Payouts are payments made by Paddle."
- name: "Payment methods"
  description: "Payment method entities hold information about a payment method a customer saved at checkout for use in the future. They're related to customer entities."
  externalDocs:
    url: "https://developer.paddle.com/api-reference/payment-methods/overview"
    description: "Payment methods entity overview"
- name: "Notifications"
  description: "Notification entities describe a notification for an event that happened in your Paddle system."
  externalDocs:
    url: "https://developer.paddle.com/api-reference/notifications/overview"
    description: "Notification entity overview"
- name: "Notification settings"
  description: "Notification settings entities describe subscriptions to events. They're also called notification destinations."
  externalDocs:
    url: "https://developer.paddle.com/api-reference/notification-settings/overview"
    description: "Notification settings entity overview"
- name: "Notification logs"
  description: "Notification logs are records of an attempt to deliver a notification."
  externalDocs:
    url: "https://developer.paddle.com/api-reference/notification-logs/overview"
    description: "Notification logs entity overview"
- name: "Metrics"
  description: "Metrics entities contain timeseries data about your Paddle account, including revenue, subscribers, and conversions."
  externalDocs:
    url: "https://developer.paddle.com/api-reference/metrics/overview"
    description: "Metrics overview"
- name: "IP addresses"
  description: "Get Paddle IP addresses."
- name: "Events"
  description: "Event entities describe something notable that happened in your Paddle system."
  externalDocs:
    url: "https://developer.paddle.com/api-reference/events/overview"
    description: "Event entity overview"
- name: "Event types"
  description: "Event types are actions that Paddle creates events for."
  externalDocs:
    url: "https://developer.paddle.com/api-reference/event-types/overview"
    description: "Event types overview"
- name: "Discounts"
  description: "Discount entities describe percentage or amount-based discounts for transactions. They're sometimes called coupons or promo codes."
  externalDocs:
    url: "https://developer.paddle.com/api-reference/discounts/overview"
    description: "Discount entity overview"
- name: "Discount groups"
  description: "Discount group entities let you organize your discounts by grouping them together."
  externalDocs:
    url: "https://developer.paddle.com/api-reference/discount-groups/overview"
    description: "Discount Groups overview"
- name: "Customer portals"
  description: "The customer portal lets customers manage their subscriptions, payment methods, and account information. Customer portal sessions hold authenticated links to the portal for a customer."
  externalDocs:
    url: "https://developer.paddle.com/api-reference/customer-portals/overview"
    description: "Customer portals overview"
- name: "Customers"
  description: "Customer entities hold information about the people and businesses that make purchases. They're related to addresses and businesses."
  externalDocs:
    url: "https://developer.paddle.com/api-reference/customers/overview"
    description: "Customer entity overview"
- name: "Client tokens"
  description: "Client token entities hold the details to authenticate Paddle.js in your frontend code."
  externalDocs:
    url: "https://developer.paddle.com/api-reference/client-tokens/overview"
    description: "Client-side tokens entity overview"
- name: "Businesses"
  description: "Business entities hold information about customer businesses. They're sub-entities of customers."
  externalDocs:
    url: "https://developer.paddle.com/api-reference/businesses/overview"
    description: "Business entity overview"
- name: "API keys"
  description: "API key entities hold details on the secure credentials that authenticate server-side requests to the Paddle API."
  externalDocs:
    url: "https://developer.paddle.com/api-reference/about/api-keys"
    description: "API keys overview"
- name: "Adjustments"
  description: "Adjustment entities describe post-billing adjustments to billed or completed transactions."
  externalDocs:
    url: "https://developer.paddle.com/api-reference/adjustments/overview"
    description: "Adjustments entity overview"
- name: "Addresses"
  description: "Address entities hold billing address information for a customer. They're sub-entities of customers."
  externalDocs:
    url: "https://developer.paddle.com/api-reference/addresses/overview"
    description: "Address entity overview"
paths:
  /customers:
    get:
      operationId: "list-customers"
      summary: "List customers"
      description: "Returns a paginated list of customers. Use the query parameters to page through results.\n\nBy default, Paddle returns customers that are `active`. Use the `status` query parameter to return customers that are archived."
