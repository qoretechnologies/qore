    Meta:
      type: "object"
      required:
      - "request_id"
      properties:
        request_id:
          type: "string"
          description: "Unique ID for the request relating to this response. Provide this when contacting Paddle support about a specific request."
          examples:
          - "b15ec92e-8688-40d4-a04d-f44cbec93355"
          readOnly: true
      description: "Information about this response."
    ErrorResponseType:
      type: "string"
      enum:
      - "request_error"
      - "api_error"
      description: "Represents an error."
      x-enum-descriptions:
        request_error:
          description: "Typically means there's a problem with the request that you made."
        api_error:
          description: "Typically means there's a problem with the Paddle API."
    ErrorItem:
      type: "object"
      required:
      - "field"
      - "message"
      properties:
        field:
          type: "string"
          description: "Field where validation error occurred."
          examples:
          - "image_url"
          - "name"
        message:
          type: "string"
          description: "Information about how the field failed validation."
          examples:
          - "must be a valid image"
          - "max length of 200 exceeded, provided value length 220"
      additionalProperties: false
    ApiError:
      type: "object"
      required:
      - "type"
      - "code"
      - "detail"
      - "documentation_url"
      properties:
        type:
          allOf:
          - $ref: "#/components/schemas/ErrorResponseType"
          description: "Type of error encountered."
        code:
          type: "string"
          description: "Short snake case string that describes this error. Use to search the error reference."
          examples:
          - "not_found"
        detail:
          type: "string"
          description: "Some information about what went wrong as a human-readable string."
          examples:
          - "Entity pro_01gsz97mq9pa4fkyy0wqenepkz not found"
        documentation_url:
          type: "string"
          format: "uri"
          description: "Link to a page in the error reference for this specific error."
          examples:
          - "https://developer.paddle.com/errors/shared/not_found"
        errors:
          type: "array"
          items:
            $ref: "#/components/schemas/ErrorItem"
          description: "List of validation errors. Only returned when there's a validation error."
      description: "Represents an error."
      title: "Error"
      additionalProperties: false
    ErrorResponse:
      type: "object"
      required:
      - "error"
      - "meta"
      properties:
        error:
          allOf:
          - $ref: "#/components/schemas/ApiError"
          description: "Represents an error."
        meta:
          $ref: "#/components/schemas/Meta"
      description: "An error occurred. Check the `type`, `code`, and `detail` in the returned error object for more information.\n\nValidation errors include an array of `errors` with information about which fields failed validation."
      title: "ErrorResponse"
    Name:
      type: "string"
