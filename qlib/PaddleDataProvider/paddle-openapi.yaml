        description:
          type: "string"
          minLength: 1
          maxLength: 500
          description: "Short description for this discount for your reference. Not shown to customers."
        type:
          allOf:
          - $ref: "#/components/schemas/DiscountType"
          description: "Type of discount. Determines how this discount impacts the checkout or transaction total."
          title: "DiscountType"
          x-enum-descriptions:
            flat:
              description: "Discounts a checkout or transaction by a flat amount, for example -$100. Requires `currency_code`."
            flat_per_seat:
              description: "Discounts a checkout or transaction by a flat amount per unit, for example -$100 per user. Requires `currency_code`."
            percentage:
              description: "Discounts a checkout or transaction by a percentage of the total, for example -10%. Maximum 100%."
        amount:
          type: "string"
          description: "Amount to discount by. For `percentage` discounts, must be an amount between `0.01` and `100`. For `flat` and `flat_per_seat` discounts, amount in the lowest denomination for a currency."
        recur:
          type: "boolean"
          description: "Whether this discount applies for multiple subscription billing periods (`true`) or not (`false`). If omitted, defaults to `false`."
          default: false
        maximum_recurring_intervals:
          anyOf:
          - type: "integer"
          - type: "null"
          minimum: 1
          description: "Number of subscription billing periods that this discount recurs for. Requires `recur`. `null` if this discount recurs forever.\n\nSubscription renewals, midcycle changes, and one-time charges billed to a subscription aren't considered a redemption. `times_used` is not incremented in these cases."
        custom_data:
          anyOf:
          - $ref: "#/components/schemas/CustomData"
          - type: "null"
          description: "Your own structured key-value data."
        restrict_to:
          anyOf:
          - type: "array"
            items:
              type: "string"
          - type: "null"
          description: "Product or price IDs that this discount is for. When including a product ID, all prices for that product can be discounted. `null` if this discount applies to all products and prices."
          uniqueItems: true
      description: "Represents a discount entity for a custom, non-catalog discount."
      title: "DiscountCustom"
      additionalProperties: false
    TransactionItemCreateWithPriceId:
      type: "object"
      required:
      - "quantity"
      - "price_id"
      properties:
        quantity:
          type: "integer"
          minimum: 1
          description: "Quantity of this item on the transaction."
        proration:
          anyOf:
          - $ref: "#/components/schemas/TransactionItemProration"
          - type: "null"
          description: "How proration was calculated for this item. Populated when a transaction is created from a subscription change, where `proration_billing_mode` was `prorated_immediately` or `prorated_next_billing_period`. Set automatically by Paddle."
          readOnly: true
        price_id:
          allOf:
          - $ref: "#/components/schemas/PriceId"
          description: "Paddle ID of an existing catalog price to add to this transaction, prefixed with `pri_`."
          writeOnly: true
      description: "Add a catalog item to a transaction. In this case, the product and price that you're billing for exist in your product catalog in Paddle."
      title: "Catalog item"
    TransactionItemCreateWithPrice:
      type: "object"
      required:
      - "quantity"
      - "price"
      properties:
        quantity:
          type: "integer"
          minimum: 1
          description: "Quantity of this item on the transaction."
        proration:
          anyOf:
          - $ref: "#/components/schemas/TransactionItemProration"
          - type: "null"
          description: "How proration was calculated for this item. Populated when a transaction is created from a subscription change, where `proration_billing_mode` was `prorated_immediately` or `prorated_next_billing_period`. Set automatically by Paddle."
          readOnly: true
        price:
          allOf:
          - $ref: "#/components/schemas/TransactionPriceCreateWithProductId"
          description: "Price object for a non-catalog item to charge for. Include a `product_id` to relate this non-catalog price to an existing catalog price."
      description: "Add a non-catalog price for an existing product in your catalog to a transaction. In this case, the product you're billing for is a catalog product, but you charge a specific price for it."
      title: "Non-catalog price for an existing product"
    TransactionItemCreateWithPriceAndProduct:
      type: "object"
      required:
      - "quantity"
      - "price"
      properties:
        quantity:
          type: "integer"
          minimum: 1
          description: "Quantity of this item on the transaction."
        proration:
          anyOf:
          - $ref: "#/components/schemas/TransactionItemProration"
          - type: "null"
          description: "How proration was calculated for this item. Populated when a transaction is created from a subscription change, where `proration_billing_mode` was `prorated_immediately` or `prorated_next_billing_period`. Set automatically by Paddle."
          readOnly: true
        price:
          allOf:
          - $ref: "#/components/schemas/TransactionPriceCreateWithProduct"
          description: "Price object for a non-catalog item to charge for. Include a `product` object to create a non-catalog product for this non-catalog price."
      description: "Add a non-catalog price for a non-catalog product in your catalog to a transaction. In this case, the product and price that you're billing for are specific to this transaction."
      title: "Non-catalog price and product"
    TransactionItemCreate:
      oneOf:
      - $ref: "#/components/schemas/TransactionItemCreateWithPriceId"
      - $ref: "#/components/schemas/TransactionItemCreateWithPrice"
      - $ref: "#/components/schemas/TransactionItemCreateWithPriceAndProduct"
    TransactionCheckoutCreate:
      type: "object"
      properties:
        url:
          anyOf:
          - type: "string"
          - type: "null"
          minLength: 1
          maxLength: 2048
          description: "Checkout URL to use for the payment link for this transaction. Pass the URL for an approved domain, or `null` to set to your default payment URL.\n\nPaddle returns a unique payment link composed of the URL passed or your default payment URL + `?_ptxn=` and the Paddle ID for this transaction."
      description: "Paddle Checkout details for this transaction. You may pass a URL when creating or updating an automatically-collected transaction, or when creating or updating a manually-collected transaction where `billing_details.enable_checkout` is `true`."
      title: "TransactionCheckoutCreate"
    TransactionCreate:
      type: "object"
      required:
      - "items"
      properties:
        id:
          allOf:
          - $ref: "#/components/schemas/TransactionId"
          readOnly: true
        status:
          allOf:
          - $ref: "#/components/schemas/TransactionStatusCreate"
          description: "Status of this transaction. You may set a transaction to `billed` when creating,\nor omit to let Paddle set the status. Transactions are created as `ready` if they have\nan `address_id`, `customer_id`, and `items`, otherwise they are created as `draft`.\n\nMarking as `billed` when creating is typically used when working with manually-collected\ntransactions as part of an invoicing workflow. Billed transactions cannot be updated, only canceled."
        customer_id:
          anyOf:
          - $ref: "#/components/schemas/CustomerId"
          - type: "null"
          description: "Paddle ID of the customer that this transaction is for, prefixed with `ctm_`. If omitted, transaction status is `draft`."
        address_id:
          anyOf:
          - $ref: "#/components/schemas/AddressId"
          - type: "null"
          description: "Paddle ID of the address that this transaction is for, prefixed with `add_`. Requires `customer_id`. If omitted, transaction status is `draft`."
        business_id:
          anyOf:
          - $ref: "#/components/schemas/BusinessId"
          - type: "null"
          description: "Paddle ID of the business that this transaction is for, prefixed with `biz_`. Requires `customer_id`. "
        custom_data:
          anyOf:
          - $ref: "#/components/schemas/CustomData"
          - type: "null"
          description: "Your own structured key-value data."
        currency_code:
          anyOf:
          - $ref: "#/components/schemas/CurrencyCode"
          - type: "null"
          description: "Supported three-letter ISO 4217 currency code. Must be `USD`, `EUR`, or `GBP` if `collection_mode` is `manual`."
        origin:
          allOf:
          - $ref: "#/components/schemas/TransactionOrigin"
          x-external-readOnly: true
        subscription_id:
          anyOf:
          - $ref: "#/components/schemas/SubscriptionId"
          - type: "null"
          description: "Paddle ID of the subscription that this transaction is for, prefixed with `sub_`."
          x-external-readOnly: true
        invoice_id:
          anyOf:
          - type: "string"
          - type: "null"
          pattern: "^inv_[a-z\\d]{26}$"
          description: "Paddle ID of the invoice that this transaction is related to, prefixed with `inv_`. Used for compatibility with the Paddle Invoice API, which is now deprecated. This field is scheduled to be removed in the next version of the Paddle API."
          deprecated: true
          examples:
          - "inv_01ghbk4xjn4qdsmstcwzgcgg35"
          readOnly: true
        invoice_number:
          anyOf:
          - type: "string"
          - type: "null"
          description: "Invoice number for this transaction. Automatically generated by Paddle when you mark a transaction as `billed` where `collection_mode` is `manual`."
          examples:
          - "123-45678"
          readOnly: true
        collection_mode:
          allOf:
          - $ref: "#/components/schemas/CollectionMode"
          description: "How payment is collected for this transaction. `automatic` for checkout, `manual` for invoices. If omitted, defaults to `automatic`."
          default: "automatic"
        discount_id:
          anyOf:
          - $ref: "#/components/schemas/DiscountId"
          - type: "null"
          description: "Paddle ID of the discount to apply to this transaction, prefixed with `dsc_`."
        discount:
          anyOf:
          - $ref: "#/components/schemas/DiscountCustom"
          - type: "null"
          description: "Apply a non-catalog discount to a transaction. Send one of `discount_id` or `discount`."
        billing_details:
          anyOf:
          - $ref: "#/components/schemas/BillingDetailsCreate"
          - type: "null"
          description: "Details for invoicing. Required if `collection_mode` is `manual`."
        billing_period:
          anyOf:
          - $ref: "#/components/schemas/TimePeriod"
          - type: "null"
          description: "Time period that this transaction is for. Set automatically by Paddle for subscription renewals to describe the period that charges are for."
        items:
          type: "array"
          items:
            $ref: "#/components/schemas/TransactionItemCreate"
          minItems: 1
          maxItems: 100
          description: "List of items to charge for. You can charge for items that you've added to your catalog by passing the Paddle ID of an existing price entity, or you can charge for non-catalog items by passing a price object.\n\nNon-catalog items can be for existing products, or you can pass a product object as part of your price to charge for a non-catalog product."
        details:
          allOf:
          - $ref: "#/components/schemas/TransactionDetails"
          readOnly: true
        payments:
          type: "array"
          items:
            $ref: "#/components/schemas/TransactionPaymentAttempt"
          description: "List of payment attempts for this transaction, including successful payments. Sorted by `created_at` in descending order, so most recent attempts are returned first."
          readOnly: true
        checkout:
          anyOf:
          - $ref: "#/components/schemas/TransactionCheckoutCreate"
          - type: "null"
          description: "Paddle Checkout details for this transaction. You may pass a URL when creating or updating an automatically-collected transaction, or when creating or updating a manually-collected transaction where `billing_details.enable_checkout` is `true`."
          title: "TransactionCheckout"
        created_at:
          allOf:
          - $ref: "#/components/schemas/CreatedAt"
          readOnly: true
        updated_at:
          allOf:
          - $ref: "#/components/schemas/UpdatedAt"
          readOnly: true
        billed_at:
          anyOf:
          - $ref: "#/components/schemas/Timestamp"
          - type: "null"
          description: "RFC 3339 datetime string of when this transaction was marked as `billed`. `null` for transactions that aren't `billed` or `completed`. Set automatically by Paddle."
          readOnly: true
      description: "Represents a transaction entity when creating transactions."
      title: "TransactionCreate"
  securitySchemes:
    BearerAuth:
      type: "http"
      scheme: "Bearer"
      description: "Requests are authenticated with API keys. Provide your API key as a Bearer token in the Authorization header.\n\nAPI keys are assigned permissions, granting them access to entities and operations.\nEach endpoint may require one or more permissions, defined with the `x-permissions` extension.\nValues for include parameters may require specific permissions as defined in the `x-enum-permissions` extension.\nSee all available permissions in the apikey-permission schema or [documentation](https://developer.paddle.com/api-reference/about/permissions).\n\nGet an API key and select the permissions you need from the Paddle dashboard under [Paddle > Developer Tools > Authentication](https://vendors.paddle.com/authentication)."
servers:
- url: "https://sandbox-api.paddle.com"
  description: "Sandbox"
  variables: {}
- url: "https://api.paddle.com"
  description: "Live"
  variables: {}
