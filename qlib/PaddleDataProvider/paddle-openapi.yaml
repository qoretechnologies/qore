        subscription_payment_method_change:
          description: "Return transactions where the origin is `subscription_payment_method_change`. Returned transactions were created automatically as part of updating a payment method. May be a zero value transaction."
        subscription_recurring:
          description: "Return transactions where the origin is `subscription_recurring`. Returned transactions were created automatically by Paddle as a result of a subscription renewal."
        subscription_update:
          description: "Return transactions where the origin is `subscription_update`. Returned transactions were created automatically by Paddle as a result of an update to a subscription."
        subscription_import:
          description: "Return transactions where the origin is `subscription_import`. Returned transactions that were created automatically by Paddle as a result of a subscription import."
