    Pagination:
      type: "object"
      required:
      - "per_page"
      - "next"
      - "has_more"
      properties:
        per_page:
          type: "integer"
          description: "Number of entities per page for this response. May differ from the number requested if the requested number is greater than the maximum."
          readOnly: true
        next:
          type: "string"
          format: "uri"
          description: "URL containing the query parameters of the original request, along with the `after` parameter that marks the starting point of the next page. Always returned, even if `has_more` is `false`."
          readOnly: true
        has_more:
          type: "boolean"
          description: "Whether this response has another page."
          readOnly: true
        estimated_total:
          type: "integer"
          description: "Estimated number of entities for this response.\n\nFor datasets with 100,000 or fewer matches, returns the exact count. For datasets with more than 100,000 matches, returns `100001` to indicate that more than 100,000 entities match. Returns `-1` when counting is skipped or couldn't be calculated.\n\nUse `has_more` and `next` to page through all results rather than relying on `estimated_total` for an exact count."
          examples:
          - 999
          readOnly: true
