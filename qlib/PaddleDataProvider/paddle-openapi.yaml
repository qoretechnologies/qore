      - "ntfset_01gt21c5pdx9q1e4mh1xrsjjn6"
      readOnly: true
    NotificationSettingType:
      type: "string"
      enum:
      - "email"
      - "url"
      description: "Where notifications should be sent for this destination."
      title: "NotificationSettingType"
      x-enum-descriptions:
        email:
          description: "Deliver to an email address."
        url:
          description: "Deliver to a webhook endpoint."
    NotificationSetting:
      type: "object"
      required:
      - "id"
      - "description"
      - "type"
      - "destination"
      - "active"
      - "api_version"
      - "include_sensitive_fields"
      - "subscribed_events"
      - "endpoint_secret_key"
      - "traffic_source"
      properties:
        id:
          allOf:
          - $ref: "#/components/schemas/NotificationSettingId"
          readOnly: true
        description:
          type: "string"
          minLength: 1
          maxLength: 500
          description: "Short description for this notification destination. Shown in the Paddle dashboard."
        type:
          allOf:
          - $ref: "#/components/schemas/NotificationSettingType"
          description: "Where notifications should be sent for this destination."
          title: "NotificationSettingType"
        destination:
          type: "string"
          minLength: 1
          maxLength: 2048
          description: "Webhook endpoint URL or email address."
        active:
          type: "boolean"
          description: "Whether Paddle should try to deliver events to this notification destination."
          default: true
        api_version:
          type: "integer"
          minimum: 1
          description: "API version that returned objects for events should conform to. Must be a valid version of the Paddle API. Can't be a version older than your account default."
        include_sensitive_fields:
          type: "boolean"
          description: "Whether potentially sensitive fields should be sent to this notification destination."
          default: false
        subscribed_events:
          type: "array"
          items:
            $ref: "#/components/schemas/EventType"
          description: "Subscribed events for this notification destination."
        endpoint_secret_key:
