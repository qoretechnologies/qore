      - "billed"
      - "paid"
      - "completed"
      - "canceled"
      - "past_due"
      x-enum-descriptions:
        draft:
          description: "Return transactions where the status is `draft`. Returned transactions are missing required fields."
        ready:
          description: "Return transactions where the status is `ready`. Returned transactions have all of the required fields to be marked as `billed` or `completed`."
        billed:
          description: "Return transactions where the status is `billed`. Returned transactions are considered legal records and cannot be changed."
        paid:
          description: "Return transactions where the status is `paid`. Returned transactions are fully paid, but have not yet been fully processed internally."
        completed:
          description: "Return transactions where the status is `completed`. Returned transactions are fully paid and processed."
        canceled:
          description: "Return transactions where the status is `canceled`. Returned transactions have been canceled and are no longer due."
        past_due:
          description: "Return transactions where the status is `past_due`. Returned transactions are past due, meaning payment failed for automatically-collected transactions or payment terms elapsed for manually-collected transactions."
    TransactionStatusCreate:
      type: "string"
      enum:
      - "draft"
      - "ready"
      - "billed"
      - "paid"
      - "completed"
      - "canceled"
      - "past_due"
      description: "Status of this transaction. You may set a transaction to `billed` or `canceled`, other statuses are set automatically by Paddle. Automatically-collected transactions may return `completed` if payment is captured successfully, or `past_due` if payment failed."
      title: "TransactionStatusCreate"
      x-enum-descriptions:
        draft:
          description: "Transaction is missing required fields. Typically the first stage of a checkout before customer details are captured."
          readOnly: true
        ready:
          description: "Transaction has all of the required fields to be marked as `billed` or `completed`."
          readOnly: true
        billed:
          description: "Transaction has been updated to `billed`. Billed transactions get an invoice number and are considered a legal record. They cannot be changed. Typically used as part of an invoice workflow."
        paid:
          description: "Transaction is fully paid, but has not yet been processed internally."
          readOnly: true
        completed:
          description: "Transaction is fully paid and processed."
          readOnly: true
        canceled:
          description: "Transaction has been updated to `canceled`. If an invoice, it's no longer due."
        past_due:
          description: "Transaction is past due. Occurs for automatically-collected transactions when the related subscription is in dunning, and for manually-collected transactions when payment terms have elapsed."
          readOnly: true
