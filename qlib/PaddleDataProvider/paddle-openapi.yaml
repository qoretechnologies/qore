      - "Customers"
      externalDocs:
        url: "https://developer.paddle.com/api-reference/customers/update-customer"
        description: "Update a customer"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerUpdate"
            examples:
              Update a customer (200):
                summary: "Update a customer (200)"
                value:
                  name: "Jo Brown-Anderson"
      x-permissions:
