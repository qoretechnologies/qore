  /customers/{customer_id}/credit-balances:
    get:
      operationId: "list-credit-balances"
      summary: "List credit balances for a customer"
      description: "Returns a list of credit balances for each currency for a customer. Each balance has three totals:\n\n* `available`: total available to use.\n* `reserved`: total temporarily reserved for billed transactions.\n* `used`: total amount of credit used.\n\nCredit is added to the `available` total initially. When used, it moves to the `used` total.\n\nThe `reserved` total is used when a credit balance is applied to a transaction that's marked as `billed`, like when working with an issued invoice. It's not available for other transactions at this point, but isn't considered `used` until the transaction is completed. If a `billed` transaction is `canceled`, any reserved credit moves back to `available`.\n\nCredit balances are created automatically by Paddle when you take an action that results in Paddle creating a credit for a customer, like making prorated changes to a subscription. An empty `data` array is returned where a customer has no credit balances.\n\nThe response is not paginated."
      parameters:
      - $ref: "#/components/parameters/CustomerIdPathParam"
      - $ref: "#/components/parameters/ListCreditBalancesQueryParams"
      responses:
        200:
          description: "The request has succeeded."
          headers:
            Request-Id:
              required: true
              schema:
                $ref: "#/components/schemas/RequestId"
          content:
            application/json:
              schema:
                type: "object"
                required:
                - "data"
                - "meta"
                properties:
                  data:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/CreditBalance"
                  meta:
                    $ref: "#/components/schemas/Meta"
              examples:
                List credit balances for a customer (200):
                  summary: "List credit balances for a customer (200)"
                  value:
                    data:
                    - customer_id: "ctm_01gw9m680k848184fpttwr0b7z"
                      currency_code: "USD"
                      balance:
                        available: "550"
                        reserved: "900"
                        used: "1300"
                    meta:
                      request_id: "32cf1966-ed49-47d6-a76a-a9b8f7843245"
        default:
          description: "An unexpected error response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      tags:
      - "Customers"
      externalDocs:
        url: "https://developer.paddle.com/api-reference/customers/list-credit-balances"
        description: "List credit balances for a customer"
      x-permissions:
      - "customer.read"
  /customers/{customer_id}/auth-token:
    post:
      operationId: "generate-customer-authentication-token"
      summary: "Generate an authentication token for a customer"
      description: "Generates an authentication token for a customer. You can pass a generated authentication token to Paddle.js when opening a checkout to let customers work with saved payment methods.\n\nAuthentication tokens are temporary and shouldn't be cached. They're valid until the `expires_at` date returned in the response."
      parameters:
      - $ref: "#/components/parameters/CustomerIdPathParam"
      responses:
        200:
          description: "The request has succeeded."
          headers:
            Request-Id:
              required: true
              schema:
                $ref: "#/components/schemas/RequestId"
          content:
            application/json:
              schema:
                type: "object"
                required:
                - "data"
                - "meta"
                properties:
                  data:
                    $ref: "#/components/schemas/CustomerAuthenticationToken"
                  meta:
                    $ref: "#/components/schemas/Meta"
              examples:
                Generate an authentication token for a customer (200):
                  summary: "Generate an authentication token for a customer (200)"
                  value:
                    data:
                      customer_auth_token: "pca_01hwyzq8hmdwed5p4jc4hnv6bh_01hwwggymjn0yhhb2gr4p91276_6xaav4lydudt6bgmuefeaf2xnu3umegx"
                      expires_at: "2024-05-03T10:34:12.34Z"
                    meta:
                      request_id: "fa176777-4bca-49ec-aa1e-f53885333cb7"
        default:
          description: "An unexpected error response."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
      tags:
      - "Customers"
      externalDocs:
        url: "https://developer.paddle.com/api-reference/customers/generate-customer-authentication-token"
        description: "Generate an authentication token for a customer"
      x-permissions:
      - "customer_auth_token.write"
  /notification-settings:
    post:
      operationId: "create-notification-setting"
      summary: "Create a notification setting"
      description: "Creates a new notification setting (notification destination).\n\nPass an array of event type names to `subscribed_events` to say which events you'd like to subscribe to. Paddle responds with the full event type object for each event type.\n\nIf successful, your response includes a copy of the new notification setting entity. Use the returned `endpoint_secret_key` for webhook signature verification."
      parameters: []
      responses:
        201:
          description: "The request has succeeded and a new resource has been created as a result."
          headers:
            Request-Id:
              required: true
              schema:
                $ref: "#/components/schemas/RequestId"
          content:
            application/json:
              schema:
                type: "object"
                required:
                - "data"
                - "meta"
                properties:
                  data:
                    $ref: "#/components/schemas/NotificationSetting"
                  meta:
                    $ref: "#/components/schemas/Meta"
              examples:
                Create a notification setting (201):
                  summary: "Create a notification setting (201)"
                  value:
                    data:
                      id: "ntfset_01gkpjp8bkm3tm53kdgkx6sms7"
                      description: "Slack notifications"
                      type: "url"
                      destination: "https://hooks.slack.com/example"
                      active: true
                      api_version: 1
                      include_sensitive_fields: false
                      traffic_source: "all"
                      subscribed_events:
