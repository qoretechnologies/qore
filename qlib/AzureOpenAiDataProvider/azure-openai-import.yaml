        - $ref: '#/components/schemas/audioVerboseResponse'
      replacement:
        anyOf: *id017
    - pointer: '#/paths/~1deployments~1{deployment-id}~1audio~1translations/post/responses/200/content/application~1json/schema'
      expected:
