  - reason: The documented simple and verbose JSON audio responses both require only text, so their alternatives
      overlap. Use anyOf; retain each response schema and the separate text/plain representation. Add the documented
      temperature bounds. See https://learn.microsoft.com/en-us/azure/foundry/openai/reference-preview ; live Whisper
      and GPT transcription verified 2026-09-12. Encode timestamp granularities as repeated multipart fields using
      the documented [] name.
