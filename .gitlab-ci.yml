stages:
  - build
  - test

default:
  # A Kubernetes job pod can time out waiting for CPU capacity before tests start.
  retry:
    max: 2
    when: runner_system_failure
  services:
    - name: mariadb:11.4
      alias: mysql
    - name: pgvector/pgvector:pg18
      alias: pgsql
    - name: memcached:latest
      alias: memcached
    - name: redis:latest
      alias: redis
    - name: mongo:6.0
      alias: mongodb
  before_script:
    - . test/docker_test/tree-tested-skip.sh
    - |
        curl "https://api.github.com/repos/qoretechnologies/${REPO_NAME}/statuses/${CI_COMMIT_SHA}" \
        -X POST --oauth2-bearer ${GITHUB_ACCESS_TOKEN} -H "Content-Type: application/json" \
        -d "{\"state\": \"pending\", \"context\": \"${REPO_NAME}\", \"description\": \"Gitlab CI\", \"target_url\": \"${CI_JOB_URL}\"}"
    - set +e

variables:
  REPO_NAME: qore
  # Every job clones the last 3 commits only: the project sets no default depth, so each job cloned the whole history
  # (103-195 s per job in pipeline 63444).  No build or test reads more than HEAD and its parents: the build embeds
  # the HEAD commit (cmake/UpdateGitRevision.cmake), the checks list the tracked files (git ls-files) and
  # tree-already-tested.sh reads the parents of HEAD; test_ci_shallow_clone.py in examples/test/runner keeps it so
  GIT_DEPTH: "3"
  POSTGRES_PASSWORD: qore
  POSTGRES_PASSWORD_MAP: pgsql=qore
  TZ: 'Europe/Prague'
  PGTZ: 'Europe/Prague'
  TDSVER: "7.3"
  MYSQL_DATABASE: qore
  MYSQL_ROOT_PASSWORD: qore
  QORE_DB_CONNSTR_MYSQL: 'mysql:root/qore@qore(UTF8)%mysql'
  MEMCACHED_URL: 'memcached://memcached:11211'
  REDIS_URL: 'redis://redis:6379'
  MONGODB_URL: 'mongodb://mongodb:27017'
  QORE_TEST_OPTS: '-penable-debug'
  QORE_EXCLUDE_PERF_TESTS: "1"
  # the build downloads the third-party source archives of cmake/third-party-sources.cmake from this mirror (the
  # generic package registry of mirror/qore, read with the job token) before their upstream URLs
  QORE_THIRD_PARTY_MIRROR: "${CI_API_V4_URL}/projects/mirror%2Fqore/packages/generic"

# Every download of the build takes its source from cmake/third-party-sources.cmake, and the mirror has every archive
# listed there with its pinned SHA-256
# A develop commit whose tree already passed CI (a merged pull request that was up to date with develop) is not tested
# again: tree-already-tested.sh finds the pipeline that passed the tree, and every job sources tree-tested-skip.sh
# first, which then ends the job with success.  Without such a pipeline, or when the pipelines cannot be read, the
# whole pipeline runs.
tree-already-tested:
  stage: .pre
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop
  tags:
    - k8s
    - amd64
  services: []
  before_script: []
  # only a push (a merge) reuses a passed tree: a pipeline started manually, by a schedule or by a trigger tests the
  # tree again, as the test images (mutable develop tags) may have changed since it passed (GIT_DEPTH 3 is global)
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "push"
  script:
    - sh test/docker_test/tree-already-tested.sh
  artifacts:
    reports:
      dotenv: tree-tested.env

check-third-party-sources:
  stage: build
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop
  tags:
    - k8s
    - amd64
  services: []
  before_script: []
  script:
    - . test/docker_test/tree-tested-skip.sh
    - cmake -DQORE_THIRD_PARTY_MIRROR="${QORE_THIRD_PARTY_MIRROR}" -P cmake/QoreCheckThirdPartySources.cmake

# The release notes of each module begin with "- initial release" only and have no bullets before the first release
# section, the language release notes follow the structure in design/release-notes.md, and module logos have the
# standard sizes; the checkers' own tests run first
check-module-release-notes:
  stage: build
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop
  tags:
    - k8s
    - amd64
  services: []
  before_script: []
  script:
    - . test/docker_test/tree-tested-skip.sh
    - python3 examples/test/cmake/test_module_release_notes.py
    - git ls-files -z 'qlib/*.qm' 'qlib/**/*.qm' 'modules/*/docs/*.dox.tmpl' | xargs -0 python3 -I doxygen/check-module-release-notes.py
    - python3 examples/test/cmake/test_release_notes.py
    - python3 -I doxygen/check-release-notes.py
    - python3 examples/test/cmake/test_module_mainpage_layout.py
    - git ls-files -z 'qlib/*.qm' 'qlib/**/*.qm' 'qlib/**/*.qc' 'modules/*/docs/*.dox.tmpl' | xargs -0 python3 -I doxygen/check-module-mainpage.py --sources

# The interpreter-free core of the HTTP server fast routes (lib/HttpFastRoutes.cpp), built with its standalone test under
# AddressSanitizer + UndefinedBehaviorSanitizer and under ThreadSanitizer (it needs no Qore build)
check-fast-routes-core-sanitizers:
  stage: build
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop
  tags:
    - k8s
    - amd64
  services: []
  before_script: []
  script:
    - . test/docker_test/tree-tested-skip.sh
    - test/cpp/run-sanitizers.sh

# Build stage - compile once per platform, save build/ as artifact
build-ubuntu-amd64:
  stage: build
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop
  tags:
