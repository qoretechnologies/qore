stages:
  - build
  - test
  - perf

default:
  services:
    - name: mariadb:lts
      alias: mysql
    - name: postgres:18
      alias: pgsql
    - name: memcached:latest
      alias: memcached
    - name: redis:latest
      alias: redis
    - name: mongo:6.0
      alias: mongodb
  before_script:
    - |
        curl "https://api.github.com/repos/qoretechnologies/${REPO_NAME}/statuses/${CI_COMMIT_SHA}" \
        -X POST --oauth2-bearer ${GITHUB_ACCESS_TOKEN} -H "Content-Type: application/json" \
        -d "{\"state\": \"pending\", \"context\": \"${REPO_NAME}\", \"description\": \"Gitlab CI\", \"target_url\": \"${CI_JOB_URL}\"}"
    - set +e

variables:
  REPO_NAME: qore
  POSTGRES_PASSWORD: omq
  POSTGRES_PASSWORD_MAP: pgsql=omq
  TZ: 'Europe/Prague'
  PGTZ: 'Europe/Prague'
  TDSVER: "7.3"
  MYSQL_DATABASE: omq
  MYSQL_ROOT_PASSWORD: omq
  QORE_DB_CONNSTR_MYSQL: 'mysql:root/omq@omq(UTF8)%mysql'
  MEMCACHED_URL: 'memcached://memcached:11211'
  REDIS_URL: 'redis://redis:6379'
  MONGODB_URL: 'mongodb://mongodb:27017'
  QORE_TEST_OPTS: '-penable-debug'
  QORE_EXCLUDE_PERF_TESTS: "1"

# Build stage - compile once per platform, save build/ as artifact
build-ubuntu-amd64:
  stage: build
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop
  tags:
    - k8s
    - amd64
  services: []
  before_script: []
  script:
    - test/docker_test/build.sh
  artifacts:
    paths:
      - build/
    expire_in: 1 day

build-ubuntu-arm64:
  stage: build
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop-arm64
  tags:
    - k8s
    - arm64
  services: []
  before_script: []
  script:
    - test/docker_test/build.sh
  artifacts:
    paths:
      - build/
    expire_in: 1 day

build-alpine-amd64:
  stage: build
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop-alpine
  tags:
    - k8s
    - amd64
  services: []
  before_script: []
  script:
    - test/docker_test/build.sh
  artifacts:
    paths:
      - build/
    expire_in: 1 day

build-alpine-arm64:
  stage: build
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop-alpine-arm64
  tags:
    - k8s
    - arm64
  services: []
  before_script: []
  script:
    - test/docker_test/build.sh
  artifacts:
    paths:
      - build/
    expire_in: 1 day

# Test stage - install pre-built artifacts and run tests
test-ubuntu-amd64:
  stage: test
  parallel: 2
  needs: [build-ubuntu-amd64]
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop
  tags:
    - k8s
    - amd64
  variables:
    QORE_DB_CONNSTR_FREETDS: 'freetds:test/test@rippy'
  script:
    - |
        if test/docker_test/test-ubuntu.sh; then
          curl "https://api.github.com/repos/qoretechnologies/${REPO_NAME}/statuses/${CI_COMMIT_SHA}" \
            -X POST --oauth2-bearer ${GITHUB_ACCESS_TOKEN} -H "Content-Type: application/json" \
            -d "{\"state\": \"success\", \"context\": \"${REPO_NAME}\", \"description\": \"Gitlab CI\", \"target_url\": \"${CI_JOB_URL}\"}"
          exit 0
        else
          curl "https://api.github.com/repos/qoretechnologies/${REPO_NAME}/statuses/${CI_COMMIT_SHA}" \
            -X POST --oauth2-bearer ${GITHUB_ACCESS_TOKEN} -H "Content-Type: application/json" \
            -d "{\"state\": \"failure\", \"context\": \"${REPO_NAME}\", \"description\": \"Gitlab CI\", \"target_url\": \"${CI_JOB_URL}\"}"
          exit 1
        fi
  artifacts:
    when: on_failure
    paths:
      - crash-dumps/
    expire_in: 7 days

test-ubuntu-arm64:
  stage: test
  parallel: 2
  needs: [build-ubuntu-arm64]
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop-arm64
  tags:
    - k8s
    - arm64
  variables:
    QORE_DB_CONNSTR_FREETDS: 'freetds:test/test@rippy'
  script:
    - |
        if test/docker_test/test-ubuntu.sh; then
          curl "https://api.github.com/repos/qoretechnologies/${REPO_NAME}/statuses/${CI_COMMIT_SHA}" \
            -X POST --oauth2-bearer ${GITHUB_ACCESS_TOKEN} -H "Content-Type: application/json" \
            -d "{\"state\": \"success\", \"context\": \"${REPO_NAME}\", \"description\": \"Gitlab CI\", \"target_url\": \"${CI_JOB_URL}\"}"
          exit 0
        else
          curl "https://api.github.com/repos/qoretechnologies/${REPO_NAME}/statuses/${CI_COMMIT_SHA}" \
