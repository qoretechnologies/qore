          exit 1
        fi
  artifacts:
    when: on_failure
    paths:
      - crash-dumps/
    expire_in: 7 days

test-alpine-arm64:
  stage: test
  parallel: 2
  needs: [build-alpine-arm64]
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop-alpine-arm64
  tags:
    - k8s
    - arm64
  variables:
    QORE_DB_CONNSTR_FREETDS: 'freetds:test/test@rippy'
  script:
    - |
        if test/docker_test/test-alpine.sh; then
          curl "https://api.github.com/repos/qoretechnologies/${REPO_NAME}/statuses/${CI_COMMIT_SHA}" \
            -X POST --oauth2-bearer ${GITHUB_ACCESS_TOKEN} -H "Content-Type: application/json" \
            -d "{\"state\": \"success\", \"context\": \"${REPO_NAME}\", \"description\": \"Gitlab CI\", \"target_url\": \"${CI_JOB_URL}\"}"
          exit 0
        else
          curl "https://api.github.com/repos/qoretechnologies/${REPO_NAME}/statuses/${CI_COMMIT_SHA}" \
            -X POST --oauth2-bearer ${GITHUB_ACCESS_TOKEN} -H "Content-Type: application/json" \
            -d "{\"state\": \"failure\", \"context\": \"${REPO_NAME}\", \"description\": \"Gitlab CI\", \"target_url\": \"${CI_JOB_URL}\"}"
          exit 1
        fi
  artifacts:
    when: on_failure
    paths:
      - crash-dumps/
    expire_in: 7 days

test-macos:
  stage: test
  needs: []
  tags:
    - macos
  services: []
  variables:
    QORE_TEST_OPTS: '-penable-debug'
    QORE_EXCLUDE_PERF_TESTS: "1"
  before_script:
    - |
        curl "https://api.github.com/repos/qoretechnologies/${REPO_NAME}/statuses/${CI_COMMIT_SHA}" \
        -X POST --oauth2-bearer ${GITHUB_ACCESS_TOKEN} -H "Content-Type: application/json" \
        -d "{\"state\": \"pending\", \"context\": \"${REPO_NAME}-macos\", \"description\": \"Gitlab CI macOS\", \"target_url\": \"${CI_JOB_URL}\"}"
  script:
    - |
        if test/docker_test/test-macos.sh; then
          curl "https://api.github.com/repos/qoretechnologies/${REPO_NAME}/statuses/${CI_COMMIT_SHA}" \
            -X POST --oauth2-bearer ${GITHUB_ACCESS_TOKEN} -H "Content-Type: application/json" \
            -d "{\"state\": \"success\", \"context\": \"${REPO_NAME}-macos\", \"description\": \"Gitlab CI macOS\", \"target_url\": \"${CI_JOB_URL}\"}"
          exit 0
        else
          curl "https://api.github.com/repos/qoretechnologies/${REPO_NAME}/statuses/${CI_COMMIT_SHA}" \
            -X POST --oauth2-bearer ${GITHUB_ACCESS_TOKEN} -H "Content-Type: application/json" \
            -d "{\"state\": \"failure\", \"context\": \"${REPO_NAME}-macos\", \"description\": \"Gitlab CI macOS\", \"target_url\": \"${CI_JOB_URL}\"}"
          exit 1
        fi
  artifacts:
    when: on_failure
    paths:
      - crash-dumps/
    expire_in: 7 days

test-perf:
  stage: perf
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop
  tags:
    - k8s
    - amd64
  services: []
  # Don't download build artifacts — test-perf rebuilds from scratch with
  # Release optimization.  Without this, artifacts from all 4 build jobs
  # (different architectures/platforms) are extracted into build/, corrupting
  # the cmake cache and causing module-loading failures.
  dependencies: []
  allow_failure: true
  variables:
    QORE_PERF_TESTS_ONLY: "1"
    QORE_EXCLUDE_PERF_TESTS: ""
  before_script:
    - set +e
  script:
    - test/docker_test/test-perf.sh
  artifacts:
    when: on_failure
    paths:
      - crash-dumps/
    expire_in: 7 days
