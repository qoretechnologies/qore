  stage: test
  timeout: 105 minutes
  needs: [build-perf, {job: tree-already-tested, optional: true}]
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop
  tags:
    - k8s
    - amd64
  services: []
  variables:
    QORE_PERF_TESTS_ONLY: "1"
    QORE_EXCLUDE_PERF_TESTS: ""
  before_script:
    - . test/docker_test/tree-tested-skip.sh
    - |
        curl "https://api.github.com/repos/qoretechnologies/${REPO_NAME}/statuses/${CI_COMMIT_SHA}" \
        -X POST --oauth2-bearer ${GITHUB_ACCESS_TOKEN} -H "Content-Type: application/json" \
        -d "{\"state\": \"pending\", \"context\": \"${REPO_NAME}-perf\", \"description\": \"Gitlab CI perf\", \"target_url\": \"${CI_JOB_URL}\"}"
    - set +e
  script:
    - |
        if test/docker_test/test-perf.sh; then
          curl "https://api.github.com/repos/qoretechnologies/${REPO_NAME}/statuses/${CI_COMMIT_SHA}" \
            -X POST --oauth2-bearer ${GITHUB_ACCESS_TOKEN} -H "Content-Type: application/json" \
            -d "{\"state\": \"success\", \"context\": \"${REPO_NAME}-perf\", \"description\": \"Gitlab CI perf\", \"target_url\": \"${CI_JOB_URL}\"}"
          exit 0
        else
          curl "https://api.github.com/repos/qoretechnologies/${REPO_NAME}/statuses/${CI_COMMIT_SHA}" \
            -X POST --oauth2-bearer ${GITHUB_ACCESS_TOKEN} -H "Content-Type: application/json" \
            -d "{\"state\": \"failure\", \"context\": \"${REPO_NAME}-perf\", \"description\": \"Gitlab CI perf\", \"target_url\": \"${CI_JOB_URL}\"}"
          exit 1
        fi
  artifacts:
    when: on_failure
    paths:
      - crash-dumps/
    expire_in: 7 days

# The build-system tests (examples/test/cmake): the CMake macros and scripts, qpp, qcc and the documentation toolchain,
# with real CMake, Doxygen and compilers, against the build job's build/; and the tests of the test runner
# (examples/test/runner)
test-cmake-ubuntu-amd64:
  stage: test
  timeout: 30 minutes
  needs: [build-ubuntu-amd64, {job: tree-already-tested, optional: true}]
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop
  tags:
    - k8s
    - amd64
  services: []
  before_script: []
  script:
    - . test/docker_test/tree-tested-skip.sh
    - test/docker_test/test-cmake.sh

test-cmake-alpine-amd64:
  stage: test
  timeout: 30 minutes
  needs: [build-alpine-amd64, {job: tree-already-tested, optional: true}]
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop-alpine
  tags:
    - k8s
    - amd64
  services: []
  before_script: []
  script:
    - . test/docker_test/tree-tested-skip.sh
    - test/docker_test/test-cmake.sh
