        -X POST --oauth2-bearer ${GITHUB_ACCESS_TOKEN} -H "Content-Type: application/json" \
        -d "{\"state\": \"pending\", \"context\": \"${REPO_NAME}-ir\", \"description\": \"Gitlab CI IR Mode\", \"target_url\": \"${CI_JOB_URL}\"}"
    - set +e
  script:
    - |
