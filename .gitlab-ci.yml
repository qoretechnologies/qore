stages:
  - build
  - test

default:
  # A Kubernetes job pod can time out waiting for CPU capacity before tests start.
  retry:
    max: 2
    when: runner_system_failure
  services:
    - name: mariadb:11.4
      alias: mysql
    - name: pgvector/pgvector:pg18
      alias: pgsql
    - name: memcached:latest
      alias: memcached
    - name: redis:latest
      alias: redis
    - name: mongo:6.0
      alias: mongodb
  before_script:
    - . test/docker_test/tree-tested-skip.sh
    - |
        curl "https://api.github.com/repos/qoretechnologies/${REPO_NAME}/statuses/${CI_COMMIT_SHA}" \
        -X POST --oauth2-bearer ${GITHUB_ACCESS_TOKEN} -H "Content-Type: application/json" \
        -d "{\"state\": \"pending\", \"context\": \"${REPO_NAME}\", \"description\": \"Gitlab CI\", \"target_url\": \"${CI_JOB_URL}\"}"
    - set +e

variables:
  REPO_NAME: qore
  # Every job clones the last 3 commits only: the project sets no default depth, so each job cloned the whole history
  # (103-195 s per job in pipeline 63444).  No build or test reads more than HEAD and its parents: the build embeds
  # the HEAD commit (cmake/UpdateGitRevision.cmake), the checks list the tracked files (git ls-files) and
  # tree-already-tested.sh reads the parents of HEAD; test_ci_shallow_clone.py in examples/test/runner keeps it so
  GIT_DEPTH: "3"
  POSTGRES_PASSWORD: qore
  POSTGRES_PASSWORD_MAP: pgsql=qore
  TZ: 'Europe/Prague'
  PGTZ: 'Europe/Prague'
  TDSVER: "7.3"
  MYSQL_DATABASE: qore
  MYSQL_ROOT_PASSWORD: qore
  QORE_DB_CONNSTR_MYSQL: 'mysql:root/qore@qore(UTF8)%mysql'
  MEMCACHED_URL: 'memcached://memcached:11211'
  REDIS_URL: 'redis://redis:6379'
  MONGODB_URL: 'mongodb://mongodb:27017'
  QORE_TEST_OPTS: '-penable-debug'
  QORE_EXCLUDE_PERF_TESTS: "1"
  # A test job fails when a native module of its image has no build for the module API of the qore under test, as its
  # tests would be skipped (pipeline 64250).  Only a batch that changes the module API, whose images cannot have the
  # modules of the new API yet, sets QORE_CI_NATIVE_MODULE_API_TRANSITION: "1" here; its jobs then name the modules
  # that they do not test, before and after the tests, and a job with it set while not needed says so.  See
  # examples/test/docker_test/ci-native-modules.sh.
  # QORE_CI_NATIVE_MODULE_API_TRANSITION: "1"

  # the build downloads the third-party source archives of cmake/third-party-sources.cmake from this mirror (the
  # generic package registry of mirror/qore, read with the job token) before their upstream URLs
  QORE_THIRD_PARTY_MIRROR: "${CI_API_V4_URL}/projects/mirror%2Fqore/packages/generic"

# Every download of the build takes its source from cmake/third-party-sources.cmake, and the mirror has every archive
# listed there with its pinned SHA-256
# A develop commit whose tree already passed CI (a merged pull request that was up to date with develop) is not tested
# again: tree-already-tested.sh finds the pipeline that passed the tree, and every job sources tree-tested-skip.sh
# first, which then ends the job with success.  Without such a pipeline, or when the pipelines cannot be read, the
# whole pipeline runs.
tree-already-tested:
  stage: .pre
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop
  tags:
    - k8s
    - amd64
  services: []
  before_script: []
  # only a push (a merge) reuses a passed tree: a pipeline started manually, by a schedule or by a trigger tests the
  # tree again, as the test images (mutable develop tags) may have changed since it passed (GIT_DEPTH 3 is global)
  rules:
    - if: $CI_COMMIT_BRANCH == "develop" && $CI_PIPELINE_SOURCE == "push"
  script:
    - sh test/docker_test/tree-already-tested.sh
  artifacts:
    reports:
      dotenv: tree-tested.env

check-third-party-sources:
  stage: build
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop
  tags:
    - k8s
    - amd64
  services: []
  before_script: []
  script:
    - . test/docker_test/tree-tested-skip.sh
    - cmake -DQORE_THIRD_PARTY_MIRROR="${QORE_THIRD_PARTY_MIRROR}" -P cmake/QoreCheckThirdPartySources.cmake

# The release notes of each module begin with "- initial release" only and have no bullets before the first release
# section, the language release notes follow the structure in design/release-notes.md, and module logos have the
# standard sizes; the checkers' own tests run first
check-module-release-notes:
  stage: build
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop
  tags:
    - k8s
    - amd64
  services: []
  before_script: []
  script:
    - . test/docker_test/tree-tested-skip.sh
    - python3 examples/test/cmake/test_module_release_notes.py
    - git ls-files -z 'qlib/*.qm' 'qlib/**/*.qm' 'modules/*/docs/*.dox.tmpl' | xargs -0 python3 -I doxygen/check-module-release-notes.py
    - python3 examples/test/cmake/test_release_notes.py
    - python3 -I doxygen/check-release-notes.py
    - python3 examples/test/cmake/test_module_mainpage_layout.py
    - git ls-files -z 'qlib/*.qm' 'qlib/**/*.qm' 'qlib/**/*.qc' 'modules/*/docs/*.dox.tmpl' | xargs -0 python3 -I doxygen/check-module-mainpage.py --sources

# The interpreter-free core of the HTTP server fast routes (lib/HttpFastRoutes.cpp), built with its standalone test under
# AddressSanitizer + UndefinedBehaviorSanitizer and under ThreadSanitizer (it needs no Qore build)
check-fast-routes-core-sanitizers:
  stage: build
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop
  tags:
    - k8s
    - amd64
  services: []
  before_script: []
  script:
    - . test/docker_test/tree-tested-skip.sh
    - test/cpp/run-sanitizers.sh

# The core library, qore, qcc and the binary modules with a single compilation unit build compile and link from
# separate compilation units (-DSINGLE_COMPILATION_UNIT=OFF): the build jobs compile each of them as one unit, in which
# a source file that does not include what it uses, or a template that is not instantiated where it is defined, still
# compiles and links.  Build only, without the AOT modules and without tests (test/docker_test/build-separate-units.sh);
# it runs in the build stage, on one platform, and stops at the first error
check-build-separate-units:
  stage: build
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop
  tags:
    - k8s
    - amd64
  services: []
  before_script: []
  script:
    - . test/docker_test/tree-tested-skip.sh
    - test/docker_test/build-separate-units.sh

# The qmod build cache (design/qmod-build-cache.md): every job that builds Qore reuses the AOT modules that earlier
# jobs compiled, from a directory of the host that its runner mounts into the job and names in QORE_QMOD_CACHE_DIR (the
# runner sets it; without it, or when the directory is not mounted, the build runs without the cache).  A module is
# reused only when everything that can change what qcc writes is unchanged; test/docker_test/qmod-cache.sh fails the
# job when a module the cache supplied is not what it verified, prunes the cache after every job (entries unused for
# QORE_QMOD_CACHE_MAX_AGE_DAYS days, then the least recently used ones above QORE_QMOD_CACHE_MAX_SIZE_MB MiB per job
# name) and prints the hits, misses and the cache size before and after pruning.  A sample of the modules the cache
# supplies is compiled again and must be byte for byte the same (QORE_QMOD_CACHE_AUDIT; 1 audits every one).
# Only the jobs of protected refs write the cache, and sign its entries after the build with the Ed25519 private key
# QORE_QMOD_CACHE_SIGNING_KEY (a protected CI variable of type File, limited to the build jobs' environment, which no
# process of the build gets); every job uses only entries that the public key QORE_QMOD_CACHE_VERIFY_KEY (a CI
# variable) verifies.  The jobs that build Qore on the writer's runner name the environment "qmod-cache-build"
# (action "prepare": no deployment), to which the private key's variable is scoped, so that no other job gets it.
# QORE_QMOD_CACHE_DISABLE=1 compiles every module and stores nothing.
# The cache's runners (design/qmod-build-cache-runners.md): a job of a protected ref runs on the runner that mounts
# the cache read-write (tags qmod-cache-writer and the architecture; macOS: macos-qmod-cache-writer), the other jobs on
# the one that mounts it read-only (qmod-cache-reader and the architecture; macOS: the existing runner, tag macos).
# Until those runners are registered, the CI variable QORE_QMOD_CACHE_RUNNERS is unset and the jobs keep the shared
# runners' tags (k8s, macos), which mount no cache, so the jobs build without it; QORE_QMOD_CACHE_RUNNERS=1 switches.
# Only a job that runs on the writer's runner names the environment qmod-cache-build, to which the signing key's
# variable is scoped: every other job (on the shared runners, which run privileged pods, or on the reader's runner)
# names qmod-cache-read, so GitLab never writes the key into it.  A pipeline variable must not be able to override
# these variables (pipeline variables Maintainer-only; see design/qmod-build-cache-runners.md).
.qmod-cache:
  environment:
    name: $QORE_QMOD_CACHE_ENVIRONMENT
    action: prepare
  variables:
    QORE_QMOD_CACHE_AUDIT: "0.03:${CI_PIPELINE_ID}"
    QORE_QMOD_CACHE_MAX_SIZE_MB: "3072"
    QORE_QMOD_CACHE_MAX_AGE_DAYS: "7"
    QORE_QMOD_CACHE_RUNNER_TAG: k8s
    QORE_QMOD_CACHE_MACOS_RUNNER_TAG: macos
    QORE_QMOD_CACHE_ENVIRONMENT: qmod-cache-read
  # as for a job without rules, no merge request pipeline runs these jobs; the rules only choose the runner's tag
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$QORE_QMOD_CACHE_RUNNERS == "1" && $CI_COMMIT_REF_PROTECTED == "true"'
      variables:
        QORE_QMOD_CACHE_RUNNER_TAG: qmod-cache-writer
        QORE_QMOD_CACHE_MACOS_RUNNER_TAG: macos-qmod-cache-writer
        QORE_QMOD_CACHE_ENVIRONMENT: qmod-cache-build
    - if: '$QORE_QMOD_CACHE_RUNNERS == "1"'
      variables:
        QORE_QMOD_CACHE_RUNNER_TAG: qmod-cache-reader
        QORE_QMOD_CACHE_MACOS_RUNNER_TAG: macos
    - when: on_success

# Build stage - compile once per platform, save build/ as artifact
build-ubuntu-amd64:
  extends: .qmod-cache
  stage: build
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop
  tags:
    - $QORE_QMOD_CACHE_RUNNER_TAG
    - amd64
  services: []
  before_script: []
  script:
    - . test/docker_test/tree-tested-skip.sh
    - test/docker_test/build.sh
  artifacts:
    paths:
      - build/
    expire_in: 1 day

