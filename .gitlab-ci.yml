# Test stage - install pre-built artifacts and run tests
# Every test job has a 105-minute time limit: the tests of the slowest job (test-jit-ubuntu-amd64 2/2) took 76 minutes
# on a busy node (job 213206).
test-ubuntu-amd64:
  stage: test
  parallel: 2
  timeout: 105 minutes
  needs: [build-ubuntu-amd64, {job: tree-already-tested, optional: true}]
  image: $CI_REGISTRY/infrastructure/qore-test-base/qore-test-base:develop
  tags:
    - k8s
    - amd64
  variables:
    QORE_DB_CONNSTR_FREETDS: 'freetds:test/test@rippy'
    TEST_TIMEOUT: "600"
  script:
    - |
        if test/docker_test/test-ubuntu.sh; then
          curl "https://api.github.com/repos/qoretechnologies/${REPO_NAME}/statuses/${CI_COMMIT_SHA}" \
            -X POST --oauth2-bearer ${GITHUB_ACCESS_TOKEN} -H "Content-Type: application/json" \
            -d "{\"state\": \"success\", \"context\": \"${REPO_NAME}\", \"description\": \"Gitlab CI\", \"target_url\": \"${CI_JOB_URL}\"}"
          exit 0
        else
          curl "https://api.github.com/repos/qoretechnologies/${REPO_NAME}/statuses/${CI_COMMIT_SHA}" \
            -X POST --oauth2-bearer ${GITHUB_ACCESS_TOKEN} -H "Content-Type: application/json" \
            -d "{\"state\": \"failure\", \"context\": \"${REPO_NAME}\", \"description\": \"Gitlab CI\", \"target_url\": \"${CI_JOB_URL}\"}"
          exit 1
        fi
  artifacts:
    when: on_failure
    paths:
      - crash-dumps/
    expire_in: 7 days

