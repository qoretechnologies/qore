openapi: "3.1.0"
info:
  version: 1.0.0
  title: Swagger Petstore 3.1
  summary: An OpenAPI 3.1 variant of the Petstore used to exercise 3.1-only constructs
  description: >
    A minimal OpenAPI 3.1 document exercising the 3.1-specific constructs supported by the OpenApi3
    module: scalar and array "null" types, the object form of "discriminator", top-level "webhooks",
    JSON Schema 2020-12 keywords, numeric "exclusiveMinimum"/"exclusiveMaximum", "contentEncoding"
    and "contentMediaType", "info.summary" and the SPDX "license.identifier".
  license:
    name: Apache 2.0
    identifier: Apache-2.0
servers:
  - url: https://petstore.swagger.io/v31
paths:
  /pets:
    get:
      description: Returns all pets
      operationId: findPets31
      parameters:
        - name: limit
          in: query
          description: maximum number of results to return
          required: false
          schema:
            type: integer
            exclusiveMinimum: 0
            exclusiveMaximum: 100
      responses:
        "200":
          description: pet response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
    post:
      description: Creates a new pet
      operationId: addPet31
      requestBody:
        description: Pet to add
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPet"
      responses:
        "200":
          description: pet response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
webhooks:
  petCreated:
    post:
      summary: A new pet was created
      operationId: petCreatedWebhook
      requestBody:
        description: the new pet
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Pet"
      responses:
        "200":
          description: acknowledged
components:
  schemas:
    Pet:
      type: object
      required:
        - id
        - name
        - petType
      # OpenAPI 3.x object form of "discriminator" (the Swagger 2.0 string form is also accepted)
      discriminator:
        propertyName: petType
        mapping:
          dog: "#/components/schemas/Dog"
          cat: "#/components/schemas/Cat"
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        petType:
          type: string
        # OpenAPI 3.1 array form of "type" expressing nullability
        tag:
          type:
            - string
            - "null"
        # OpenAPI 3.1 scalar "null" type as an "anyOf" member expressing nullability
        nickname:
          anyOf:
            - type: string
            - type: "null"
        # JSON Schema 2020-12 "examples" array
        color:
          type: string
          examples:
            - black
            - white
        # JSON Schema 2020-12 "const"
        kind:
          type: string
          const: pet
        # JSON Schema 2020-12 "prefixItems" (tuple validation)
        coordinates:
          type: array
          prefixItems:
            - type: number
            - type: number
          items:
            type: number
        # OpenAPI 3.1 binary content annotations
        photo:
          type: string
          contentEncoding: base64
          contentMediaType: image/png
    Dog:
      allOf:
        - $ref: "#/components/schemas/Pet"
        - type: object
          properties:
            packSize:
              type: integer
    Cat:
      allOf:
        - $ref: "#/components/schemas/Pet"
        - type: object
          properties:
            indoor:
              type: boolean
    NewPet:
      type: object
      # JSON Schema 2020-12 "unevaluatedProperties"
      unevaluatedProperties: false
      required:
        - name
        - petType
      properties:
        name:
          type: string
        petType:
          type: string
        tag:
          type:
            - string
            - "null"
